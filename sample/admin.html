<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>セラピスト管理｜デモ</title><style>:root{--accent:#ff5caa}*{box-sizing:border-box}body{margin:0;background:#151119;color:#fff0f7;font:14px 'Yu Gothic',sans-serif}main{max-width:700px;margin:auto;padding:16px 16px 90px}h1{font-size:23px}h2{font-size:17px;color:#ff9ccf}section{background:#29212f;border:1px solid #60415b;border-radius:15px;padding:17px;margin:16px 0}.item{background:#1d1723;border-radius:11px;padding:12px;margin:10px 0;border:1px solid #443346}label{display:block;margin:9px 0 4px;font-weight:600}input,select,textarea{width:100%;background:#151119;color:#fff;border:1px solid #70526b;border-radius:8px;padding:10px;font:inherit}textarea{min-height:65px}input[type=checkbox]{width:auto;transform:scale(1.2);margin:9px}button,a.btn{border:0;background:var(--accent);color:#211322;padding:10px 13px;border-radius:9px;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0;text-decoration:none;display:inline-block}button.secondary{background:#544056;color:#fff}.muted{font-size:12px;color:#c8afc2;line-height:1.7}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.sticky{position:sticky;bottom:0;background:#151119ef;padding:12px;border-top:1px solid #77506c;z-index:4}.dategrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dategrid button{font-size:11px;margin:0;padding:10px 2px;background:#46344b;color:#fff}.dategrid button.selected{background:#ff5caa;color:#211322}.dategrid button.shift{border:2px solid #72b5f2}.small{font-size:12px}.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.dashboard-item{position:relative;min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;background:#29212f;border:1px solid #60415b;border-radius:16px;padding:16px 9px;color:#fff0f7;text-decoration:none}.dashboard-item:active{background:#403047}.dashboard-item strong{font-size:14px}.dashboard-item small{font-size:10px;color:#c8afc2;line-height:1.5}.dash-num{position:absolute;top:10px;right:12px;color:#c8afc2;font-size:10px}.dash-icon{display:grid;place-items:center;width:53px;height:53px;background:#443044;color:#ff8dc3;border-radius:14px;font-size:30px}.sticky[hidden]{display:none}.btn.secondary{background:#544056;color:#fff}</style></head><body><main><h1>あなたの管理ページ <span class="small">DEMO</span></h1><p class="muted">元のHTMLをベースにした改修版です。データはこのブラウザ内にのみ保存されます。ログイン認証・Supabase同期・サーバーへの画像アップロードは未実装です。下部アイコンはブラウザ内に画像を保存できます。初期状態に写真・文章・料金・出勤・エリアのサンプルデータを登録済みです。画像は外部のサンプル写真URLで指定しています。変更内容はこのブラウザ内で保存されます。</p><a class="btn" href="index.html">公開ページを見る</a><div id="root"></div><div class="sticky"><button onclick="save()">すべての設定を保存</button><button class="secondary" onclick="if(confirm('初期化しますか？')){localStorage.removeItem(KEY);location.reload()}">初期化</button></div></main><script src="shared.js"></script><script>
let d=getData(),root=document.getElementById('root'),selected=new Set(),month=new Date();month.setDate(1);
const ADMIN_PAGES=[
 ['basic','基本情報','user-round','名前・HERO・PERSONAL・INTRO・PROFILE'],
 ['news','NEWS管理','megaphone','お知らせの作成・編集'],
 ['images','画像管理','images','HERO・PERSONAL・出勤画像'],
 ['photos','PHOTO管理','camera','写真の追加・並び替え'],
 ['shifts','出勤管理','calendar-days','シフト・休み・完売'],
 ['links','SNS・URL管理','link','個人SNS・店舗連絡先'],
 ['booking','予約・料金管理','calendar-check','フォーム・料金'],
 ['areas','エリア管理','map-pin','アクセス・交通費'],
 ['layout','ページ構成管理','layout-template','表示順・メニュー画像'],
 ['ogp','OGP設定','share-2','共有画像・タイトル']
];
const currentPage=new URLSearchParams(location.search).get('page')||'top';
const PAGE_SECTIONS={
 basic:['HERO / NEWS / INTRODUCTION','PROFILE（右側3項目）'],
 news:['NEWS管理・お知らせ一覧'],images:['画像管理（URL指定）'],photos:['PHOTO（3:4）'],
 shifts:['出勤カレンダー・一括設定'],links:['リンク・URL一元管理'],
 booking:['姫予約フォームの項目','料金シミュレーター'],
 areas:['出張・交通費','LOCATION GUIDE'],
 layout:['下部メニューバーのアイコン','セクションの表示・並び順'],
 ogp:['OGP・SNS共有設定']
};
const pageInfo=ADMIN_PAGES.find(x=>x[0]===currentPage);
const header=document.querySelector('h1');
const sticky=document.querySelector('.sticky');
const originalIntro=document.querySelector('main > p.muted');
const originalViewLink=document.querySelector('main > a.btn');
if(currentPage==='top'){
 header.textContent='あなたの管理ページ';
 sticky.hidden=true;originalIntro.hidden=true;
 root.innerHTML='<p class="muted">変更する項目を選択してください。</p>';
 const grid=document.createElement('div');grid.className='dashboard';
 ADMIN_PAGES.forEach(([id,title,icon,desc],i)=>{const a=document.createElement('a');a.className='dashboard-item';a.href='admin.html?page='+id;a.innerHTML='<span class="dash-num">'+String(i+1).padStart(2,'0')+'</span><span class="dash-icon">'+({basic:'♙',news:'✦',images:'▧',photos:'▣',shifts:'▦',links:'↗',booking:'▤',areas:'⌖',layout:'☷',ogp:'◇'}[id])+'</span><strong>'+title+'</strong><small>'+desc+'</small>';grid.append(a)});
 root.append(grid);
}else{
 if(!pageInfo){location.replace('admin.html')}
 header.textContent=pageInfo?pageInfo[1]:'管理ページ';
 originalIntro.hidden=true;originalViewLink.insertAdjacentHTML('beforebegin','<a class="btn secondary" href="admin.html">← 管理TOPへ戻る</a>');
}

function section(title){let s=document.createElement('section');s.innerHTML='<h2>'+title+'</h2>';if(currentPage!=='top'&&(PAGE_SECTIONS[currentPage]||[]).includes(title))root.append(s);return s}
function textfield(parent,label,obj,key,type='text'){let l=document.createElement('label');l.textContent=label;let input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=obj[key]??'';input.oninput=()=>obj[key]=type==='number'?Number(input.value):input.value;parent.append(l,input);return input}
function check(parent,label,obj,key){let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=!!obj[key];i.onchange=()=>obj[key]=i.checked;l.append(i,' '+label);parent.append(l);return i}
function selectfield(parent,label,obj,key,options){let l=document.createElement('label'),sel=document.createElement('select');l.textContent=label;options.forEach(([value,name])=>{let o=document.createElement('option');o.value=value;o.textContent=name;sel.append(o)});sel.value=obj[key]||options[0][0];sel.onchange=()=>obj[key]=sel.value;parent.append(l,sel)}
function items(s,arr,fields,make,opts={}){let host=document.createElement('div');s.append(host);function render(){host.innerHTML='';arr.forEach((o,i)=>{let box=document.createElement('div');box.className='item';fields.forEach(f=>{if(f[2]==='checkbox')check(box,f[0],o,f[1]);else if(f[2]==='select')selectfield(box,f[0],o,f[1],f[3]);else textfield(box,f[0],o,f[1],f[2]||'text')});let row=document.createElement('div');row.className='row';[['↑',()=>{if(i){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];render()}}],['↓',()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];render()}}],...(opts.fixed?[]:[['削除',()=>{arr.splice(i,1);render()}]])].forEach(([t,fn])=>{let b=document.createElement('button');b.textContent=t;b.className='secondary';b.onclick=fn;row.append(b)});box.append(row);host.append(box)})}let add=document.createElement('button');add.textContent='＋ 追加';add.onclick=()=>{if(opts.limit&&arr.length>=opts.limit){alert('最大'+opts.limit+'項目です');return}arr.push(make());render()};if(!opts.fixed)s.append(add);render()}

// Each of the five bottom-nav images can be chosen independently.
{
const panel=section('下部メニューバーのアイコン');
const note=document.createElement('p');note.className='muted';note.textContent='新デザインを初期設定にしました。従来の6パターンからの選択や独自画像の登録もできます。5個を別々に変更できます。変更後は「すべての設定を保存」を押してください。';panel.append(note);
d.navIcons=d.navIcons||{};
const labels={home:'HOME',line:'LINE',x:'X',sub:'02',booking:'予約'};
const sample=document.createElement('div');sample.style.cssText='display:flex;justify-content:space-between;gap:5px;background:#1b1520;padding:12px 5px;border-radius:14px';panel.append(sample);
const previews={};
for(const key of NAV_KEYS){const im=document.createElement('img');im.alt=labels[key];im.style.cssText='width:18%;aspect-ratio:1;object-fit:contain';sample.append(im);previews[key]=im}
function refresh(){for(const key of NAV_KEYS)previews[key].src=navIconPath(key,d.navIcons[key])}
const all=document.createElement('div');all.className='row';const allSelect=document.createElement('select');{let o=document.createElement('option');o.value='new';o.textContent='新デザイン（初期設定）';allSelect.append(o)}for(let i=1;i<=6;i++){let o=document.createElement('option');o.value=String(i);o.textContent='パターン '+i;allSelect.append(o)}const allBtn=document.createElement('button');allBtn.textContent='5個すべてに適用';allBtn.onclick=()=>{for(const key of NAV_KEYS)d.navIcons[key]=allSelect.value;panel.querySelectorAll('[data-icon-choice]').forEach(el=>el.value=allSelect.value);refresh()};all.append(allSelect,allBtn);panel.append(all);
for(const key of NAV_KEYS){
 const item=document.createElement('div');item.className='item';const label=document.createElement('label');label.textContent=labels[key];item.append(label);
 const preview=document.createElement('img');preview.style.cssText='width:76px;height:76px;object-fit:contain;display:block;margin:8px auto';item.append(preview);
 const sel=document.createElement('select');sel.dataset.iconChoice=key;{let opt=document.createElement('option');opt.value='new';opt.textContent='新デザイン（初期設定）';sel.append(opt)}for(let i=1;i<=6;i++){let opt=document.createElement('option');opt.value=String(i);opt.textContent='パターン '+i;sel.append(opt)}let custom=document.createElement('option');custom.value='custom';custom.textContent='独自画像';sel.append(custom);
 const setting=d.navIcons[key]||'new';sel.value=setting.startsWith('custom:')?'custom':setting;
 const url=document.createElement('input');url.placeholder='画像URL（https://...）';url.value=setting.startsWith('custom:')&&setting.slice(7).startsWith('http')?setting.slice(7):'';
 function setPreview(){preview.src=navIconPath(key,d.navIcons[key]);refresh()}
 sel.onchange=()=>{if(sel.value==='custom'){d.navIcons[key]='custom:'+(url.value||'');}else d.navIcons[key]=sel.value;setPreview()};
 url.oninput=()=>{sel.value='custom';d.navIcons[key]='custom:'+url.value;setPreview()};
 const file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.onchange=()=>{const f=file.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=192;canvas.height=192;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,192,192);const scale=Math.min(192/image.width,192/image.height);ctx.drawImage(image,(192-image.width*scale)/2,(192-image.height*scale)/2,image.width*scale,image.height*scale);d.navIcons[key]='custom:'+canvas.toDataURL('image/png');sel.value='custom';url.value='';setPreview()};image.src=reader.result};reader.readAsDataURL(f)};
 item.append(sel);const desc=document.createElement('p');desc.className='muted';desc.textContent='独自画像のURLまたは画像ファイルを指定';item.append(desc,url,file);panel.append(item);setPreview();
}
refresh();
}

let s; // 見出し言語設定は廃止
s=section('OGP・SNS共有設定');{
 const note=document.createElement('p');note.className='muted';note.textContent='画像・タイトル・説明文を登録し、SNS共有カードの見た目を確認できます。【重要】このデモはブラウザ内保存のため、保存だけではX・LINEが取得する公開OGPは変わりません。公開反映にはサーバー側の更新機能が必要です。';s.append(note);
 textfield(s,'共有タイトル',d.ogp,'title');
 textfield(s,'共有説明文',d.ogp,'description','textarea');
 const imageUrl=textfield(s,'OG画像URL（公開されたhttps画像URL）',d.ogp,'image');
 const upload=document.createElement('input');upload.type='file';upload.accept='image/jpeg,image/png,image/webp';const label=document.createElement('label');label.textContent='画像ファイルを選択（プレビュー用・公開アップロードではありません）';s.append(label,upload);
 const preview=document.createElement('div');preview.className='item';const im=document.createElement('img');im.style.cssText='width:100%;aspect-ratio:1200/630;object-fit:contain;background:#110e14;border-radius:8px';const t=document.createElement('b'),desc=document.createElement('p');desc.className='muted';preview.append(im,t,desc);s.append(preview);
 function draw(){im.src=d.ogp.image||demoImage('OG IMAGE','wide');t.textContent=d.ogp.title||'（タイトル未設定）';desc.textContent=d.ogp.description||'（説明文未設定）'}
 imageUrl.addEventListener('input',draw);s.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',draw));
 upload.onchange=()=>{const file=upload.files?.[0];if(!file)return;if(file.size>2*1024*1024){alert('2MB以下の画像を選択してください');upload.value='';return}const reader=new FileReader();reader.onload=()=>{d.ogp.image=String(reader.result);imageUrl.value='';draw()};reader.readAsDataURL(file)};
 const reset=document.createElement('button');reset.className='secondary';reset.textContent='OG画像を解除';reset.onclick=()=>{d.ogp.image='';imageUrl.value='';upload.value='';draw()};s.append(reset);
 const hint=document.createElement('p');hint.className='muted';hint.textContent='推奨：1200×630px、JPGまたはPNG、2MB以下。ローカル画像は他の端末やSNSには配信されません。';s.append(hint);draw();
}
s=section('HERO / NEWS / INTRODUCTION');textfield(s,'お名前',d,'name');{
 const modeWrap=document.createElement('div');modeWrap.className='item';const modeLabel=document.createElement('label');modeLabel.textContent='HEROの文字表示';const sel=document.createElement('select');
 [['image','画像内の文字を使用（初期設定）'],['text','テキストを重ねて表示'],['none','文字を表示しない']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)});
 d.heroTextMode=d.heroTextMode||'image';sel.value=d.heroTextMode;sel.onchange=()=>{d.heroTextMode=sel.value;settings.hidden=sel.value!=='text'};
 const settings=document.createElement('div');settings.hidden=d.heroTextMode!=='text';textfield(settings,'キャッチコピー',d,'catch');textfield(settings,'文字サイズ（px）',d,'heroTextSize','number');textfield(settings,'文字色（例：#ffffff）',d,'heroTextColor');selectfield(settings,'文字の位置',d,'heroTextPosition',[['bottom','下'],['center','中央'],['top','上']]);
 modeWrap.append(modeLabel,sel,settings);s.append(modeWrap)
}
textfield(s,'PERSONAL（項目名・回答などの文章）',d,'personalText','textarea');textfield(s,'紹介文',d,'intro','textarea');
s=section('NEWS管理・お知らせ一覧');{
 const note=document.createElement('p');note.className='muted';note.textContent='新しいお知らせを先頭に表示します。重要設定をONにすると閲覧ページに「重要」と表示します。';s.append(note);
 d.newsItems=Array.isArray(d.newsItems)?d.newsItems:[];
 if(!d.newsItems.length&&d.news){d.newsItems.push({title:'お知らせ',body:d.news,date:new Date().toISOString().slice(0,10),important:false,visible:true})}
 const list=document.createElement('div');s.append(list);
 function drawNews(){list.replaceChildren();d.newsItems.forEach((item,i)=>{const box=document.createElement('div');box.className='item';textfield(box,'タイトル',item,'title');textfield(box,'日付',item,'date','date');textfield(box,'本文',item,'body','textarea');check(box,'重要なお知らせ',item,'important');check(box,'公開する',item,'visible');const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=()=>{if(confirm('このお知らせを削除しますか？')){d.newsItems.splice(i,1);drawNews()}};box.append(del);list.append(box)})}
 const add=document.createElement('button');add.textContent='＋ お知らせを追加';add.onclick=()=>{d.newsItems.unshift({title:'',body:'',date:new Date().toISOString().slice(0,10),important:false,visible:true});drawNews()};s.append(add);drawNews()
}
s=section('画像管理（URL指定）');[['hero','HERO 3:4'],['personal','PERSONAL 1:1'],['profile','PROFILE 3:4'],['calendar','CALENDAR 1:1'],['working','出勤画像 1:1'],['off','休み画像 1:1'],['soldout','完売画像 1:1']].forEach(([k,l])=>textfield(s,l,d.images,k));
s=section('PHOTO（3:4）');let photos=d.photos.map(x=>({url:x}));items(s,photos,[['画像URL','url']],()=>({url:''}));
s=section('PROFILE（右側3項目）');items(s,d.profileRows,[['項目名（6文字程度）','label'],['回答（10文字程度）','value']],()=>({label:'ITEM',value:''}),{limit:3,fixed:true});
s=section('リンク・URL一元管理');{const p=document.createElement('p');p.className='muted';p.textContent='ここで変更したURLは、上部・下部SNS、固定ナビ、OFFICIAL、CONTACT、予約ポップアップなど同じリンクを使う全箇所に反映されます。※このデモでは同じブラウザ内で保存・反映されます。';s.append(p)}['line','x','sub'].forEach(k=>textfield(s,k==='sub'?'02 URL':k.toUpperCase()+' URL',d.sns,k));textfield(s,'店舗電話番号',d,'phone');textfield(s,'店舗公式LINE URL',d,'shopLine');textfield(s,'店舗公式HP URL',d,'official');textfield(s,'SNS移動前の注意喚起文',d,'snsWarning','textarea');
s=section('姫予約フォームの項目');items(s,d.bookingFields,[['項目名','label'],['入力形式','type','select',[['text','テキスト'],['tel','電話番号'],['email','メール'],['date','日付'],['time','時刻'],['datetime-local','日時'],['number','数字'],['textarea','長文'],['select','選択式']]],['選択肢（選択式の場合は1行1項目）','options','textarea'],['必須','required','checkbox'],['表示','visible','checkbox']],()=>({label:'NEW FIELD',type:'text',required:false,visible:true,options:''}));
s=section('料金シミュレーター');check(s,'料金設定を公開する',d,'pricePublished');items(s,d.courses,[['コース名','name'],['料金（円）','price','number']],()=>({name:'NEW COURSE',price:0}));items(s,d.extras,[['追加料金名','name'],['金額（円）','price','number']],()=>({name:'NEW FEE',price:0}));textfield(s,'消費税率（%）',d,'tax','number');check(s,'登録料金は税込',d,'taxIncluded');
s=section('出張・交通費');check(s,'出張対応あり',d,'travelEnabled');selectfield(s,'交通費方式',d,'travelMode',[['area','エリア別'],['flat','一律'],['free','無料']]);textfield(s,'一律交通費（円）',d,'travelFlat','number');items(s,d.travelAreas,[['エリア名','name'],['交通費（円）','price','number']],()=>({name:'AREA',price:0}));
s=section('LOCATION GUIDE');textfield(s,'セクション見出し',d,'locationTitle');items(s,d.areas,[['エリア名','name'],['形式','type','select',[['image','画像'],['map','Google Maps埋め込み']]],['画像URL','image'],['Google Maps埋め込みURL','map'],['表示','visible','checkbox']],()=>({name:'NEW AREA',type:'image',image:'',map:'',visible:true}));
s=section('セクションの表示・並び順');let host=document.createElement('div');s.append(host);function drawSections(){host.innerHTML='';d.sections.forEach((id,i)=>{let r=document.createElement('div');r.className='row item';let name=SECTIONS.find(x=>x[0]===id)?.[1]||id;let c=document.createElement('input');c.type='checkbox';c.checked=!d.hidden.includes(id);c.style.flex='0 0 25px';c.onchange=()=>{d.hidden=d.hidden.filter(x=>x!==id);if(!c.checked)d.hidden.push(id)};let label=document.createElement('span');label.textContent=name;let up=document.createElement('button');up.textContent='↑';up.onclick=()=>{if(i){[d.sections[i-1],d.sections[i]]=[d.sections[i],d.sections[i-1]];drawSections()}};let down=document.createElement('button');down.textContent='↓';down.onclick=()=>{if(i<d.sections.length-1){[d.sections[i+1],d.sections[i]]=[d.sections[i],d.sections[i+1]];drawSections()}};r.append(c,label,up,down);host.append(r)})}drawSections();
s=section('出勤カレンダー・一括設定');d.templates.forEach((t,i)=>{let x=document.createElement('div');x.className='item';textfield(x,'基本シフト '+(i+1)+' 名称',t,'name');textfield(x,'基本シフト '+(i+1)+' 時間',t,'time');s.append(x)});let nav=document.createElement('div');nav.className='row';s.append(nav);let prev=document.createElement('button'),next=document.createElement('button'),title=document.createElement('b');prev.textContent='← 前月';next.textContent='翌月 →';nav.append(prev,title,next);let grid=document.createElement('div');grid.className='dategrid';s.append(grid);function drawCalendar(){title.textContent=`${month.getFullYear()}年 ${month.getMonth()+1}月`;grid.innerHTML='';let last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let day=1;day<=last;day++){let date=new Date(month.getFullYear(),month.getMonth(),day),key=dayKey(date),b=document.createElement('button');b.textContent=day;b.className=(selected.has(key)?'selected ':'')+(d.shifts[key]?'shift':'');b.title=d.soldout[key]?'完売':d.shifts[key]||'休み';b.onclick=()=>{if(selected.has(key))selected.delete(key);else selected.add(key);drawCalendar()};grid.append(b)}}prev.onclick=()=>{month.setMonth(month.getMonth()-1);drawCalendar()};next.onclick=()=>{month.setMonth(month.getMonth()+1);drawCalendar()};drawCalendar();let info=document.createElement('p');info.className='muted';info.textContent='日付を複数選択し、下の操作を適用できます。青枠は出勤登録済み。完売にしても勤務時間は保持します。';s.append(info);let custom=textfield(s,'個別の勤務時間（例：10:00–14:00）',{value:''},'value');let apply=(fn)=>{if(!selected.size){alert('日付を選択してください');return}selected.forEach(fn);selected.clear();drawCalendar()};[['シフトA',()=>apply(k=>d.shifts[k]=d.templates[0].time)],['シフトB',()=>apply(k=>d.shifts[k]=d.templates[1].time)],['指定時間',()=>apply(k=>d.shifts[k]=custom.value)],['休み',()=>apply(k=>{delete d.shifts[k];delete d.soldout[k]})],['完売ON',()=>apply(k=>d.soldout[k]=true)],['完売OFF',()=>apply(k=>delete d.soldout[k])]].forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;s.append(b)});
function save(){d.headingLanguage='ja';d.photos=photos.map(x=>x.url).filter(Boolean);if(d.profileRows.length!==3){alert('PROFILEは3項目にしてください');return}if(d.pricePublished&&!d.courses.length){alert('料金公開にはコース登録が必要です');return}saveData(d);alert('保存しました。公開ページを再読み込みして確認してください。（このデモは同じブラウザ内で反映）')}
