<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACK PINK | セラピストページ SAMPLE</title><style>
:root{--pink:#ef70a4;--ink:#252026;--bg:#fff7fa;--line:#f1d9e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Yu Gothic",sans-serif;color:var(--ink)}main{max-width:540px;margin:auto;background:#fff;min-height:100vh;padding-bottom:90px}h2{font:700 21px Georgia,serif;letter-spacing:.08em;margin:0 0 18px}section{padding:28px 20px;border-bottom:8px solid #fff5f9}.hero{position:relative;padding:0}.hero img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#f6e5ee}.hero .headline{position:absolute;bottom:18px;left:18px;color:#fff;text-shadow:0 2px 9px #000;font-size:21px;font-weight:700}.menu{position:fixed;right:max(15px,calc((100vw - 540px)/2 + 15px));top:15px;z-index:8;border:0;border-radius:50%;width:45px;height:45px;background:#181319;color:white;font-size:24px}nav#links{display:none;position:fixed;z-index:7;right:max(15px,calc((100vw - 540px)/2 + 15px));top:65px;background:white;box-shadow:0 5px 30px #0003;border-radius:15px;padding:14px}nav#links a{display:block;color:#333;padding:8px;text-decoration:none}.card{background:#fff9fc;border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.btn,button.action{display:inline-block;border:0;background:#19151a;color:#fff;border-radius:11px;padding:13px 15px;font:700 14px inherit;text-decoration:none;cursor:pointer}.pink{background:var(--pink)!important}.muted{color:#817782;font-size:13px}.sns{display:flex;gap:12px;justify-content:center}.sns button{width:55px;height:55px;border-radius:50%;border:1px solid var(--line);background:white;font-weight:bold}.profile{display:flex;align-items:center;gap:12px}.profile img{width:36%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;background:#f5e3eb}.profile .details{flex:1;min-width:0}.profile .details label{font-size:16px;display:block}.profile .details strong{font-size:22px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:bold;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #e7cfdb;border-radius:9px;padding:12px;background:white;font:inherit}textarea{min-height:85px}.wide{width:100%}.total{font-size:28px;color:#d54184;font-weight:800;text-align:right}.area{margin:14px 0}.area img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#f5e6ed}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:9}.bottom button{width:50px;height:50px;border-radius:50%;background:#19151a;color:white;border:0;font-size:17px}.bottom button:last-child{background:var(--pink)}dialog{border:0;border-radius:18px;max-width:90%;padding:25px;box-shadow:0 10px 40px #0004}dialog::backdrop{background:#0008}.adminlink{font-size:12px;text-align:center;padding:20px}#notice{padding:12px;background:#fff1f7;border-radius:10px}#days{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}#days div{background:#fff8fb;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:13px}
</style></head><body><main><button class="menu" onclick="document.querySelector('#links').style.display=document.querySelector('#links').style.display==='block'?'none':'block'">☰</button><nav id="links"></nav><section class="hero" id="home"><img id="heroimg" alt="HERO画像"><div class="headline" id="herotext">大人の癒しを、あなたに。</div></section><section id="news"><h2>NEWS</h2><div id="notice">セラピスト個人ページのサンプルです。</div></section><section id="sns"><h2>SNS</h2><div class="sns"><button onclick="snsGo('line')">LINE</button><button onclick="snsGo('x')">𝕏</button><button onclick="snsGo('sub')">02</button></div></section><section id="personal"><h2>PERSONAL</h2><img id="personalimg" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px" alt="パーソナル画像"></section><section id="intro"><h2>INTRODUCTION</h2><p id="introtext">ゆったりとした癒しのひとときをお届けします。</p></section><section id="photo"><h2>PHOTO</h2><div class="gallery" id="photos"></div></section><section id="today"><h2>TODAY</h2><img id="todayimg" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px" alt="本日の出勤状況"><p id="todaytext"></p></section><section id="schedule"><h2>SCHEDULE</h2><div id="days"></div></section><section id="calendar"><h2>CALENDAR</h2><img id="calendarimg" style="width:100%;aspect-ratio:1;object-fit:cover" alt="カレンダー画像"></section><section id="hime"><h2>姫予約</h2><p class="muted">必要事項をご入力のうえ、内容をコピーしてください。</p><div id="himefields"></div><button class="action pink wide" onclick="copyBooking()">予約内容をコピー</button></section><section id="simulator"><h2>PRICE SIMULATOR</h2><div class="field"><label>コース</label><select id="course" onchange="calculate()"></select></div><div class="field"><label>指名・オプション</label><div id="extras"></div></div><div id="travelbox"><div class="field"><label>交通費</label><select id="travel" onchange="calculate()"></select></div></div><div class="card">お支払い目安<div class="total" id="total">0円</div><div class="muted" id="breakdown"></div></div></section><section id="profile"><h2>PROFILE</h2><div class="profile"><img id="profileimg" alt="プロフィール画像"><div class="details" id="profiledetails"></div></div></section><section id="location"><h2 id="locationtitle">LOCATION GUIDE</h2><div id="areas"></div></section><section id="official"><h2>OFFICIAL</h2><a class="btn pink wide" id="officiallink" href="#" target="_blank">店舗公式ページを見る</a></section><section id="contact"><h2>ご予約・お問い合わせ</h2><p><button class="action wide" onclick="shopGo('phone')">☎ お店に電話</button></p><p><button class="action pink wide" onclick="shopGo('line')">LINE お店にLINE</button></p></section><div class="adminlink"><a href="admin.html">サンプル管理ページを開く</a></div></main><div class="bottom"><button onclick="location.hash='home'">⌂</button><button onclick="snsGo('line')">L</button><button onclick="snsGo('x')">𝕏</button><button onclick="snsGo('sub')">02</button><button onclick="document.getElementById('booking').showModal()">☎</button></div><dialog id="booking"><h2>ご予約</h2><p><button class="action wide" onclick="shopGo('phone')">お店に電話</button></p><p><button class="action pink wide" onclick="shopGo('line')">お店にLINE</button></p><button onclick="document.getElementById('booking').close()">閉じる</button></dialog><dialog id="msg"><p>ただいま準備中です<br>すみません💦</p><button onclick="document.getElementById('msg').close()">閉じる</button></dialog><script src="shared.js"></script><script>
const cfg=getConfig();const el=id=>document.getElementById(id);const img=(id,url)=>{if(url)el(id).src=url;else el(id).src=placeholder(id)};img('heroimg',cfg.hero);img('personalimg',cfg.personal);img('profileimg',cfg.profile);img('calendarimg',cfg.calendar);img('todayimg',cfg.todayImage);el('herotext').textContent=cfg.heroText;el('introtext').textContent=cfg.intro;el('notice').textContent=cfg.news;el('todaytext').textContent=cfg.todayText;el('photos').innerHTML=cfg.photos.map((p,i)=>'<img src="'+(p||placeholder('PHOTO '+(i+1)))+'" alt="PHOTO">').join('');el('profiledetails').innerHTML=cfg.profileRows.map(r=>'<label>'+safe(r.label)+'</label><strong>'+safe(r.value)+'</strong>').join('');const now=new Date();for(let i=1;i<=7;i++){let d=new Date(now);d.setDate(now.getDate()+i);const k=d.toISOString().slice(0,10);const shift=cfg.shifts[k];el('days').innerHTML+='<div>'+d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})+'<br><b>'+(shift||'お休み')+'</b></div>'}el('himefields').innerHTML=cfg.bookingFields.filter(f=>f.visible).map((f,i)=>'<div class="field"><label>'+safe(f.label)+(f.required?' *':'')+'</label><input data-book="'+safe(f.label)+'" placeholder="'+safe(f.label)+'" '+(f.required?'required':'')+'></div>').join('');el('course').innerHTML=cfg.courses.map((x,i)=>'<option value="'+i+'">'+safe(x.name)+'（'+Number(x.price).toLocaleString()+'円）</option>').join('');el('extras').innerHTML=cfg.extras.map((x,i)=>'<label style="display:block;margin:9px 0"><input style="width:auto" type="checkbox" data-extra="'+i+'" onchange="calculate()"> '+safe(x.name)+'（'+Number(x.price).toLocaleString()+'円）</label>').join('');if(!cfg.travelEnabled)el('travelbox').hidden=true;el('travel').innerHTML=cfg.travelFees.map((x,i)=>'<option value="'+i+'">'+safe(x.name)+'（'+Number(x.price).toLocaleString()+'円）</option>').join('');el('locationtitle').textContent=cfg.locationTitle;el('areas').innerHTML=cfg.areas.filter(a=>a.visible).map(a=>'<div class="area"><h3>'+safe(a.name)+'</h3>'+(a.type==='map'&&a.map?'<iframe title="'+safe(a.name)+'" src="'+safe(a.map)+'" loading="lazy" style="width:100%;height:240px;border:0;border-radius:10px"></iframe>':'<img src="'+(a.image||placeholder(a.name))+'" alt="'+safe(a.name)+'">')+'</div>').join('');el('officiallink').href=cfg.official||'#';function calculate(){let course=cfg.courses[+el('course').value]||{price:0};let ex=[...document.querySelectorAll('[data-extra]:checked')].map(n=>cfg.extras[+n.dataset.extra]);let travel=cfg.travelEnabled?(cfg.travelFees[+el('travel').value]||{price:0}):{price:0};let subtotal=Number(course.price)+ex.reduce((a,x)=>a+Number(x.price),0)+Number(travel.price);let total=cfg.taxIncluded?subtotal:Math.round(subtotal*(1+Number(cfg.tax)/100));el('total').textContent=total.toLocaleString()+'円';el('breakdown').textContent='コース '+Number(course.price).toLocaleString()+'円 / オプション '+ex.reduce((a,x)=>a+Number(x.price),0).toLocaleString()+'円 / 交通費 '+Number(travel.price).toLocaleString()+'円'+(cfg.taxIncluded?'（税込設定）':' / 税 '+cfg.tax+'%')}calculate();function copyBooking(){let inputs=[...document.querySelectorAll('[data-book]')];let missing=inputs.find(x=>x.required&&!x.value.trim());if(missing){alert(missing.dataset.book+'を入力してください');missing.focus();return}navigator.clipboard.writeText(inputs.map(x=>x.dataset.book+'：'+x.value).join('\n')).then(()=>alert('予約内容をコピーしました')).catch(()=>alert('コピーできませんでした'))}function snsGo(t){let url=cfg.sns[t];url?window.open(url,'_blank'):el('msg').showModal()}function shopGo(t){let url=t==='phone'?(cfg.phone?'tel:'+cfg.phone:''):cfg.shopLine;url?location.href=url:el('msg').showModal()}el('links').innerHTML=[...document.querySelectorAll('main>section')].filter(s=>cfg.visible[s.id]!==false).map(s=>'<a href="#'+s.id+'" onclick="document.querySelector(\'#links\').style.display=\'none\'">'+(s.querySelector('h2')?.textContent||'HOME')+'</a>').join('');Object.keys(cfg.visible).forEach(id=>{if(cfg.visible[id]===false&&el(id))el(id).hidden=true});</script></body></html>
