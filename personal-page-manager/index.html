<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERSONAL PAGE MANAGER</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#24262c;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e3e5e8;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}small,.muted{color:#69717c}main{max-width:1440px;margin:26px auto;padding:0 24px}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:white;border:1px solid #e3e5e8;border-radius:12px;padding:20px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,input,select,textarea{font:inherit}button{border:1px solid #d8dce2;border-radius:7px;padding:9px 13px;background:white;cursor:pointer}button.primary{background:#202b3e;color:white;border-color:#202b3e}button.active{background:#e8edf6}button:disabled{opacity:.5}input,select,textarea{border:1px solid #d8dce2;border-radius:7px;padding:10px;width:100%;background:white}textarea{min-height:115px;resize:vertical}.item{width:100%;text-align:left;margin-bottom:7px;padding:12px}.item strong{display:block}.item small{display:block;margin-top:5px}.status{font-size:12px;padding:3px 7px;background:#edf0f4;border-radius:20px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;margin:16px 0 7px;font-weight:600}.actions{display:flex;gap:8px;margin-top:16px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fa;border-radius:8px;padding:16px;max-height:420px;overflow:auto;line-height:1.7}.hidden{display:none!important}a{color:#325a9c}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}header{padding:15px}main{padding:0 12px}}
</style></head><body><header><div><h1>PERSONAL PAGE MANAGER</h1><small>制作依頼・受信管理</small></div><div><a href="../order/" target="_blank">依頼ページ ↗</a>　<button id="refresh">更新</button>　<button id="logout" class="hidden">ログアウト</button></div></header><main>
<section id="login" class="panel" style="max-width:430px;margin:60px auto"><h2>管理者ログイン</h2><p class="muted">既存のマスター管理者アカウントでログインしてください。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="primary" id="signIn">ログイン</button></div><p id="loginError" class="muted"></p></section>
<section id="workspace" class="hidden"><div class="top"><h2>制作依頼 <span id="count" class="status">0件</span></h2><span class="muted" id="lastUpdate"></span></div><div class="filters" id="filters"><button data-status="all" class="active">すべて</button><button data-status="new">新規</button><button data-status="working">制作中</button><button data-status="review">確認待ち</button><button data-status="done">完了</button></div><div class="layout"><section class="panel"><div id="requestList" class="muted">読み込み中…</div></section><section class="panel" id="detail"><p class="muted">左側から依頼を選択してください。</p></section></div></section></main>
<script>
const API="https://vjjnkflbfsjihwzjsjpr.supabase.co",KEY="sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos",$=id=>document.getElementById(id);
let token="",requests=[],selectedId="",filter="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headers=(auth=false)=>({"apikey":KEY,...(auth?{"Authorization":"Bearer "+token}:{})});
function statusName(s){return ({new:"新規",working:"制作中",review:"確認待ち",done:"完了"})[s]||s}
async function signIn(){const r=await fetch(API+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});const data=await r.json();if(!r.ok)throw Error(data.error_description||data.msg||"ログインに失敗しました");token=data.access_token;sessionStorage.setItem("ppm_auth",JSON.stringify({access_token:token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000}));await load()}
async function refreshToken(){const saved=JSON.parse(sessionStorage.getItem("ppm_auth")||"null");if(!saved)return false;if(saved.expires_at>Date.now()+60000){token=saved.access_token;return true}const r=await fetch(API+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:saved.refresh_token})});if(!r.ok)return false;const d=await r.json();token=d.access_token;sessionStorage.setItem("ppm_auth",JSON.stringify({access_token:token,refresh_token:d.refresh_token,expires_at:Date.now()+d.expires_in*1000}));return true}
async function load(){if(!await refreshToken()){showLogin();return}const r=await fetch(API+"/rest/v1/personal_page_requests?select=*&order=created_at.desc&limit=200",{headers:headers(true)});if(!r.ok)throw Error("受信データを取得できません ("+r.status+")");requests=await r.json();$("login").classList.add("hidden");$("workspace").classList.remove("hidden");$("logout").classList.remove("hidden");$("lastUpdate").textContent="更新："+new Date().toLocaleString("ja-JP");renderList();renderDetail()}
function showLogin(){$("login").classList.remove("hidden");$("workspace").classList.add("hidden");$("logout").classList.add("hidden")}
function renderList(){const rows=requests.filter(x=>filter==="all"||x.status===filter);$("count").textContent=requests.length+"件";$("requestList").innerHTML=rows.length?rows.map(x=>'<button class="item '+(x.id===selectedId?'active':'')+'" data-id="'+esc(x.id)+'"><strong>'+esc(x.client_name||"お名前未記入")+'　<span class="status">'+statusName(x.status)+'</span></strong><small>'+new Date(x.created_at).toLocaleString("ja-JP")+'</small></button>').join(""):'該当する依頼はありません。';$("requestList").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;renderList();renderDetail()})}
function renderDetail(){const x=requests.find(x=>x.id===selectedId);if(!x){$("detail").innerHTML='<p class="muted">左側から依頼を選択してください。</p>';return}$("detail").innerHTML='<div class="top"><h2>'+esc(x.client_name||"制作依頼")+'</h2><span class="status">'+statusName(x.status)+'</span></div><div class="grid"><div><label>進捗</label><select id="statusSelect">'+["new","working","review","done"].map(s=>'<option value="'+s+'" '+(x.status===s?"selected":"")+'>'+statusName(s)+'</option>').join("")+'</select></div><div><label>受付日時</label><p>'+new Date(x.created_at).toLocaleString("ja-JP")+'</p></div></div><label>現在のHP</label><p>'+ (x.current_url?'<a target="_blank" rel="noopener" href="'+esc(/^https?:\/\//.test(x.current_url)?x.current_url:"#")+'">'+esc(x.current_url)+'</a>':"未記入")+'</p><label>依頼内容（原文）</label><pre id="requestText">'+esc(x.request_text)+'</pre><button id="copyRequest">依頼文をコピー</button><label>制作メモ・作業分解</label><textarea id="adminNotes" placeholder="依頼内容を工程ごとに分解して記録">'+esc(x.admin_notes)+'</textarea><div class="actions"><button class="primary" id="save">進捗・メモを保存</button><span class="muted" id="saveMessage"></span></div>';$("copyRequest").onclick=()=>navigator.clipboard.writeText(x.request_text);$("save").onclick=async()=>{const b=$("save");b.disabled=true;try{if(!await refreshToken())throw Error("再ログインしてください");const r=await fetch(API+"/rest/v1/personal_page_requests?id=eq."+encodeURIComponent(x.id),{method:"PATCH",headers:{...headers(true),"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:$("statusSelect").value,admin_notes:$("adminNotes").value})});if(!r.ok)throw Error("保存に失敗しました");const rows=await r.json();if(rows.length!==1)throw Error("更新権限がありません");Object.assign(x,rows[0]);renderList();$("saveMessage").textContent="保存しました";}catch(e){$("saveMessage").textContent=e.message}finally{b.disabled=false}}}
$("signIn").onclick=async()=>{try{$("loginError").textContent="";await signIn()}catch(e){$("loginError").textContent=e.message}};$("refresh").onclick=()=>load().catch(e=>alert(e.message));$("logout").onclick=()=>{sessionStorage.removeItem("ppm_auth");token="";showLogin()};$("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.status;$("filters").querySelectorAll("button").forEach(z=>z.classList.toggle("active",z===b));renderList()});load().catch(e=>{$("loginError").textContent=e.message;showLogin()});
</script></body></html>
