<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PERSONAL PAGE MANAGER</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#24262c;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e3e5e8;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}small,.muted{color:#69717c}main{max-width:1440px;margin:26px auto;padding:0 24px}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #e3e5e8;border-radius:12px;padding:20px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,input,select,textarea{font:inherit}button{border:1px solid #d8dce2;border-radius:7px;padding:9px 13px;background:white;cursor:pointer}button.primary{background:#202b3e;color:white;border-color:#202b3e}button.active{background:#e8edf6}button:disabled{opacity:.5}input,select,textarea{border:1px solid #d8dce2;border-radius:7px;padding:10px;width:100%;background:white}textarea{min-height:115px;resize:vertical}.sidebar{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;background:#E8D9F5;border-color:#D7C1E9}.sidebar h3{font-size:13px;color:#687386;margin:20px 0 8px}.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin:5px 0;border:0;background:transparent}.navbtn.active{background:#fff;color:#173253;font-weight:700;box-shadow:0 1px 4px rgba(24,48,80,.08)}.workarea{min-width:0}.workheader{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.worklinks{display:flex;gap:8px;flex-wrap:wrap}.worklinks a{border:1px solid #d8dce2;border-radius:7px;padding:8px 10px;text-decoration:none;font-size:12px}.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0}.step{border-radius:8px;background:#f1f3f6;padding:10px 5px;text-align:center;font-size:12px}.step.current{background:#dce8f7;color:#183a68}.worksection h3{margin:6px 0 12px}.promptcard{border:1px solid #e2e6eb;border-radius:10px;padding:14px;margin:10px 0}.promptcard p{font-size:13px;color:#66717e;line-height:1.6}.promptcard button{font-size:12px}.item{width:100%;text-align:left;margin-bottom:7px;padding:12px}.item strong{display:block}.item small{display:block;margin-top:5px}.status{font-size:12px;padding:3px 7px;background:#edf0f4;border-radius:20px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;margin:16px 0 7px;font-weight:600}.actions{display:flex;gap:8px;margin-top:16px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fa;border-radius:8px;padding:16px;max-height:420px;overflow:auto;line-height:1.7}.hidden{display:none!important}a{color:#325a9c}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}header{padding:15px}main{padding:0 12px}.sidebar{position:static;max-height:none}.steps{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="./desktop-refinement.css"><style>.checklist-panel{background:#fcfaff;border:1px solid #e8ddec;border-radius:14px;padding:20px;margin:18px 0 26px}.checklist-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.checklist-head span{font-size:12px;color:#735982}.check-row{display:flex;gap:12px;align-items:center;padding:11px 4px;margin:0;border-bottom:1px solid #eee5f1;font-weight:500}.check-row input{width:18px;height:18px;accent-color:#80609c;flex:none}.check-row:has(input:checked) span{text-decoration:line-through;color:#867a8d}.checklist-panel p{font-size:12px;margin:14px 0 0}</style><style>.stage-guide{border:1px solid #e9e0ed;background:#fcfaff;border-radius:14px;padding:20px;margin:16px 0 24px}.stage-guide h4{margin:0 0 15px;font-size:15px;color:#533c63}.stage-guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stage-guide-item{background:white;border:1px solid #efe8f2;border-radius:10px;padding:16px}.stage-guide-item strong{font-size:13px;color:#60476d}.stage-guide-item p{font-size:13px;line-height:1.7;color:#696273;margin:8px 0 0}@media(max-width:1050px){.stage-guide-grid{grid-template-columns:1fr}}</style><style>.materials-panel{margin:18px 0 26px;border:1px solid #e6dced;background:#fdfbff;border-radius:14px;padding:20px}.materials-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.materials-heading h4{margin:0;font-size:16px;color:#533c63}.materials-heading p,.materials-panel>.muted{font-size:12px;color:#776e7e;margin:7px 0}.materials-heading>span{font-size:12px;white-space:nowrap;color:#725a82}.materials-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.material-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid #ece4f0;background:white;border-radius:10px}.material-row>span{font-size:13px}.material-row select{width:118px;flex:none;font-size:12px;padding:8px}@media(max-width:1050px){.materials-list{grid-template-columns:1fr}}@media(max-width:520px){.materials-heading{align-items:flex-start;flex-direction:column}}</style><style>.request-progress{margin-top:12px}.request-progress-label{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;color:#65596d;font-size:11px;line-height:1.5}.request-progress-track{height:5px;background:#e9e3ef;border-radius:9px;overflow:hidden;margin-top:6px}.request-progress-track>span{display:block;height:100%;background:#8e6da8;border-radius:9px;transition:width .2s}.workarea>.request-progress{margin:20px 0}.item .request-progress-label{font-size:10px}</style><link rel="stylesheet" href="./remaining-work.css"><style>.color-preview{padding:16px;border:1px solid #e6d9e9;border-radius:12px;margin:14px 0;background:#fdfbff}.color-preview-head{display:flex;justify-content:space-between;gap:10px}.color-preview-swatches{display:flex;gap:10px;margin:14px 0}.color-preview-item{flex:1;min-width:0}.color-preview-chip{display:block;height:52px;border-radius:9px;border:1px solid #0001}.color-preview-item small{display:block;text-align:center;margin-top:5px;font-size:11px}.color-preview p{font-size:12px}</style></head><body><header><div><h1>PERSONAL PAGE MANAGER</h1><small>制作依頼・制作工程管理</small></div><div><a href="../order/" target="_blank">依頼ページ ↗</a>　<button id="refresh">更新</button>　<button id="logout" class="hidden">ログアウト</button></div></header><main>
<section id="login" class="panel" style="max-width:430px;margin:60px auto"><h2>管理者ログイン</h2><p class="muted">既存のマスター管理者アカウントでログインしてください。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="primary" id="signIn">ログイン</button></div><p id="loginError" class="muted"></p></section>
<section id="workspace" class="hidden"><div class="top"><h2>制作管理 <span id="count" class="status">0件</span></h2><span class="muted" id="lastUpdate"></span></div><div class="layout"><aside class="panel sidebar"><h3>依頼一覧</h3><div id="requestList" class="muted">読み込み中…</div><h3>サンプル</h3><nav class="sample-nav"><a class="navbtn" href="../rei-sample/" target="_blank" rel="noopener">サンプル公開 ↗</a><a class="navbtn" href="../rei-sample/admin.html" target="_blank" rel="noopener">サンプル管理 ↗</a></nav><h3>制作工程</h3><nav id="workNav"><button class="navbtn active" data-tab="request">01　依頼内容の整理</button><button class="navbtn" data-tab="page">02　ページ制作</button><button class="navbtn" data-tab="images">03　画像制作</button><button class="navbtn" data-tab="character">04　キャラ・アイコン</button><button class="navbtn" data-tab="prompts">05　プロンプト集</button><button class="navbtn" data-tab="review">06　最終確認</button></nav></aside><section class="panel workarea" id="detail"><p class="muted">左側から依頼を選択してください。</p></section></div></section></main>
<script>
const API="https://vjjnkflbfsjihwzjsjpr.supabase.co",KEY="sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos",$=id=>document.getElementById(id);
let token="",requests=[],selectedId="",activeTab="request";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headers=(auth=false)=>({"apikey":KEY,...(auth?{"Authorization":"Bearer "+token}:{})});
function statusName(s){return ({new:"新規",working:"制作中",review:"確認待ち",done:"完了"})[s]||s}
async function signIn(){const r=await fetch(API+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});const data=await r.json();if(!r.ok)throw Error(data.error_description||data.msg||"ログインに失敗しました");token=data.access_token;sessionStorage.setItem("ppm_auth",JSON.stringify({access_token:token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000}));await load()}
async function refreshToken(){const saved=JSON.parse(sessionStorage.getItem("ppm_auth")||"null");if(!saved)return false;if(saved.expires_at>Date.now()+60000){token=saved.access_token;return true}const r=await fetch(API+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:saved.refresh_token})});if(!r.ok)return false;const d=await r.json();token=d.access_token;sessionStorage.setItem("ppm_auth",JSON.stringify({access_token:token,refresh_token:d.refresh_token,expires_at:Date.now()+d.expires_in*1000}));return true}
async function load(){if(!await refreshToken()){showLogin();return}const r=await fetch(API+"/rest/v1/personal_page_requests?select=*&order=created_at.desc&limit=200",{headers:headers(true)});if(!r.ok)throw Error("受信データを取得できません ("+r.status+")");requests=await r.json();$("login").classList.add("hidden");$("workspace").classList.remove("hidden");$("logout").classList.remove("hidden");$("lastUpdate").textContent="更新："+new Date().toLocaleString("ja-JP");if(!requests.some(x=>x.id===selectedId))selectedId=requests[0]?.id||"";renderList();renderDetail()}
function showLogin(){$("login").classList.remove("hidden");$("workspace").classList.add("hidden");$("logout").classList.add("hidden")}
function progressInfo(x){const v=splitNotes(x.admin_notes);return {done:v.checks.filter(Boolean).length,total:v.checks.length,received:v.materials.filter(z=>z===1).length,missing:v.materials.filter(z=>z===0).length,notNeeded:v.materials.filter(z=>z===2).length}}
function progressMarkup(x){const p=progressInfo(x);return '<div class="request-progress"><div class="request-progress-label"><span>工程 '+p.done+'/'+p.total+'</span><span>素材 '+p.received+'件受領・'+p.missing+'件未受領</span></div><div class="request-progress-track"><span style="width:'+(p.done/p.total*100)+'%"></span></div></div>'}
function renderList(){const rows=requests;$("count").textContent=requests.length+"件";$("requestList").innerHTML=rows.length?rows.map(x=>'<div class="request-entry"><button type="button" class="item '+(x.id===selectedId?'active':'')+'" data-id="'+esc(x.id)+'"><strong>'+esc(x.client_name||"お名前未記入")+'</strong><small>'+new Date(x.created_at).toLocaleString("ja-JP")+'</small>'+progressMarkup(x)+'</button><div class="request-status-row"><select aria-label="案件のステータス" data-request-status="'+esc(x.id)+'">'+["new","working","review","done"].map(v=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+statusName(v)+'</option>').join("")+'</select><button type="button" data-confirm-status="'+esc(x.id)+'">確定</button></div><span class="request-status-message" data-status-message="'+esc(x.id)+'"></span></div>').join(""):'依頼はまだありません。';$("requestList").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;renderList();renderDetail()});$("requestList").querySelectorAll("[data-confirm-status]").forEach(b=>b.onclick=async()=>{const x=requests.find(v=>v.id===b.dataset.confirmStatus),select=[...$("requestList").querySelectorAll("[data-request-status]")].find(z=>z.dataset.requestStatus===b.dataset.confirmStatus),msg=[...$("requestList").querySelectorAll("[data-status-message]")].find(z=>z.dataset.statusMessage===b.dataset.confirmStatus);if(!x||!select)return;if(x.status===select.value){msg.textContent="変更なし";return}b.disabled=true;msg.textContent="保存中…";try{if(!await refreshToken())throw Error("再ログインしてください");const r=await fetch(API+"/rest/v1/personal_page_requests?id=eq."+encodeURIComponent(x.id),{method:"PATCH",headers:{...headers(true),"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({status:select.value})});if(!r.ok)throw Error("更新失敗 ("+r.status+")");const rows=await r.json();if(rows.length!==1)throw Error("更新権限がありません");Object.assign(x,rows[0]);renderList();if(x.id===selectedId)renderDetail()}catch(e){msg.textContent=e.message;b.disabled=false}})}

const prompts=[
["ページ複製・構成固定","麗さんサンプルの公開ページ・管理ページを制作の基準として複製してください。セクション構成・順番・管理機能・予約導線・データ構造は一切変更しないでください。変更箇所は依頼者の希望に基づく名称、配色、フォント、画像および必要なリンクに限定します。"],
["依頼内容を工程に分解","以下の制作依頼を、①基本情報 ②配色・フォント ③公開ページ設定 ④管理ページ設定 ⑤画像制作 ⑥本人確認に分解してください。不明点と必要素材も明記してください。既存の麗さんサンプルのページ構成は変更しないでください。"],
["OG画像","支給された人物写真を基に、SNS共有時に見やすい横長OG画像を制作してください。人物の特徴を維持し、依頼者の希望配色・ブランド名・装飾に合わせてください。"],
["TOP画像","支給された写真を基に、個人ページのTOPに掲載する縦長画像を制作してください。人物の特徴を維持し、文字と重要な被写体がスマートフォン表示で切れない構図にしてください。"],
["PERSONAL画像","支給写真を基に、PERSONAL欄用の正方形画像を制作してください。既存ページの構成は変更せず、指定の配色・世界観に合わせてください。"],
["出勤カレンダー","支給写真と確定済みシフトを使用して、正方形の出勤カレンダー画像を制作してください。日付・曜日・時間を照合し、未確定日は推測で埋めないでください。"],
["キャラクター化","支給された実写写真を参照して、人物の髪型・顔立ち・衣装の特徴を保ったデフォルメキャラクターを制作してください。背景は透過、全身が収まる構図にしてください。"],
["出勤・お休み・完売","確定した人物マスターを共通して使用し、出勤・お休み・完売の正方形ステータス画像をそれぞれ制作してください。各画像で人物の一貫性を維持し、文字の視認性を確保してください。"],
["SNSアイコン","確定した人物マスターを共通して使用し、指定されたSNSごとに正方形アイコンを制作してください。人物の特徴を維持し、各サービスのロゴと希望配色を反映してください。"],
["公開前の確認","公開ページと管理ページを実機サイズで確認してください。構成の維持、画像表示、リンク、SNS導線、予約導線、シフト表示、ログイン、保存・更新、OG表示の不具合を点検してください。"]
];
function safeUrl(v){try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
function requestData(x){return x.request_data&&typeof x.request_data==="object"?x.request_data:{}}
const checklistItems=["基本情報・依頼内容を確認","必要素材・不足情報を整理","ページ制作・配色を確認","画像・OG画像を確認","SNS・予約導線を確認","公開ページ・管理ページを動作確認","本人へ最終確認を依頼"];
const checklistTag="\n<!-- PPM_CHECKLIST:";
const materialItems=["人物写真（TOP用）","プロフィール用写真","OG画像用写真・素材","出勤カレンダー用素材・シフト","キャラクター制作の参考写真","SNSアイコン用素材・リンク","希望配色・デザイン参考","基本プロフィール・予約先情報"];
function splitNotes(value){let v=String(value||"");const cm=v.match(/\n<!-- PPM_CHECKLIST:([01]{7}) -->$/);const checks=cm?[...cm[1]].map(z=>z==="1"):Array(7).fill(false);if(cm)v=v.slice(0,cm.index);const mm=v.match(/\n<!-- PPM_MATERIALS:([012]{8}) -->$/);const materials=mm?[...mm[1]].map(Number):Array(8).fill(0);if(mm)v=v.slice(0,mm.index);return {notes:v,checks,materials}}
function mergeNotes(notes,checks,materials){return String(notes||"")+"\n<!-- PPM_MATERIALS:"+materials.join("")+" -->"+checklistTag+checks.map(v=>v?"1":"0").join("")+" -->"}
function materialMarkup(materials){return '<section class="materials-panel"><div class="materials-heading"><div><h4>必要素材の受領管理</h4><p>未受領・受領済み・不要を選択してください。</p></div><span id="materialCount"></span></div><div class="materials-list">'+materialItems.map((name,i)=>'<div class="material-row"><span>'+esc(name)+'</span><select data-material="'+i+'" aria-label="'+esc(name)+'の受領状況"><option value="0" '+(materials[i]===0?"selected":"")+'>未受領</option><option value="1" '+(materials[i]===1?"selected":"")+'>受領済み</option><option value="2" '+(materials[i]===2?"selected":"")+'>不要</option></select></div>').join("")+'</div><p class="muted">「進捗・メモを保存」で依頼ごとに保存されます。</p></section>'}
function checklistMarkup(checks){return '<div class="checklist-panel"><div class="checklist-head"><strong>制作チェックリスト</strong><span id="checkCount">'+checks.filter(Boolean).length+' / '+checks.length+' 完了</span></div>'+checklistItems.map((label,i)=>'<label class="check-row"><input type="checkbox" data-check="'+i+'" '+(checks[i]?"checked":"")+'><span>'+esc(label)+'</span></label>').join("")+'<p class="muted">チェック内容は「進捗・メモを保存」で依頼ごとに保存されます。</p></div>'}
const stageGuides={
page:{title:"ページ制作",items:[["必要な情報","源氏名・プロフィール・希望配色・フォント・SNS／予約先URL"],["制作対象","公開ページ・本人用管理ページ・OG設定・画像表示設定"],["確認事項","麗さんサンプルの構成維持／スマホ表示／リンク／保存・更新／ログイン"]]},
images:{title:"画像制作",items:[["必要な素材","使用許可のある人物写真・希望配色・文字表記・確定シフト"],["制作対象","TOP画像（縦長）・PERSONAL画像（正方形）・OG画像（横長）・出勤カレンダー（正方形）"],["確認事項","顔や衣装の再現性／トリミング／日付・曜日／文字の視認性／画像サイズ"]]},
character:{title:"キャラ・アイコン制作",items:[["必要な素材","人物マスター用写真・希望するイラストの方向性・利用するSNS"],["制作対象","人物マスター・HOME／SNSアイコン・出勤／お休み／完売ステータス画像"],["確認事項","人物の統一性／背景透過／正方形の見切れ／サービスロゴの正確性"]]},
review:{title:"最終確認",items:[["必要な情報","公開URL・管理URL・本人の確認結果"],["確認対象","公開ページ・管理ページ・画像・SNS／予約導線・OG表示"],["完了条件","本人確認が済み、主要機能の動作確認が完了していること"]]}
};
function stageGuideMarkup(tab){const g=stageGuides[tab];if(!g)return "";return '<section class="stage-guide"><h4>'+esc(g.title)+'｜作業ガイド</h4><div class="stage-guide-grid">'+g.items.map(([heading,detail])=>'<div class="stage-guide-item"><strong>'+esc(heading)+'</strong><p>'+esc(detail)+'</p></div>').join("")+'</div></section>'}
function remainingMarkup(x){const p=splitNotes(x.admin_notes);const missing=p.materials.map((v,i)=>v===0?materialItems[i]:null).filter(Boolean);const tasks=p.checks.map((v,i)=>!v?checklistItems[i]:null).filter(Boolean);return '<section class="remaining-panel"><div class="remaining-title"><h3>残作業一覧</h3><span>'+(missing.length+tasks.length)+'件</span></div><div class="remaining-columns"><div><h4>未受領素材 '+missing.length+'件</h4>'+(missing.length?'<ul>'+missing.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'<p>未受領素材なし</p>')+'</div><div><h4>未完了作業 '+tasks.length+'件</h4>'+(tasks.length?'<ul>'+tasks.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'<p>未完了作業なし</p>')+'</div></div></section>'}
const requestPalettes=[["BABY PINK","#ff79b0","#ffd0e3","#fff6fa"],["BLACK PINK","#17141b","#ff5caa","#fff0f7"],["MILKY WHITE","#f5b9d4","#ffffff","#f8f5fb"],["LAVENDER","#a58bea","#e3d7ff","#faf6ff"],["KOREAN BLUE","#6f9ee9","#dbe8ff","#ffffff"],["CHERRY RED","#c9234c","#ffb7c8","#fff6f7"],["BUTTER YELLOW","#e6ad35","#ffe9a2","#fffdf2"],["MINT SODA","#35b8a8","#b8f2e9","#f4fffc"],["ROYAL NAVY","#172B55","#C9A45C","#F8F5ED"],["CHAMPAGNE GOLD","#C6A66B","#F2E4C7","#FFFCF5"],["MONOTONE","#202020","#888888","#F5F5F5"],["DARK LUXURY","#141414","#B99A55","#2D2D2D"],["SAGE GREEN","#769587","#DCE9DE","#F7FAF6"],["MOCHA BROWN","#765647","#D8BFA8","#FAF3EC"],["DUSTY ROSE","#BD798D","#E8C5D0","#FFF4F7"],["PEACH CORAL","#EF8B76","#FFD3C3","#FFF7F2"],["ICE BLUE","#70B9D7","#D5F1FA","#F5FCFF"],["TURQUOISE","#008F96","#A6E2DE","#F1FBF9"],["BURGUNDY","#741F3A","#D9A8B6","#FFF4F6"],["PURPLE NOIR","#38224D","#A987CE","#F6F0FA"]];
function colorPreview(d){const name=String(d.color||"");const match=requestPalettes.find(p=>p[0]===name);if(!name)return '<p class="muted">希望配色：未指定</p>';if(!match)return '<p>希望配色：'+esc(name)+'</p>';return '<section class="color-preview"><div class="color-preview-head"><strong>希望配色</strong><span>'+esc(name)+'</span></div><div class="color-preview-swatches">'+match.slice(1).map((hex,i)=>'<div class="color-preview-item"><span class="color-preview-chip" style="background:'+hex+'"></span><small>'+esc(hex.toUpperCase())+'</small></div>').join("")+'</div><p class="muted">依頼フォームで選択された配色です。実際の制作色は依頼内容に合わせて調整します。</p></section>'}
function buildProductionPrompt(x,slug){const d=requestData(x),palette=requestPalettes.find(p=>p[0]===d.color);return ["【個人ページ制作】","依頼者："+(x.client_name||"未指定"),"制作URL名："+slug,"公開URL：https://officialendstaff.github.io/therapist-profile/"+slug+"/","管理URL：https://officialendstaff.github.io/therapist-profile/"+slug+"/admin.html","複製元：rei-sample/（固定）","配色："+(d.color||"未指定")+(palette?" "+palette.slice(1).join(" / "):""),"フォント："+(d.font||"未指定"),"言語："+(d.language||"未指定"),"追加制作："+(Array.isArray(d.extras)?d.extras.join("、"):"未指定"),"SNS："+(Array.isArray(d.sns_types)?d.sns_types.join("、"):"未指定"),"キャラ："+(d.character||"未指定"),"現行URL："+(x.current_url||"なし"),"【依頼原文】",x.request_text||"なし","【実施指示】","GitHubのofficialendstaff/therapist-profile内のrei-sample/を調査し、公開ページと管理ページを"+slug+"/へ複製して依頼内容を反映してください。","サンプルの構成・順序・管理機能・予約導線は維持してください。","Supabaseの参照・認証・画像保存先は他のセラピストと混在させず、既存データを変更しないでください。","不明な情報・未受領素材は推測せず不足事項として列挙してください。","GitHub反映後に公開・管理URL、スマホ表示、画像、リンク、ログイン、保存を検証し、未検証項目も報告してください。"].join(String.fromCharCode(10))}
function renderDetail(){
 const x=requests.find(x=>x.id===selectedId);
 if(!x&&activeTab==="prompts"){$("detail").innerHTML='<div class="worksection"><h2>05　プロンプト集</h2><p class="muted">依頼を選択しなくても共通プロンプトを確認・コピーできます。</p>'+prompts.map((p,i)=>'<div class="promptcard"><strong>'+esc(p[0])+'</strong><p>'+esc(p[1])+'</p><button data-copy="prompt-'+i+'">コピー</button></div>').join('')+'</div>';$("detail").querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const p=prompts[Number(b.dataset.copy.split("-")[1])];try{await navigator.clipboard.writeText(p[1]);b.textContent="コピーしました"}catch{b.textContent="コピーできませんでした"}});return}
 if(!x){$("detail").innerHTML='<div class="worksection"><h2>依頼一覧</h2><p class="muted">左側の依頼一覧から案件を選択してください。</p></div>';return}
 const d=requestData(x), url=safeUrl(x.current_url), saved=splitNotes(x.admin_notes);
 
 const links='<div class="worklinks"><a href="https://github.com/officialendstaff/therapist-profile" target="_blank" rel="noopener">GitHub ↗</a>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">現行HP ↗</a>':'')+'</div>';
 const common='<div class="workheader"><div><h2>'+esc(x.client_name||"制作依頼")+'</h2><span class="status">'+statusName(x.status)+'</span></div>'+links+'</div>'+progressMarkup(x)+remainingMarkup(x)+'<div class="steps">'+["依頼整理","ページ制作","画像制作","本人確認","完了"].map((n,i)=>'<div class="step '+((activeTab==="request"&&i===0)||(activeTab==="page"&&i===1)||(activeTab==="images"&&i===2)||(activeTab==="character"&&i===2)||(activeTab==="review"&&i===3)?"current":"")+'">'+n+'</div>').join("")+'</div>';
 let body="";
 if(activeTab==="request"){
 body='<h3>01　依頼内容の整理</h3>'+colorPreview(d)+materialMarkup(saved.materials)+checklistMarkup(saved.checks)+'<div class="grid"><div><label>受付日時</label><p>'+new Date(x.created_at).toLocaleString("ja-JP")+'</p></div><div><label>現在のHP</label><p>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a>':'未記入')+'</p></div></div><label>依頼内容（原文）</label><pre>'+esc(x.request_text)+'</pre><button data-copy="request">依頼文をコピー</button><button data-copy="breakdown">工程分解プロンプトをコピー</button><label>制作メモ・作業分解</label><textarea id="adminNotes" placeholder="依頼内容を工程ごとに分解して記録">'+esc(saved.notes)+'</textarea>';
 }else if(activeTab==="page"){
 body='<h3>02　ページ制作</h3>'+colorPreview(d)+'<section class="production-flow"><h4>STEP 1｜制作URL</h4><p>therapist-profile/ <input id="productionSlug" placeholder="例：yamada" autocomplete="off" spellcheck="false"> /</p><p class="muted">英小文字・数字・ハイフンで指定。既存URLとの重複に注意してください。</p><h4>STEP 2｜制作プロンプト</h4><p>複製元はサンプル固定。依頼内容を含めた指示をまとめてコピーします。</p><button type="button" class="primary" id="copyProduction">制作プロンプトをコピー</button> <span id="productionMessage" class="muted"></span><h4>STEP 3｜制作・確認</h4><p class="muted">コピーした指示をChatGPTに送って制作します。コピー操作だけではGitHubへ複製されません。</p></section><label>制作メモ</label><textarea id="adminNotes">'+esc(saved.notes)+'</textarea>';
 }else if(activeTab==="images"){
 body='<h3>03　画像制作</h3>'+stageGuideMarkup("images")+ '<p class="muted">画像の希望・素材を確認し、用途ごとにプロンプトをコピーします。</p>'+prompts.slice(2,6).map((p,i)=>'<div class="promptcard"><strong>'+esc(p[0])+'</strong><p>'+esc(p[1])+'</p><button data-copy="prompt-'+(i+2)+'">プロンプトをコピー</button></div>').join('');
 }else if(activeTab==="character"){
 body='<h3>04　キャラ・アイコン制作</h3>'+stageGuideMarkup("character")+ '<p class="muted">人物マスターを確定してから、SNSアイコン・ステータス画像を制作します。</p>'+prompts.slice(6,9).map((p,i)=>'<div class="promptcard"><strong>'+esc(p[0])+'</strong><p>'+esc(p[1])+'</p><button data-copy="prompt-'+(i+6)+'">プロンプトをコピー</button></div>').join('');
 }else if(activeTab==="prompts"){
 body='<h3>05　プロンプト集</h3><p class="muted">コピーした文章に、依頼者の希望や素材情報を追記して使用してください。</p>'+prompts.map((p,i)=>'<div class="promptcard"><strong>'+esc(p[0])+'</strong><p>'+esc(p[1])+'</p><button data-copy="prompt-'+i+'">コピー</button></div>').join('');
 }else{
 body='<h3>06　最終確認</h3>'+stageGuideMarkup("review")+ '<p class="muted">公開ページ・管理ページを確認し、本人確認を経て完了に進めます。</p><div class="promptcard"><strong>公開前チェック</strong><p>'+esc(prompts[9][1])+'</p><button data-copy="prompt-9">コピー</button></div><label>制作メモ</label><textarea id="adminNotes">'+esc(saved.notes)+'</textarea>';
 }
 const foot='<p class="muted">ステータスは左側の依頼一覧で選択し、確定してください。</p><div class="actions"><button class="primary" id="save">進捗・メモを保存</button><span class="muted" id="saveMessage"></span></div>';
 $("detail").innerHTML=common+'<div class="worksection">'+body+'</div>'+foot;
 const cp=$("copyProduction");if(cp)cp.onclick=async()=>{const input=$("productionSlug"),msg=$("productionMessage"),slug=input.value.trim();if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)){msg.textContent="URL名を英小文字・数字・ハイフンで入力してください";input.focus();return}try{await navigator.clipboard.writeText(buildProductionPrompt(x,slug));msg.textContent="コピーしました"}catch{msg.textContent="コピーできませんでした"}};
 const updateMaterialCount=()=>{const el=$("materialCount");if(el){const values=[...$("detail").querySelectorAll("[data-material]")].map(z=>Number(z.value));el.textContent=values.filter(z=>z===1).length+"件受領 / "+values.filter(z=>z===0).length+"件未受領"}};$("detail").querySelectorAll("[data-material]").forEach(z=>z.onchange=updateMaterialCount);updateMaterialCount();
 $("detail").querySelectorAll("[data-check]").forEach(b=>b.onchange=()=>{$("checkCount").textContent=[...$("detail").querySelectorAll("[data-check]")].filter(z=>z.checked).length+" / 7 完了"});
 $("detail").querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{let v=b.dataset.copy,txt=v==="request"?x.request_text:v==="breakdown"?prompts[1][1]+"\n\n"+x.request_text:prompts[Number(v.split("-")[1])][1];try{await navigator.clipboard.writeText(txt);b.textContent="コピーしました"}catch{b.textContent="コピーできませんでした"}});
 $("save").onclick=async()=>{const b=$("save");b.disabled=true;try{if(!await refreshToken())throw Error("再ログインしてください");const current=splitNotes(x.admin_notes);const notes=$("adminNotes")?$("adminNotes").value:current.notes;const checkboxes=[...$("detail").querySelectorAll("[data-check]")];const checks=checkboxes.length?checkboxes.map(z=>z.checked):current.checks;const materialSelects=[...$("detail").querySelectorAll("[data-material]")];const materials=materialSelects.length?materialSelects.map(z=>Number(z.value)):current.materials;const r=await fetch(API+"/rest/v1/personal_page_requests?id=eq."+encodeURIComponent(x.id),{method:"PATCH",headers:{...headers(true),"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({admin_notes:mergeNotes(notes,checks,materials)})});if(!r.ok)throw Error("保存に失敗しました ("+r.status+")");const rows=await r.json();if(rows.length!==1)throw Error("更新権限がありません");Object.assign(x,rows[0]);renderList();renderDetail();$("saveMessage").textContent="保存しました"}catch(e){$("saveMessage").textContent=e.message}finally{b.disabled=false}};
}
$("workNav").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;$("workNav").querySelectorAll("[data-tab]").forEach(z=>z.classList.toggle("active",z===b));renderDetail()});
$("signIn").onclick=async()=>{try{$("loginError").textContent="";await signIn()}catch(e){$("loginError").textContent=e.message}};$("refresh").onclick=()=>load().catch(e=>alert(e.message));$("logout").onclick=()=>{sessionStorage.removeItem("ppm_auth");token="";showLogin()};load().catch(e=>{$("loginError").textContent=e.message;showLogin()});
</script></body></html>
