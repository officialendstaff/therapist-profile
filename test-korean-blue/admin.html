<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サンプル管理ページ</title><style>body{font:15px "Yu Gothic",sans-serif;background:#fff7fa;color:#29212b;margin:0}main{max-width:650px;margin:auto;padding:20px}section{background:#fff;border:1px solid #f0dbe4;border-radius:15px;padding:20px;margin:15px 0}h1{font-size:25px}h2{font-size:19px}label{display:block;margin:12px 0 5px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dfcbd5;border-radius:8px;font:inherit}textarea{min-height:75px}button,.btn{border:0;background:#e85c98;color:white;padding:12px 16px;border-radius:9px;cursor:pointer;margin:6px 4px 6px 0;text-decoration:none;display:inline-block}.item{background:#fff8fb;padding:12px;margin:10px 0;border-radius:9px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.check{width:auto}.muted{color:#86717e;font-size:13px}</style></head><body><main><h1>KOREAN BLUE | DEMO ADMIN</h1><p class="muted">デモ版です。設定はこのブラウザ内だけに保存されます。実際のセラピスト管理認証や画像ストレージ連携は未実装です。</p><a class="btn" href="index.html">公開ページを見る</a><div id="editor"></div><button onclick="save()">設定を保存</button><button onclick="if(confirm('初期化しますか？')){localStorage.removeItem('therapistTestKoreanBlueV1');location.reload()}">初期化</button></main><script src="shared.js"></script><script>
let c=getConfig();const root=document.getElementById('editor');function field(label,value,cb,kind='text'){let wrap=document.createElement('div');let l=document.createElement('label');l.textContent=label;let inp=document.createElement(kind==='textarea'?'textarea':'input');if(kind!=='textarea')inp.type=kind;inp.value=value??'';inp.addEventListener('input',()=>cb(inp.value));wrap.append(l,inp);return wrap}function sec(name){let s=document.createElement('section');s.innerHTML='<h2>'+name+'</h2>';root.append(s);return s}function addField(s,label,obj,key,kind){s.append(field(label,obj[key],v=>obj[key]=v,kind||'text'))}function checkbox(s,label,obj,key){let l=document.createElement('label');let i=document.createElement('input');i.type='checkbox';i.className='check';i.checked=!!obj[key];i.onchange=()=>obj[key]=i.checked;l.append(i,' '+label);s.append(l)}function items(s,arr,keys,create){let list=document.createElement('div');s.append(list);function draw(){list.innerHTML='';arr.forEach((item,i)=>{let div=document.createElement('div');div.className='item';keys.forEach(([label,key,type])=>addField(div,label,item,key,type));let b=document.createElement('button');b.textContent='削除';b.onclick=()=>{arr.splice(i,1);draw()};div.append(b);list.append(div)})}let add=document.createElement('button');add.textContent='＋追加';add.onclick=()=>{arr.push(create());draw()};s.append(add);draw()}let s=sec('HERO・紹介');['heroText','intro','news','todayText'].forEach(k=>addField(s,k,c,k,'textarea'));['hero','personal','profile','calendar','todayImage'].forEach(k=>addField(s,k+' 画像URL',c,k));s=sec('PHOTO');items(s,c.photos.map(x=>({url:x})),[['画像URL','url']],()=>({url:''}));s=sec('PROFILE');items(s,c.profileRows,[['項目名','label'],['回答','value']],()=>({label:'項目',value:''}));s=sec('料金シミュレーター');items(s,c.courses,[['コース名','name'],['料金（円）','price','number']],()=>({name:'新コース',price:0}));items(s,c.extras,[['料金項目','name'],['料金（円）','price','number']],()=>({name:'追加料金',price:0}));addField(s,'税率（%）',c,'tax','number');checkbox(s,'登録料金は税込',c,'taxIncluded');s=sec('交通費');checkbox(s,'出張対応あり',c,'travelEnabled');items(s,c.travelFees,[['エリア','name'],['交通費（円）','price','number']],()=>({name:'新エリア',price:0}));s=sec('LOCATION GUIDE');addField(s,'セクション名',c,'locationTitle');items(s,c.areas,[['エリア名','name'],['表示形式（image / map）','type'],['画像URL','image'],['Googleマップ埋め込みURL','map']],()=>({name:'新エリア',type:'image',image:'',map:'',visible:true}));s=sec('姫予約の項目');items(s,c.bookingFields,[['項目名','label']],()=>({label:'新項目',required:false,visible:true}));s=sec('SNS・店舗');['line','x','sub'].forEach(k=>addField(s,k+' URL',c.sns,k));['phone','shopLine','official'].forEach(k=>addField(s,k,c,k));s=sec('セクション表示');['news','sns','personal','intro','photo','today','schedule','calendar','hime','simulator','profile','location','official','contact'].forEach(k=>{if(c.visible[k]===undefined)c.visible[k]=true;checkbox(s,k,c.visible,k)});s=sec('出勤登録');let date=field('日付','',()=>{},'date'),time=field('時間（例：10:00〜16:00）','',()=>{});s.append(date,time);let b=document.createElement('button');b.textContent='出勤を登録';b.onclick=()=>{let d=date.querySelector('input').value,t=time.querySelector('input').value;if(d){c.shifts[d]=t||'お休み';alert('登録しました。保存ボタンも押してください')}};s.append(b);function save(){let p=root.querySelectorAll('section')[1];let photoItems=p.querySelectorAll('.item input');c.photos=[...photoItems].map(x=>x.value);localStorage.setItem('therapistTestKoreanBlueV1',JSON.stringify(c));alert('このブラウザに保存しました')} </script></body></html>
