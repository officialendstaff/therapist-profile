<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INTERVIEW SHEET</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#211b17;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:auto;padding:20px 14px 70px}.head{text-align:center;margin:8px 0 20px}.head h1{font-size:23px;margin:0 0 7px}.head p,.note{font-size:12px;color:#766b63;line-height:1.6}.card{background:#fff;border:1px solid #e1d8ce;border-radius:18px;padding:17px;margin-bottom:14px}h2{font-size:17px;margin:0 0 14px}.field{margin:0 0 15px}.field:last-child{margin-bottom:0}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.req{color:#a13b32;font-size:10px;margin-left:5px}input,select,textarea{width:100%;border:1px solid #d8cec3;background:#fff;border-radius:11px;padding:13px;font-size:16px;color:#211b17}textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.age{background:#f4f1ed}.switches{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pick{border:1px solid #d8cec3;background:#fff;border-radius:11px;padding:12px;font-weight:800}.pick.on{background:#211b17;color:#fff}.hidden{display:none!important}.addressMode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.history{border:1px solid #e4ddd5;border-radius:13px;padding:13px;margin-top:10px;position:relative}.history h3{font-size:13px;margin:0 0 12px}.remove{position:absolute;right:10px;top:8px;border:0;background:none;color:#a13b32;font-weight:800}.add{width:100%;border:1px dashed #9c8875;background:#faf8f5;border-radius:11px;padding:12px;font-weight:900;margin-top:10px}.submit{width:100%;border:0;border-radius:14px;background:#8b643c;color:#fff;padding:16px;font-size:16px;font-weight:900}.submit:disabled{opacity:.5}.msg{font-size:13px;margin-top:12px;text-align:center}.preview{max-width:220px;max-height:150px;display:block;margin-top:8px;border-radius:8px;border:1px solid #ddd}.privacy{font-size:11px;color:#766b63;line-height:1.7}
@media(max-width:620px){.birthAgeRow{grid-template-columns:minmax(0,1fr) 110px}.birthAgeRow input{min-width:0}.ageField input{text-align:center;padding-left:6px;padding-right:6px}}
.helpBox{margin:18px 0 12px;padding:15px;background:#fff7f4;border:1px solid #e6c9c2;border-radius:14px;text-align:center}.helpBox p{margin:0 0 10px;font-size:13px;line-height:1.65}.helpBtn{width:100%;border:1px solid #b33;background:#fff;color:#b33;border-radius:12px;padding:14px;font-size:15px;font-weight:900}.helpBtn:disabled{opacity:.6}.helpDone{font-weight:900;color:#b33}.id-type-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.id-type-choice{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid #d5c7ba;border-radius:9px;background:#fff;cursor:pointer;font-size:13px}.id-type-choice:has(input:checked){background:#e8f2ff;border-color:#4080c7;color:#16518b;font-weight:700}.id-type-choice input{width:17px;height:17px;accent-color:#2878c8;flex:none}@media(max-width:380px){.id-type-choices{grid-template-columns:1fr}}
.recruit-source-scroll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:3px}@media(max-width:380px){.recruit-source-scroll{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<div class="head"><h1>INTERVIEW SHEET</h1><p>面接前に必要事項のご入力をお願いいたします。</p></div>
<form id="form">
<section class="card hidden" id="staffEntrySection"><h2>面接シート転記</h2><p class="note">紙の面接シートをスタッフが入力します。保存先は既存の面接シートと共通です。</p><div class="field"><label>面接店舗<span class="req">必須</span></label><select id="staffShop" required><option value="">店舗を選択</option><option>Grand Luxe</option><option>Un Secret</option><option>LUXY</option><option>薔薇と紳士</option><option>BUSTY OSAKA</option></select></div><div class="field"><label>スタッフ備考</label><textarea id="staffRemarks"></textarea></div></section>
<section class="card"><h2>基本情報</h2>
<div class="field"><label>氏名<span class="req">必須</span></label><input name="name" autocomplete="name" required></div>
<div class="field"><label>フリガナ<span class="req">必須</span></label><input name="kana" required></div>
<div class="row birthAgeRow"><div class="field"><label>生年月日（西暦）<span class="req">必須</span></label><input type="text" name="birth_date" id="birth" inputmode="numeric" autocomplete="bday" maxlength="10" placeholder="例：1995/08/20" required></div><div class="field ageField"><label>年齢</label><input id="age" class="age" readonly placeholder="自動"></div></div>
<div class="field"><label>電話番号<span class="req">必須</span></label><input type="tel" name="phone" inputmode="tel" autocomplete="tel" required></div>
</section>
<section class="card"><h2>住所</h2>
<div class="addressMode"><button type="button" class="pick on" data-mode="postal">郵便番号から</button><button type="button" class="pick" data-mode="manual">住所から</button></div>
<div id="postalBox"><div class="field"><label>郵便番号</label><input id="postal" inputmode="numeric" maxlength="8" placeholder="例：5420072"><p class="note">入力すると都道府県・市区町村・町域を自動表示します。</p></div></div>
<div class="field"><label>都道府県<span class="req">必須</span></label><select id="pref" name="prefecture" required></select></div>
<div class="field"><label>市区町村・町域<span class="req">必須</span></label><input id="city" name="city" required></div>
<div class="field"><label>番地・建物名<span class="req">必須</span></label><input name="street" required></div>
</section>
<section class="card"><h2>求人媒体</h2><div class="field"><label>当店を最初に知った求人サイト・媒体<span class="req">必須・複数選択可</span></label><div class="recruit-source-scroll" role="group" aria-label="求人媒体"><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="エステ魂"><span>エステ魂</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="メンズエステワーク"><span>メンズエステワーク</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="エステラブワーク"><span>エステラブワーク</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="リラクジョブ"><span>リラクジョブ</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="エステクイーン"><span>エステクイーン</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="Richセラピ"><span>Richセラピ</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="エステアイ"><span>エステアイ</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="メンエスリクルート"><span>メンエスリクルート</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="バニラ"><span>バニラ</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="02"><span>02</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="X"><span>X</span></label><label class="id-type-choice"><input type="checkbox" name="recruit_source_choice" value="その他"><span>その他</span></label></div><p class="privacy">覚えている媒体をすべて選択してください。</p></div></section>
<section class="card"><h2>身分証</h2>
<div class="field"><label>身分証の種類<span class="req">必須・複数選択可</span></label><div id="idTypeChoices" class="id-type-choices" role="group" aria-label="身分証の種類"><label class="id-type-choice"><input type="checkbox" name="id_type_choice" value="運転免許証"><span>運転免許証</span></label><label class="id-type-choice"><input type="checkbox" name="id_type_choice" value="パスポート"><span>パスポート</span></label><label class="id-type-choice"><input type="checkbox" name="id_type_choice" value="マイナンバーカード"><span>マイナンバーカード</span></label><label class="id-type-choice"><input type="checkbox" name="id_type_choice" value="在留カード"><span>在留カード</span></label><label class="id-type-choice"><input type="checkbox" name="id_type_choice" value="本籍地記載住民票"><span>本籍地記載住民票</span></label><label class="id-type-choice"><input type="checkbox" name="id_type_choice" value="その他"><span>その他</span></label></div><p class="privacy">該当する身分証をすべて選択してください。画像添付は不要です。</p></div>
</section>
<section class="card"><h2>喫煙・タトゥー</h2>
<div class="field"><label>喫煙<span class="req">必須</span></label><select name="smoking" required><option value="">選択してください</option><option>喫煙する</option><option>喫煙しない</option></select></div>
<div class="field"><label>タトゥー<span class="req">必須</span></label><select name="tattoo" id="tattoo" required><option value="">選択してください</option><option value="なし">なし</option><option value="あり">あり</option></select></div>
<div class="field hidden" id="tattooDetail"><label>場所・大きさ</label><input name="tattoo_detail"></div>
</section>
<section class="card"><h2>エステ経験</h2>
<div class="field"><label>経験の有無<span class="req">必須</span></label><select name="experience" id="experience" required><option value="">選択してください</option><option value="なし">なし</option><option value="あり">あり</option></select></div>
<div id="historyArea" class="hidden"><div id="histories"></div><button type="button" class="add" id="addHistoryBtn">＋ 勤務歴を追加</button></div>
</section>
<div class="helpBox" id="helpBox"><p>入力方法が分からない、システムエラーなどの場合は、スタッフをお呼びください。</p><button type="button" class="helpBtn" id="helpBtn">スタッフを呼ぶ</button><div class="msg" id="helpMsg"></div></div>
<button class="submit" id="submitBtn" type="submit">入力内容を送信</button><div class="msg" id="msg"></div>
</form></main>
<script>
const SUPABASE_URL='https://vjjnkflbfsjihwzjsjpr.supabase.co';
const SUPABASE_KEY='sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage,storageKey:'mattan-recruit-auth'}});
const staffMode=new URLSearchParams(location.search).get('staff')==='1';
if(staffMode){
 document.getElementById('staffEntrySection').classList.remove('hidden');
 document.getElementById('helpBox').classList.add('hidden');
 document.querySelector('.head h1').textContent='面接シート転記';
 document.getElementById('submitBtn').textContent='面接シートを登録';
 document.querySelectorAll('#form [required]').forEach(el=>{if(el.id!=='staffShop')el.required=false});
 const group=new URLSearchParams(location.search).get('group');
 if(group==='grand')document.getElementById('staffShop').value='Grand Luxe';
 if(group==='luxy')document.getElementById('staffShop').value='LUXY';
}

const prefs=['大阪府','兵庫県','京都府','奈良県','和歌山県','滋賀県','北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
pref.innerHTML='<option value="">選択してください</option>'+prefs.map(x=>'<option>'+x+'</option>').join('');
function calcAge(){let m=birth.value.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m){age.value='';return}let y=+m[1],mo=+m[2],d=+m[3],b=new Date(y,mo-1,d);if(b.getFullYear()!==y||b.getMonth()!==mo-1||b.getDate()!==d){age.value='';return}let n=new Date(),a=n.getFullYear()-y;if(n.getMonth()+1<mo||(n.getMonth()+1===mo&&n.getDate()<d))a--;age.value=a>=0&&a<120?a+'歳':''}birth.addEventListener('input',()=>{let v=birth.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,4)+'/'+v.slice(4);if(v.length>7)v=v.slice(0,7)+'/'+v.slice(7);birth.value=v;calcAge()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));let manual=b.dataset.mode==='manual';postalBox.classList.toggle('hidden',manual);if(manual)postal.value=''});
let postalTimer;postal.addEventListener('input',()=>{clearTimeout(postalTimer);let z=postal.value.replace(/\D/g,'');postal.value=z.length>3?z.slice(0,3)+'-'+z.slice(3,7):z;if(z.length===7)postalTimer=setTimeout(()=>lookupPostal(z),250)});
async function lookupPostal(z){try{let r=await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+z),j=await r.json();if(j.results&&j.results[0]){let x=j.results[0];pref.value=x.address1;city.value=x.address2+x.address3}else alert('住所が見つかりませんでした。住所から入力してください。')}catch(e){alert('住所の自動取得ができませんでした。住所から入力してください。')}}
tattoo.onchange=()=>tattooDetail.classList.toggle('hidden',tattoo.value!=='あり');
experience.onchange=()=>{historyArea.classList.toggle('hidden',experience.value!=='あり');if(experience.value==='あり'&&!histories.children.length)appendHistory()};
function appendHistory(){let d=document.createElement('div');d.className='history';d.innerHTML='<h3>勤務歴</h3><button type="button" class="remove">削除</button><div class="field"><label>勤務地（都道府県）</label><select data-k="prefecture"><option value="">選択してください</option><option>大阪府</option><option>兵庫県</option><option>京都府</option><option>奈良県</option><option>和歌山県</option><option>滋賀県</option><option>東京都</option><option>神奈川県</option><option>埼玉県</option><option>千葉県</option><option>愛知県</option><option>福岡県</option><option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option><option>栃木県</option><option>群馬県</option><option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>三重県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option></select></div><div class="field"><label>店名</label><input data-k="shop"></div><div class="field"><label>源氏名</label><input data-k="stage_name"></div><div class="field"><label>勤務期間</label><input data-k="period" placeholder="例：1年6か月"></div><div class="field"><label>退店理由</label><textarea data-k="reason"></textarea></div>';d.querySelector('.remove').onclick=()=>d.remove();histories.append(d)}
document.getElementById('addHistoryBtn').addEventListener('click',appendHistory);

function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
async function upload(file,folder,label){if(!file)return null;let ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');let path=folder+'/'+label+'.'+ext;let {error}=await sb.storage.from('interview-id-documents').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return path}
function collectHistories(){return [...histories.querySelectorAll('.history')].map(h=>Object.fromEntries([...h.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value.trim()]))).filter(x=>Object.values(x).some(Boolean))}
function currentPayload(id,status){
 const fd=new FormData(form),birthRaw=String(fd.get('birth_date')||'').trim();
 return {id,name:String(fd.get('name')||'').trim()||null,kana:String(fd.get('kana')||'').trim()||null,birth_date:/^\d{4}\/\d{2}\/\d{2}$/.test(birthRaw)?birthRaw.replace(/\//g,'-'):null,phone:String(fd.get('phone')||'').trim()||null,prefecture:fd.get('prefecture')||null,city:String(fd.get('city')||'').trim()||null,street:String(fd.get('street')||'').trim()||null,postal_code:postal.value.replace(/\D/g,'')||null,recruit_source:[...document.querySelectorAll('input[name="recruit_source_choice"]:checked')].map(x=>x.value).join('、')||null,id_type:[...document.querySelectorAll('input[name="id_type_choice"]:checked')].map(x=>x.value).join('、')||null,id_front_path:null,id_back_path:null,smoking:fd.get('smoking')||null,tattoo:fd.get('tattoo')||null,tattoo_detail:String(fd.get('tattoo_detail')||'').trim()||null,experience:fd.get('experience')||null,work_history:collectHistories(),status};
}
helpBtn.onclick=async()=>{
 if(!confirm('スタッフを呼びますか？'))return;
 helpBtn.disabled=true;helpMsg.textContent='スタッフを呼んでいます…';
 try{
  const applicantId=uuid(),payload=currentPayload(applicantId,'面接前');payload.remarks='HELP';
  const {error}=await sb.from('interview_applicants').insert(payload);if(error)throw error;
  [...form.elements].forEach(el=>{if(el.id!=='helpBtn')el.disabled=true});
  helpBtn.textContent='スタッフを呼び出し中…';helpMsg.innerHTML='<span class="helpDone">スタッフを呼びました。そのままお待ちください。</span>';
 }catch(err){console.error(err);helpMsg.textContent='呼び出しを送信できませんでした。エラー：'+(err?.message||String(err));helpBtn.disabled=false}
};
form.onsubmit=async e=>{
 e.preventDefault();
 if(submitBtn.disabled)return;
 msg.textContent='';
 try{
  if(staffMode){
   if(!staffShop.value||!String(new FormData(form).get('name')||'').trim())throw new Error('面接店舗と氏名は必須です');
   const {data:auth,error:authError}=await sb.auth.getUser();
   if(authError||!auth?.user)throw new Error('ログイン状態を確認できません。求人管理に戻ってログインし直してください。');
  }
  if(!staffMode&&!document.querySelector('input[name="recruit_source_choice"]:checked'))throw new Error('求人媒体を1つ以上選択してください');
  if(!staffMode&&!document.querySelector('input[name="id_type_choice"]:checked'))throw new Error('身分証の種類を1つ以上選択してください');
  submitBtn.disabled=true;
  msg.textContent='登録処理中です…';
  const applicantId=uuid();
  const payload=currentPayload(applicantId,'面接前');
  if(staffMode){payload.shop=staffShop.value;payload.remarks=staffRemarks.value.trim()||null}
  const {error}=await sb.from('interview_applicants').insert(payload);
  if(error)throw error;
  if(staffMode&&new URLSearchParams(location.search).get('embedded')==='1'&&window.parent!==window){
   msg.textContent='登録完了。面接シート一覧に反映します。';
   window.parent.postMessage({type:'interview-sheet-transcribed'},location.origin);
   return;
  }
  form.innerHTML=staffMode?'<section class="card" style="text-align:center"><h2>登録完了</h2><p>共通面接シートに保存しました。</p><a href="../interview-management/">面接管理に戻る</a></section>':'<section class="card" style="text-align:center"><h2>送信完了</h2><p class="note">ご入力ありがとうございました。スタッフへ送信しました。</p></section>';
 }catch(err){
  console.error(err);
  msg.textContent=staffMode?'登録できません：'+(err?.message||String(err)) :'送信できませんでした：'+(err?.message||String(err));
  submitBtn.disabled=false;
 }
};
</script></body></html>
