<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>末端 MOBILE</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#201b18;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding:0 0 92px}.head{padding:18px 18px 14px;background:#201b18;color:#fff;position:sticky;top:0;z-index:5}.head b{font-size:17px}.head small{display:block;color:#b9aa9c;margin-top:3px}.panel{display:none;padding:16px}.panel.active{display:block}.card{background:#fff;border:1px solid #e4ddd5;border-radius:18px;padding:18px;box-shadow:0 5px 18px #00000008}h2{margin:0 0 18px;font-size:20px}label{display:block;font-size:12px;font-weight:800;margin:15px 0 7px}input,textarea,select{width:100%;font:inherit;font-size:16px;padding:13px;border:1px solid #d8d0c7;border-radius:11px;background:#fff}textarea{min-height:110px;resize:vertical}.btn{width:100%;border:0;border-radius:12px;padding:15px;margin-top:18px;background:#8b643c;color:#fff;font-weight:900;font-size:15px}.nowLib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.nowImg{padding:0;border:3px solid transparent;border-radius:13px;overflow:hidden;background:#eee}.nowImg.on{border-color:#b78b50}.nowImg img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.links{padding:12px;background:#faf8f5;border-radius:12px;margin-top:12px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;padding:14px 3px 12px;font-size:11px;font-weight:800}.nav button.active{color:#9a6b38}.nav strong{display:block;font-size:19px;margin-bottom:3px}.gate{position:fixed;inset:0;background:#f5f2ed;z-index:50;display:flex;align-items:center;padding:20px}.gate .card{width:100%}.msg{font-size:12px;color:#b33;margin-top:8px}.note{font-size:11px;color:#777;line-height:1.6}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="gate" id="gate"><div class="card"><h2>末端 MOBILE</h2><p class="note">NEWS・STAFF NOW・STAFF DIARY 専用</p><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><input id="password" type="password"><button class="btn" onclick="login()">ログイン</button><div class="msg" id="authMsg"></div></div></div>
<header class="head"><b>（株）末端興業 MOBILE</b><small>スマホ簡易更新</small></header>
<section class="panel active" id="now"><div class="card"><h2>STAFF NOW</h2><label>ステータス</label><select id="nowStatus"><option>勤務中</option><option>外出中</option><option>面接中</option><option>食事中</option><option>飲酒中</option><option>休憩中</option><option>多忙・対応不可</option><option>不在・終了</option></select><label>使用画像</label><div class="nowLib" id="nowLib"></div><label>今日の一言</label><textarea id="nowMessage"></textarea><label>面接対応可能時間</label><input id="nowHours"><button class="btn" onclick="saveNow()">STAFF NOWを更新</button></div></section>
<section class="panel" id="news"><div class="card"><h2>NEWS</h2><label>カテゴリ</label><select id="newsCategory"><option>STAFF</option><option>F</option><option>NEW FACE</option><option>SNS変更</option><option>L GROUP</option><option>その他</option></select><label>日付</label><input id="newsDate" type="date"><label>タイトル</label><input id="newsTitle"><label>本文</label><textarea id="newsBody"></textarea><label>画像</label><input id="newsImage" type="file" accept="image/*"><label><input id="newsImportant" type="checkbox" style="width:auto"> 重要なお知らせ</label><div class="links"><b>リンク（任意・最大3件）</b><div id="newsLinks"></div></div><button class="btn" onclick="saveNews()">NEWSを投稿</button></div></section>
<section class="panel" id="diary"><div class="card"><h2>STAFF DIARY</h2><label>日付</label><input id="diaryDate" type="date"><label>タイトル</label><input id="diaryTitle"><label>本文</label><textarea id="diaryBody"></textarea><label>画像</label><input id="diaryImage" type="file" accept="image/*"><button class="btn" onclick="saveDiary()">DIARYを投稿</button></div></section>
<nav class="nav"><button class="active" onclick="tab('now',this)"><strong>●</strong>STAFF NOW</button><button onclick="tab('news',this)"><strong>＋</strong>NEWS</button><button onclick="tab('diary',this)"><strong>✎</strong>DIARY</button></nav>
<script>
const SB_URL='https://vjjnkflbfsjihwzjsjpr.supabase.co',SB_KEY='sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',sb=supabase.createClient(SB_URL,SB_KEY);let nowImages=[],selectedNowImageId=null;
for(let n=1;n<=3;n++)newsLinks.insertAdjacentHTML('beforeend','<label>リンク'+n+' 表示名</label><input id="linkLabel'+n+'" placeholder="例：Xを見る / @account"><label>リンク'+n+' URL</label><input id="linkUrl'+n+'" placeholder="https://">');
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');scrollTo(0,0)}
async function login(){authMsg.textContent='';let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return authMsg.textContent='ログインできません。';gate.style.display='none';load()}
async function init(){let {data}=await sb.auth.getSession();if(data.session){gate.style.display='none';load()}let d=new Date().toISOString().slice(0,10);newsDate.value=d;diaryDate.value=d}
async function upload(file,folder){if(!file)return null;if(file.size>10*1024*1024)throw Error('画像は10MB以下にしてください');let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;let {error}=await sb.storage.from('staff-assets').upload(path,file,{contentType:file.type});if(error)throw error;return {url:sb.storage.from('staff-assets').getPublicUrl(path).data.publicUrl,path}}
async function load(){let [n,imgs]=await Promise.all([sb.from('staff_now').select('*').eq('id',1).maybeSingle(),sb.from('staff_now_images').select('*').order('sort_order')]);nowImages=imgs.data||[];if(n.data){nowStatus.value=n.data.status||'勤務中';nowMessage.value=n.data.message||'';nowHours.value=n.data.interview_hours||'';selectedNowImageId=n.data.selected_image_id||null}renderImages()}
function renderImages(){nowLib.innerHTML=nowImages.map(x=>'<button type="button" class="nowImg '+(Number(x.id)===Number(selectedNowImageId)?'on':'')+'" onclick="pickImage('+x.id+')"><img src="'+x.image_url+'"></button>').join('')}
function pickImage(id){selectedNowImageId=id;renderImages()}
async function saveNow(){try{let chosen=nowImages.find(x=>Number(x.id)===Number(selectedNowImageId)),row={id:1,status:nowStatus.value,message:nowMessage.value,interview_hours:nowHours.value,updated_at:new Date().toISOString()};if(chosen){row.selected_image_id=chosen.id;row.image_url=chosen.image_url;row.storage_path=chosen.storage_path}let {error}=await sb.from('staff_now').upsert(row);if(error)throw error;alert('STAFF NOWを更新しました')}catch(e){alert(e.message)}}
async function saveNews(){if(!newsTitle.value.trim())return alert('タイトルを入力してください');try{let u=await upload(newsImage.files[0],'news'),{data}=await sb.from('staff_news').select('sort_order'),max=(data||[]).reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0),links=[];for(let n=1;n<=3;n++){let label=document.getElementById('linkLabel'+n).value.trim(),url=document.getElementById('linkUrl'+n).value.trim();if(label&&url)links.push({label,url})}let row={category:newsCategory.value,title:newsTitle.value.trim(),body:newsBody.value.trim(),link_url:links[0]?.url||'',links_json:JSON.stringify(links),is_important:newsImportant.checked,is_public:true,sort_order:max+1,published_at:(newsDate.value||new Date().toISOString().slice(0,10))+'T00:00:00+09:00'};if(u){row.image_url=u.url;row.storage_path=u.path}let {error}=await sb.from('staff_news').insert(row);if(error)throw error;newsTitle.value='';newsBody.value='';newsImage.value='';newsImportant.checked=false;for(let n=1;n<=3;n++){document.getElementById('linkLabel'+n).value='';document.getElementById('linkUrl'+n).value=''}alert('NEWSを投稿しました')}catch(e){alert(e.message)}}
async function saveDiary(){if(!diaryTitle.value.trim())return alert('タイトルを入力してください');try{let u=await upload(diaryImage.files[0],'diary'),row={diary_date:diaryDate.value,title:diaryTitle.value.trim(),body:diaryBody.value,is_public:true};if(u){row.image_url=u.url;row.storage_path=u.path}let {error}=await sb.from('staff_diary').insert(row);if(error)throw error;diaryTitle.value='';diaryBody.value='';diaryImage.value='';alert('DIARYを投稿しました')}catch(e){alert(e.message)}}
init();
</script></body></html>
