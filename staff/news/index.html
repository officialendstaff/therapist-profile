<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS｜（株）末端興業</title><style>:root{--g:#d9ad55;--t:#f7f1e7;--m:#b9aa97}*{box-sizing:border-box}body{margin:0;background:#080707;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 16px 60px}.back{color:var(--g);text-decoration:none;font-size:12px}h1{font-family:Georgia,serif;letter-spacing:.08em}.item{background:#151111;border:1px solid #342822;border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}.item.imp{border-color:var(--g)}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.thumb{width:86px;height:58px;object-fit:cover;border-radius:9px}.tag{font-size:9px;font-weight:900;color:var(--g)}small{color:var(--m)}b{display:block;margin-top:6px}.badge{margin-left:6px;background:#a91520;padding:2px 6px;border-radius:99px;font-size:8px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.box{width:min(460px,100%);max-height:82vh;overflow:auto;background:#171414;border:1px solid #6a5134;border-radius:18px;padding:18px}.box img{width:100%;max-height:330px;object-fit:contain;border-radius:12px;margin:12px 0}.body{white-space:pre-wrap;color:#d6c9ba;line-height:1.8;font-size:13px}.close{float:right;border:0;background:#2b211c;color:white;border-radius:99px;width:34px;height:34px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="app"><a class="back" href="../">← STAFF PAGE</a><h1>NEWS</h1><p><small>過去のお知らせ</small></p><div id="list"></div></main><div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="close" onclick="closeM()">×</button><div id="content"></div></div></div><script>const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data=[];async function load(){let r=await sb.from('staff_news').select('*').eq('is_public',true).order('published_at',{ascending:false});data=r.data||[];list.innerHTML=data.map((x,i)=>'<div class="item '+(x.is_important?'imp':'')+'" onclick="openM('+i+')"><div class="row"><div><span class="tag">'+esc(x.category)+'</span><small>　'+new Date(x.published_at).toLocaleDateString('ja-JP')+'</small>'+(x.is_important?'<span class="badge">重要</span>':'')+'<b>'+esc(x.title)+'</b></div>'+(x.image_url?'<img class="thumb" src="'+x.image_url+'">':'')+'</div></div>').join('')}function openM(i){let x=data[i];content.innerHTML='<span class="tag">'+esc(x.category)+'</span>'+(x.is_important?'<span class="badge">重要</span>':'')+'<h3>'+esc(x.title)+'</h3><small>'+new Date(x.published_at).toLocaleDateString('ja-JP')+'</small>'+(x.image_url?'<img src="'+x.image_url+'">':'')+'<div class="body">'+esc(x.body||'')+'</div>';modal.classList.add('open')}function closeM(){modal.classList.remove('open')}load();</script></body></html>
