html.embeddedMode body main.wrap>.workspace>.workMain>#lineInbox{display:flex!important;flex-direction:column!important;box-sizing:border-box!important;width:100%!important;height:100%!important;max-height:100%!important;min-height:0!important;overflow:hidden!important;padding:10px 12px 8px!important;margin:0!important;background:#fff!important;border:0!important;border-radius:0!important;box-shadow:none!important}
html.embeddedMode #lineInboxMessages{display:block!important;flex:1 1 auto!important;box-sizing:border-box!important;min-height:0!important;max-height:none!important;overflow-y:auto!important;overflow-x:hidden!important;padding-bottom:0!important}
html.embeddedMode #previewHint{flex:0 0 auto!important;margin:4px 0 0!important}
</style></head><body class="lineInboxOpen">
<header class="appHeader"><div class="brand"><span>MATTAN KOUGYOU</span><strong>面接予約管理</strong></div><div class="headerRight"><button class="headerNavButton" type="button" id="returnMain">面接管理に戻る</button><span>INTERVIEW MANAGEMENT</span><span class="headerSymbol" aria-hidden="true">◈</span></div></header>
<main class="wrap">
<section id="interviewPersistentTop" aria-label="共通カレンダーと担当者スケジュール">
<section id="dailySidebarCalendar"><div class="dailyMonthNav"><button type="button" id="calPrev">‹</button><strong id="monthLabel"></strong><button type="button" id="calNext">›</button></div><div class="dailyCalendar" id="dailyCalendarDays"></div></section>
<div class="dailySection dailyScheduleSection"><div class="dailyDateTitle"><h2 id="dailyScheduleTitle"></h2><div class="dailyLegend"><span>🟩 対応可能</span><span>⬜ 対応不可（グレー）</span><span>🟪 面接予約済み</span></div><span id="dailyAvailabilityStatus" class="note">照合済み</span></div><div class="dailyTableWrap"><div class="dailyGrid dailyGantt" id="dailyScheduleGrid"></div></div></div>
</section>
<div class="workspace"><aside class="side card"><div class="navSection">
<button class="navBtn" data-index="0" type="button"><span class="sidebarNavTitle">LINE通知</span><span class="sidebarNavRight"><span class="sidebarCount"></span><span class="sidebarNavArrow">▶</span></span></button>
<button class="navBtn" data-index="1" type="button"><span class="sidebarNavTitle">明日以降の面接予定</span><span class="sidebarNavRight"><span class="sidebarCount"></span><span class="sidebarNavArrow">▶</span></span></button>
<button class="navBtn" data-index="2" type="button"><span class="sidebarNavTitle">日程調整中</span><span class="sidebarNavRight"><span class="sidebarCount"></span><span class="sidebarNavArrow">▶</span></span></button>
<button class="navBtn" data-index="3" type="button"><span class="sidebarNavTitle">不届き者達</span><span class="sidebarNavRight"><span class="sidebarCount"></span><span class="sidebarNavArrow">▶</span></span></button>
<button class="navBtn" data-index="4" type="button"><span class="sidebarNavTitle">面接実施済み</span><span class="sidebarNavRight"><span class="sidebarCount"></span><span class="sidebarNavArrow">▶</span></span></button>
<button class="navBtn afterlifeNavBtn" data-index="5" type="button"><span class="sidebarNavTitle">来世に期待</span><span class="sidebarNavRight"><span class="sidebarCount"></span><span class="sidebarNavArrow">▶</span></span></button>
<button class="navBtn" type="button" style="margin-top:22px!important;background:#234969!important;color:#fff!important" aria-current="page"><span class="sidebarNavTitle">共通ページ</span><span class="sidebarNavRight">確認用 ▶</span></button>
</div></aside><div class="workMain"><section class="card lineInbox" id="lineInbox">
<div class="scheduleHeader"><h2 id="listTitle">求人LINE受信｜全店舗</h2><div id="previewHeaderTools"><select id="previewCategory" aria-label="一覧の種類"></select><span id="previewTotal"></span><button id="previewPrev" type="button">前へ</button><strong id="previewPageLabel"></strong><button id="previewNext" type="button">次へ</button></div></div>
<div id="lineInboxMessages" aria-label="共通カード一覧"></div><p id="previewHint">レイアウト確認用のサンプルです。登録・変更・キャンセル等の操作は無効です。元の面接管理ページには変更を加えていません。</p>
</section></div></div></main>
<script>
(function(){
const views=['LINE通知','明日以降の面接予定','日程調整中','不届き者達','面接実施済み','来世に期待'];
const counts=[19,12,6,9,14,3];let view=0,page=1;
const category=document.getElementById('previewCategory'),list=document.getElementById('lineInboxMessages');
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
views.forEach((v,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=v;category.append(opt)});
document.querySelectorAll('.navBtn[data-index]').forEach(btn=>{const i=+btn.dataset.index;btn.querySelector('.sidebarCount').textContent=counts[i]+'件';btn.onclick=()=>{view=i;page=1;render()}});
document.getElementById('returnMain').onclick=()=>location.href='../';
const now=new Date(),jp=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now);let day=+jp.find(x=>x.type==='day').value,month=+jp.find(x=>x.type==='month').value,year=+jp.find(x=>x.type==='year').value,sel=day;
function dateText(){return year+'-'+String(month).padStart(2,'0')+'-'+String(sel).padStart(2,'0')}
function drawCal(){const d=document.getElementById('dailyCalendarDays');d.replaceChildren();document.getElementById('monthLabel').textContent=year+'年'+String(month).padStart(2,'0')+'月';
for(const w of ['日','月','火','水','木','金','土'])d.append(el('span','',w));const wd=new Date(Date.UTC(year,month-1,1)).getUTCDay(),n=new Date(Date.UTC(year,month,0)).getUTCDate();for(let i=0;i<wd;i++)d.append(el('span'));
for(let i=1;i<=n;i++){const b=el('button',i===sel?'selected':'',String(i));b.type='button';b.onclick=()=>{sel=i;drawCal();drawTimeline()};d.append(b)}}
document.getElementById('calPrev').onclick=()=>{month--;if(month<1){year--;month=12}sel=1;drawCal();drawTimeline()};document.getElementById('calNext').onclick=()=>{month++;if(month>12){year++;month=1}sel=1;drawCal();drawTimeline()};
function drawTimeline(){const grid=document.getElementById('dailyScheduleGrid');grid.replaceChildren();grid.append(el('div','dailyName','担当者'));const axis=el('div','ganttAxis');for(let h=10;h<=23;h++)axis.append(el('span','',h+':00'));grid.append(axis);const team=['社長','オオタ','村上','お祭り'];
team.forEach((name,k)=>{grid.append(el('div','dailyName',name));const track=el('div','ganttTrack');for(let i=0;i<28;i++){const busy=(k===1&&i===11)||(k===2&&i>=19&&i<=21);const slot=el('span','ganttSegment '+(busy?'gantt-busy':i<12?'gantt-no':'gantt-yes'),i%2?'30':'00');track.append(slot)}grid.append(track)});document.getElementById('dailyScheduleTitle').textContent=dateText()+'｜担当者スケジュール'}
function makeCard(i){
const item=el('div','lineMessage'),primary=el('div','lineNoticePrimary'),person=el('div','lineNoticePerson'),avatar=el('span','lineAvatar empty','LINE'),identity=el('div','lineNoticeIdentity');
const shop=el('span','lineStoreBadge',i%3===0?'薔薇と紳士':'Grand Luxe');shop.dataset.store=i%3===0?'rose':'grandluxe';identity.append(el('strong','', '確認用応募者 '+String(i+1).padStart(2,'0')),shop);person.append(avatar,identity);
const summary=el('div','lineNoticeSummary'),appointment=el('div','sharedInterviewAppointment');appointment.append(el('strong','',view===2?'未定':'2026-10-27 15:00'));if(view!==2)appointment.append(el('span','','担当：村上'));summary.append(appointment);
if(i%4===0){const wrap=el('div','sharedInterviewRisk');wrap.append(el('span','sharedHistoryCount',i%8===0?'日程変更 2件':'キャンセル 1件'));summary.append(wrap)}
const actions=el('div','lineBookActions sharedInterviewButtons');for(const [j,name] of ['日程変更','キャンセル','面接登録','来世に期待'].entries()){const b=el('button','action '+(j===2?'lineBookButton':j===3?'afterlifeAction':j===0?'action-change':'action-cancel'),name);b.type='button';b.disabled=true;b.title='表示確認用（操作不可）';actions.append(b)}
primary.append(person,summary,actions);item.append(primary);return item}
function render(){
category.value=String(view);document.querySelectorAll('.navBtn[data-index]').forEach(b=>b.classList.toggle('previewSelected',Number(b.dataset.index)===view));
const total=counts[view],pages=Math.max(1,Math.ceil(total/10));page=Math.max(1,Math.min(page,pages));
document.getElementById('listTitle').textContent=view===0?'求人LINE受信｜全店舗':views[view];document.getElementById('previewTotal').textContent=total+'件';
document.getElementById('previewPageLabel').textContent=page+' / '+pages+'ページ';document.getElementById('previewPrev').disabled=page===1;document.getElementById('previewNext').disabled=page===pages;
list.replaceChildren();for(let i=(page-1)*10;i<Math.min(total,page*10);i++)list.append(makeCard(i))
}
category.onchange=()=>{view=Number(category.value);page=1;render()};document.getElementById('previewPrev').onclick=()=>{page--;render()};document.getElementById('previewNext').onclick=()=>{page++;render()};
drawCal();drawTimeline();render();
})();
</script></body></html>
