<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共通ページ｜面接一覧プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#183350;font:12px Arial,"Noto Sans JP",sans-serif}
header{height:76px;background:#17283f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:3px solid #bda477}
header h1{font-size:19px;margin:0}header a{color:#fff;border:1px solid #b6c4d5;border-radius:7px;padding:9px 14px;text-decoration:none}
main{padding:16px;max-width:1510px;margin:auto}.note{margin:0 0 12px;color:#5b6878}
.cardPanel{border:1px solid #d8e0e9;background:white;border-radius:10px;padding:10px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
h2{margin:0;font-size:17px;color:#183350}.control{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
select,.pager button{background:white;border:1px solid #b8cce2;border-radius:6px;height:34px;padding:0 9px;color:#183350;font-weight:700}
.pager{display:flex;align-items:center;gap:8px}.pager button:disabled{opacity:.4}
.list{display:flex;flex-direction:column;gap:3px;min-height:587px}
.personCard{display:grid;grid-template-columns:165px minmax(0,1fr) 318px;align-items:center;gap:8px;width:100%;height:56px;min-height:56px;padding:5px 8px;border:1px solid #dce4ee;border-radius:7px;background:#fff;overflow:hidden}
.person{display:flex;align-items:center;gap:8px;min-width:0}.avatar{width:36px;height:36px;flex:0 0 36px;background:#e7edf4;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700}
.identity{display:flex;flex-direction:column;gap:2px;min-width:0}.identity strong{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop{align-self:flex-start;border:1px solid #d5b667;border-radius:5px;padding:2px 6px;background:#f7edcf;color:#79530c;font-size:10px;font-weight:800;line-height:13px}.shop.rose{background:#f7e6eb;border-color:#dca8b8;color:#872c48}
.summary{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}.appointment{background:#edf5fc;border:1px solid #bed2e8;border-radius:6px;height:34px;display:flex;align-items:center;gap:8px;padding:4px 9px;white-space:nowrap;min-width:0}.appointment strong{font-size:12px}.appointment span{font-size:11px}
.history{background:#fff3f4;border:1px solid #e3b5bd;color:#953741;padding:6px;border-radius:5px;white-space:nowrap;font-size:10px}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:4px}.actions button{width:76px;height:32px;min-width:76px;border:1px solid #d5dbe3;background:#edf0f4;color:#8c99a9;font-size:10px;font-weight:800;border-radius:6px;white-space:nowrap;padding:0 2px}
.actions button.active{background:#176b9b;color:white;border-color:#10547d}
footer{margin-top:10px;font-size:11px;color:#76869b}
@media(max-width:1100px){.cardPanel{overflow-x:auto}.list,.bar{min-width:1060px}}
</style></head><body><header><h1>共通ページ｜面接一覧</h1><a href="../">面接管理に戻る</a></header>
<main><p class="note">表示確認用プレビューです。応募者はすべてサンプルデータです。登録・変更・キャンセル処理には接続していません。</p>
<section class="cardPanel"><div class="bar"><h2 id="title">LINE通知</h2><div class="control"><select id="category" aria-label="表示一覧"></select><span id="counter"></span><div class="pager"><button id="prev">前へ</button><b id="page"></b><button id="next">次へ</button></div></div></div><div id="list" class="list"></div><footer>カード高さ56px・1ページ10件・10件未満でも背景高さを維持。履歴は項目と件数だけ表示します。</footer></section></main>
<script>
const labels=['LINE通知','明日以降の面接予定','日程調整中','不届き者達','面接実施済み','来世に期待'];const category=document.getElementById('category');labels.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x;category.append(o)});
const list=document.getElementById('list');let page=1;
function make(tag,cls,txt){const x=document.createElement(tag);x.className=cls||'';if(txt!==undefined)x.textContent=txt;return x}
function render(){
const type=Number(category.value||0);const counts=[19,12,6,9,14,3];const n=counts[type],pages=Math.max(1,Math.ceil(n/10));page=Math.min(Math.max(page,1),pages);
document.getElementById('title').textContent=labels[type];document.getElementById('counter').textContent=n+'件';document.getElementById('page').textContent=page+' / '+pages+'ページ';document.getElementById('prev').disabled=page===1;document.getElementById('next').disabled=page===pages;list.replaceChildren();
for(let i=(page-1)*10;i<Math.min(n,page*10);i++){const row=make('div','personCard'),person=make('div','person'),identity=make('div','identity'),shop=make('span','shop'+(i%3===0?' rose':''),i%3===0?'薔薇と紳士':'Grand Luxe');identity.append(make('strong','', 'サンプル応募者 '+String(i+1).padStart(2,'0')),shop);person.append(make('span','avatar','LINE'),identity);
const summary=make('div','summary'),appointment=make('div','appointment');appointment.append(make('strong','',type===2?'未定':'2026-10-27 15:00'),make('span','',type===2?'':'担当：村上'));summary.append(appointment);if(i%4===0)summary.append(make('span','history','日程変更 2件'));
const actions=make('div','actions');for(const [j,label] of ['日程変更','キャンセル','面接登録','来世に期待'].entries()){const btn=make('button',type===0&&j===2?'active':'',label);btn.disabled=true;btn.title='プレビュー専用';actions.append(btn)}row.append(person,summary,actions);list.append(row)}
}
category.onchange=()=>{page=1;render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};render();
</script></body></html>
