<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>面接予定登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#211b17;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:560px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e1d8ce;border-radius:18px;padding:16px;margin-bottom:14px}h1{font-size:21px;margin:4px 0 18px}h2{font-size:17px;margin:0 0 12px}.calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calHead button,.choice,.time,.action{border:1px solid #d8cec3;background:#fff;border-radius:11px;padding:11px;font-weight:800}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:10px;color:#87796e}.day{min-height:48px;border:0;border-radius:10px;background:#f8f5f1;font-weight:800}.day.block{background:#e8e3de;color:#aaa}.day.partial{background:#fff0c9}.day.busy{outline:2px solid #c99c55}.day.sel{background:#211b17;color:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice.on{background:#211b17;color:#fff}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.time{padding:10px 3px;font-size:12px}.time:disabled{background:#eee;color:#aaa}.time.on{background:#9a6b38;color:#fff}.confirm{width:100%;border:0;border-radius:13px;background:#8b643c;color:#fff;padding:15px;font-weight:900;font-size:15px;margin-top:14px}.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.item b{display:block}.action{margin-top:8px;padding:8px 11px;font-size:12px}.note{font-size:11px;color:#766b63;line-height:1.6}.legend{font-size:11px;color:#766b63;margin-top:9px}.msg{color:#a22;font-size:12px}.template{white-space:pre-wrap;background:#faf8f5;border:1px solid #e5ddd4;border-radius:12px;padding:13px;font-size:13px;line-height:1.8;margin-top:10px}.copyBtn{width:100%;border:1px solid #8b643c;background:#fff;color:#6f4d2d;border-radius:12px;padding:13px;font-weight:900;margin-top:10px}</style></head><body><main class="wrap"><h1>面接予定</h1><section class="card"><h2>スケジュール確認</h2><div class="calHead"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div><div class="legend">○ 空き　△ 一部対応不可　× 対応不可　枠線＝面接あり</div></section><section class="card"><h2>新規面接</h2><p class="note" id="picked">日付をタップしてください。</p><div id="times" class="times"></div><h2 style="margin-top:18px">店舗</h2><div class="choices"><button class="choice" data-shop="薔薇と紳士">薔薇と紳士</button><button class="choice" data-shop="BUSTY OSAKA">BUSTY OSAKA</button></div><button class="confirm" id="save">この内容で確定</button><div class="msg" id="msg"></div><div id="messageTemplateCard" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid #eee"><h2 id="templateTitle">送信用テンプレート</h2><p class="note">選択した店舗・面接日時に合わせて自動で切り替わります。</p><div class="template" id="messageTemplate"></div><button class="copyBtn" id="copyTemplate" type="button">テンプレートをコピー</button><div class="msg" id="copyMsg"></div></div></section><section class="card" style="display:none"></section><section class="card"><h2>面接予定一覧</h2><div id="list">読み込み中...</div></section></main><script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos');let view=new Date(),date='',time='',shop='',interviews=[],blocks=[];view.setDate(1);
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function slots(){let a=[];for(let h=10;h<=23;h++)for(let m of [0,30])if(!(h===23&&m===30))a.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));return a}
function blocked(d,t){return blocks.some(b=>b.block_date===d&&(b.all_day||(!t?true:(t>=b.start_time.slice(0,5)&&t<b.end_time.slice(0,5)))))}function occupied(d,t){return interviews.some(i=>i.interview_date===d&&i.interview_time.slice(0,5)===t&&!['キャンセル','面接済'].includes(i.status))}
function render(){month.textContent=view.getFullYear()+'年 '+(view.getMonth()+1)+'月';days.innerHTML='';let first=new Date(view.getFullYear(),view.getMonth(),1),last=new Date(view.getFullYear(),view.getMonth()+1,0);for(let i=0;i<first.getDay();i++)days.append(document.createElement('span'));for(let n=1;n<=last.getDate();n++){let d=new Date(view.getFullYear(),view.getMonth(),n),k=key(d),b=document.createElement('button');b.className='day';b.textContent=n;let all=blocked(k,null)&&blocks.some(x=>x.block_date===k&&x.all_day),part=blocks.some(x=>x.block_date===k&&!x.all_day),busy=interviews.some(x=>x.interview_date===k&&!['キャンセル','面接済'].includes(x.status));if(all)b.classList.add('block');else if(part)b.classList.add('partial');if(busy)b.classList.add('busy');if(k===date)b.classList.add('sel');b.onclick=()=>{if(all)return;date=k;time='';render();renderTimes()};days.append(b)}}function renderTimes(){picked.textContent=date?date+' の空き時間':'日付をタップしてください。';times.innerHTML='';if(!date)return;slots().forEach(t=>{let b=document.createElement('button');b.className='time';b.textContent=t;b.disabled=blocked(date,t)||occupied(date,t);if(t===time)b.classList.add('on');b.onclick=()=>{time=t;renderTimes();renderTemplate()};times.append(b)})}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{shop=b.dataset.shop;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x===b));renderTemplate()});prev.onclick=()=>{view.setMonth(view.getMonth()-1);render()};next.onclick=()=>{view.setMonth(view.getMonth()+1);render()};

function jpDateTime(){if(!date||!time)return '';let p=date.split('-');return Number(p[0])+'年'+Number(p[1])+'月'+Number(p[2])+'日 '+time}
function bustyText(){return '面接日程のご案内です🌷✨\n📅 面接日程：'+jpDateTime()+'\n\n📍 面接場所\n大阪市中央区高津2-6-1 高津Leesビル\n到着されましたら、こちらのLINEにご連絡をお願いいたします☺️\n\n【🌸 当日のご連絡について】\n面接予定時間の「2時間前」に、確認のため一度こちらのLINEへご連絡をお願いいたします✨\nご連絡がない場合、面接担当者のスケジュールの都合により、予定のお時間に面接ができない場合や、日程変更をお願いする場合がございます🙇‍♀️\n\nお手数をおかけしますが、スムーズにご案内するため、ご協力をお願いいたします🌷\nそれでは当日、お会いできるのを楽しみにしております✨\nお気をつけてお越しください☺️'}
function roseText(){return '面接日程についてご案内いたします。\n\n■ 面接日程：'+jpDateTime()+'\n\n■ 面接場所\n大阪市中央区高津2-6-1　高津Leesビル\nご到着されましたら、こちらのLINEまでご連絡をお願いいたします。\n\n【当日のご連絡について】\n恐れ入りますが、面接予定時間の「2時間前」に、確認のため一度こちらのLINEへご連絡をお願いいたします。\n\n事前のご連絡がない場合、面接担当者のスケジュールの都合により、予定のお時間に面接を実施できない場合や、日程変更をお願いする場合がございます。\n\n確実に面接のお時間を確保するため、ご協力いただけますと幸いです。\n\nそれでは当日、どうぞお気をつけてお越しください。\nよろしくお願いいたします。'}
function currentTemplate(){return shop==='BUSTY OSAKA'?bustyText():shop==='薔薇と紳士'?roseText():''}
function renderTemplate(){let show=!!shop&&!!date&&!!time;messageTemplateCard.style.display=show?'block':'none';if(show){templateTitle.textContent=shop+'｜送信用テンプレート';messageTemplate.textContent=currentTemplate()}}
copyTemplate.onclick=async()=>{let txt=currentTemplate();try{await navigator.clipboard.writeText(txt);copyMsg.textContent='コピーしました。'}catch(e){let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copyMsg.textContent='コピーしました。'}}

async function load(){let [a,b]=await Promise.all([sb.from('staff_interviews').select('*').order('interview_date').order('interview_time'),sb.from('staff_schedule_blocks').select('*')]);if(a.error||b.error){msg.textContent='初期設定が必要です。';return}interviews=a.data||[];blocks=b.data||[];render();renderTimes();renderList()}
function renderList(){let now=key(new Date());list.innerHTML=interviews.filter(i=>i.interview_date>=now&&!['キャンセル','面接済'].includes(i.status)).map(i=>'<div class="item"><b>'+i.interview_date+' '+i.interview_time.slice(0,5)+'｜'+i.shop+'</b><span class="note">'+i.status+'</span><br><button class="action" onclick="changeDate('+i.id+')">日程変更</button> <button class="action" onclick="cancelIt('+i.id+')">キャンセル</button></div>').join('')||'<p class="note">予定はありません。</p>'}
async function changeDate(id){let i=interviews.find(x=>x.id===id);date=i.interview_date;shop=i.shop;time='';view=new Date(date+'T00:00:00');view.setDate(1);document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x.dataset.shop===shop));render();renderTimes();save.dataset.edit=id;window.scrollTo({top:0,behavior:'smooth'})}
async function cancelIt(id){if(!confirm('キャンセルに変更しますか？'))return;let {error}=await sb.from('staff_interviews').update({status:'キャンセル',alert:true,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);load()}
save.onclick=async()=>{if(!date||!time||!shop)return msg.textContent='日付・時間・店舗を選択してください。';let edit=save.dataset.edit;if(edit){let {error}=await sb.from('staff_interviews').update({interview_date:date,interview_time:time,status:'日程変更',alert:true,updated_at:new Date().toISOString()}).eq('id',edit);if(error)return msg.textContent=error.message;delete save.dataset.edit}else{let {error}=await sb.from('staff_interviews').insert({shop,interview_date:date,interview_time:time,status:'面接予定',alert:false});if(error)return msg.textContent=error.message}msg.textContent='登録しました。';renderTemplate();await load()};load();
</script></body></html>
