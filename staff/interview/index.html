const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos');let view=new Date(),date='',time='',shop='',interviews=[],blocks=[],staff='';const staffByShop={'Grand Luxe':['社長','太田君'],'Un Secret':['社長','太田君'],'LUXY':['社長','太田君'],'薔薇と紳士':['村上'],'BUSTY OSAKA':['村上']};view.setDate(1);

function render(){month.textContent=view.getFullYear()+'年 '+(view.getMonth()+1)+'月';days.innerHTML='';let first=new Date(view.getFullYear(),view.getMonth(),1),last=new Date(view.getFullYear(),view.getMonth()+1,0);for(let i=0;i<first.getDay();i++)days.append(document.createElement('span'));for(let n=1;n<=last.getDate();n++){let d=new Date(view.getFullYear(),view.getMonth(),n),k=key(d),b=document.createElement('button');b.className='day';b.textContent=n;let now=nowJst(),past=k<now.date;if(past){b.classList.add('block');b.disabled=true}let hasBlock=groupBlocks().some(x=>x.block_date===k),busy=groupInterviews().some(x=>x.interview_date===k&&!['キャンセル','面接済','採用','不採用','トビ（キャンセル）'].includes(x.status));if(!past&&(busy||hasBlock)){let marks=document.createElement('span');marks.className='markers';for(let color of [busy?'blue':null,hasBlock?'red':null].filter(Boolean)){let dot=document.createElement('span');dot.className='dot '+color;marks.append(dot)}b.append(marks)}if(k===date&&!past)b.classList.add('sel');b.onclick=()=>{if(past)return;if(!shop){document.getElementById('calendarError').hidden=false;document.querySelector('.storeNav').classList.add('needsSelection');return}document.getElementById('calendarError').hidden=true;date=k;time='';render();renderStaff();renderTimes()};days.append(b)}}function renderStaff(){document.getElementById('registrationStep').hidden=!date;document.getElementById('calendarCard').classList.toggle('compact',!!date);const people=staffByShop[shop]||[];if(!people.includes(staff))staff='';document.getElementById('shopHint').textContent=shop?('選択店舗：'+shop+'　／　担当者を選択してください。'):'左側から店舗を選択してください。';document.getElementById('staffChoices').innerHTML=people.map(p=>'<button type="button" class="'+(staff===p?'on':'')+'" data-staff="'+p+'">'+p+'</button>').join('');document.querySelectorAll('[data-staff]').forEach(b=>b.onclick=()=>{staff=b.dataset.staff;time='';renderStaff();renderTimes()})}function renderTimes(){picked.textContent=date?date+' の空き時間':'日付をタップしてください。';times.innerHTML='';if(!date||!shop||!staff)return;slots().filter(t=>{const n=nowJst();return date!==n.date||mins(t)>n.mins}).forEach(t=>{let b=document.createElement('button');b.className='time';b.textContent=t;let now=nowJst();b.disabled=blocked(date,t)||(save.dataset.edit?groupInterviews().some(i=>i.interview_date===date&&Number(i.id)!==Number(save.dataset.edit)&&!['キャンセル','面接済'].includes(i.status)&&Math.abs(mins(i.interview_time)-mins(t))<90):occupied(date,t,null))||(date<now.date)||(date===now.date&&mins(t)<=now.mins);if(t===time)b.classList.add('on');b.onclick=()=>{time=t;renderTimes();renderTemplate()};times.append(b)})}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{shop=b.dataset.shop;staff='';time='';document.getElementById('calendarError').hidden=true;document.querySelector('.storeNav').classList.remove('needsSelection');document.body.dataset.activeShop=shop;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x===b));render();renderStaff();renderTimes();renderTemplate()});prev.onclick=()=>{view.setMonth(view.getMonth()-1);render()};next.onclick=()=>{view.setMonth(view.getMonth()+1);render()};

function roseText(){return '面接日程についてご案内いたします。\n\n■ 面接日程：'+jpDateTime()+'\n\n■ 面接場所\n大阪市中央区高津2-6-1　高津Leesビル\nご到着されましたら、こちらのLINEまでご連絡をお願いいたします。\n\n【当日のご連絡について】\n恐れ入りますが、面接予定時間の「2時間前」に、確認のため一度こちらのLINEへご連絡をお願いいたします。\n\n事前のご連絡がない場合、面接担当者のスケジュールの都合により、予定のお時間に面接を実施できない場合や、日程変更をお願いする場合がございます。\n\n確実に面接のお時間を確保するため、ご協力いただけますと幸いです。\n\nそれでは当日、どうぞお気をつけてお越しください。\nよろしくお願いいたします。'}
function currentTemplate(){return shop==='BUSTY OSAKA'?bustyText():shop==='薔薇と紳士'?roseText():''}
function renderTemplate(){let show=!!shop&&!!date&&!!time;messageTemplateCard.style.display=show?'block':'none';if(show){templateTitle.textContent=shop+'｜送信用テンプレート';messageTemplate.textContent=currentTemplate()}}

let interviewLoading=false;
async function load(){
 if(interviewLoading)return;
 interviewLoading=true;
 const list=document.getElementById('list'),msg=document.getElementById('msg');
 const timeout=ms=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('通信がタイムアウトしました。再読み込みしてください。')),ms));
 try{
  const [a,b]=await Promise.race([Promise.all([
   sb.from('staff_interviews').select('*').order('interview_date').order('interview_time'),
   sb.from('staff_schedule_blocks').select('*')
  ]),timeout(12000)]);
  if(a.error||b.error)throw (a.error||b.error);
  interviews=a.data||[];
  const raw=b.data||[];
  blocks=Object.values(raw.reduce((m,x)=>{const cur=m[x.block_date];if(!cur||Number(x.id)>Number(cur.id))m[x.block_date]=x;return m},{}));
  msg.textContent='';
  render();renderStaff();renderTimes();renderList();
 }catch(e){
  console.error('interview load failed',e);
  msg.textContent='読み込みエラー：'+(e.message||String(e));
  list.innerHTML='<span class="note">面接予定を取得できませんでした。</span> <button type="button" class="action" onclick="load()">再試行</button>';
 }finally{interviewLoading=false}
}
function togglePastInterviews(){const e=document.getElementById('pastInterviewList'),b=document.getElementById('pastInterviewToggle');const open=e.style.display==='none';e.style.display=open?'block':'none';b.setAttribute('aria-expanded',String(open));document.getElementById('pastInterviewArrow').textContent=open?'▲':'▼'}

 const now=nowJst().date;

 document.getElementById('todayList').innerHTML=active.filter(i=>i.interview_date===now).map(row).join('')||'<p class="note">今日の未確認の面接予定はありません。</p>';
 list.innerHTML=active.filter(i=>i.interview_date>now).map(row).join('')||'<p class="note">明日以降の未確認の面接予定はありません。</p>';
 const history=interviews.filter(i=>i.interview_date<now||i.confirmed===true||['キャンセル','面接済','採用','不採用','トビ（キャンセル）'].includes(i.status)).sort((a,b)=>(b.interview_date+' '+b.interview_time).localeCompare(a.interview_date+' '+a.interview_time));
 document.getElementById('pastInterviewCount').textContent='('+history.length+'件)';
 document.getElementById('pastInterviewList').innerHTML=history.map(i=>'<div class="item"><b>'+i.interview_date+' '+String(i.interview_time).slice(0,5)+'｜'+i.shop+'</b><span class="note">'+(i.status==='キャンセル'?'キャンセル':i.confirmed===true?'確認済み':i.status)+'</span>'+(i.confirmed===true&&i.interview_date>=now&&!['キャンセル','面接済','採用','不採用','トビ（キャンセル）'].includes(i.status)?'<br><button class="action" onclick="restoreInterview('+i.id+')">面接予定一覧に戻す</button> <button class="action" onclick="changeDate('+i.id+')">日程変更</button> <button class="action" onclick="cancelIt('+i.id+')">キャンセル</button>':'')+'</div>').join('')||'<p class="note">該当する面接予定はありません。</p>'
}
function showSchedule(which){const viewBox=document.getElementById('scheduleView'),content=document.getElementById('scheduleViewContent'),source=document.getElementById(which==='future'?'list':'pastInterviewList');document.getElementById('scheduleTitle').textContent=which==='future'?'明日以降の面接予定（全店舗）':'過去の面接予定（全店舗）';content.innerHTML=source.innerHTML;viewBox.hidden=false;document.querySelector('.workLeft').style.display='none';document.getElementById('futureNav').setAttribute('aria-expanded',String(which==='future'));document.getElementById('historyNav').setAttribute('aria-expanded',String(which==='past'))}function closeSchedule(){document.getElementById('scheduleView').hidden=true;document.querySelector('.workLeft').style.display='';document.getElementById('futureNav').setAttribute('aria-expanded','false');document.getElementById('historyNav').setAttribute('aria-expanded','false')}document.getElementById('historyNav').onclick=()=>showSchedule('past');document.getElementById('futureNav').onclick=()=>showSchedule('future');document.getElementById('backToCalendar').onclick=closeSchedule;

save.onclick=async()=>{if(!date||!time||!shop||!staff)return msg.textContent='日付・店舗・担当者・時間を選択してください。';let edit=save.dataset.edit;if(edit){let {error}=await sb.from('staff_interviews').update({previous_interview_date:interviews.find(x=>String(x.id)===String(edit))?.interview_date||null,previous_interview_time:interviews.find(x=>String(x.id)===String(edit))?.interview_time||null,interview_date:date,interview_time:time,status:'日程変更',confirmed:false,alert:true,updated_at:new Date().toISOString()}).eq('id',edit);if(error)return msg.textContent=error.message;delete save.dataset.edit}else{let {error}=await sb.from('staff_interviews').insert({shop,interview_date:date,interview_time:time,status:'面接予定',confirmed:false,alert:false});if(error)return msg.textContent=error.message}msg.textContent='登録しました。全店舗カレンダーに戻りました。';shop='';date='';time='';staff='';delete save.dataset.edit;document.body.dataset.activeShop='';document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));document.getElementById('calendarError').hidden=true;document.querySelector('.storeNav').classList.remove('needsSelection');renderTemplate();await load();closeSchedule();render();renderStaff();renderTimes();window.scrollTo({top:0,behavior:'smooth'})};render();renderStaff();load();
