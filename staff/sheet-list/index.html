<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面接シート一覧｜L GROUP</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#201b18;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#101923;color:#fff;padding:17px}main{max-width:760px;margin:auto;padding:18px}h1{font-size:20px;margin:0 0 12px}a{color:#245eaa}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;padding:13px;border:1px solid #b7c7d9;border-radius:10px;background:#fff;font-weight:800}.tabs button.active{background:#245eaa;color:#fff}.item{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #d6e3f1;border-radius:12px;margin:9px 0;padding:14px}.item b{display:block}.item small{color:#56677b;display:block;margin-top:7px}.status{float:right;font-size:12px;background:#e7eff9;border-radius:6px;padding:4px 8px}#message{padding:15px;background:#fff;border-radius:10px}input{padding:12px;width:100%;margin:7px 0;border:1px solid #bbb;border-radius:8px}#login button{padding:12px;border:0;border-radius:8px;background:#245eaa;color:#fff}</style></head><body><header>求人管理｜L GROUP</header><main><a href="../recruit-line/">← 求人管理へ戻る</a><h1>面接シート一覧</h1><div id="login" hidden><p>管理者ログインが必要です。</p><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><button id="signIn">ログイン</button></div><div id="content" hidden><div class="tabs"><button id="hired" class="active">採用（0）</button><button id="rejected">不採用（0）</button></div><div id="rows"></div></div><p id="message">認証を確認しています…</p></main><script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:'mattan-mobile-auth'}});
let records=[],tab='採用';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const hired=records.filter(x=>['採用','在籍','退職'].includes(x.status)),rejected=records.filter(x=>x.status==='不採用');el('hired').textContent='採用（'+hired.length+'）';el('rejected').textContent='不採用（'+rejected.length+'）';el('hired').classList.toggle('active',tab==='採用');el('rejected').classList.toggle('active',tab==='不採用');const list=tab==='採用'?hired:rejected;el('rows').innerHTML=list.length?list.map(x=>'<a class="item" href="../mobile/?sheet='+encodeURIComponent(x.id)+'&from=sheet-list"><span class="status">'+esc(x.status)+'</span><b>'+esc(x.name||'氏名未入力')+'</b><small>'+esc(x.kana||'')+'　'+esc(x.shop||'')+'　'+esc(x.submitted_at?new Date(x.submitted_at).toLocaleDateString('ja-JP'):'')+'</small></a>').join(''):'<p>該当する面接シートはありません。</p>'}
async function load(){el('message').textContent='読み込み中…';const {data,error}=await sb.from('interview_applicants').select('id,name,kana,shop,status,submitted_at').in('status',['採用','在籍','退職','不採用']).order('submitted_at',{ascending:false});if(error){el('message').textContent='取得できません：'+error.message;return}records=data||[];el('message').hidden=true;el('content').hidden=false;render()}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){el('login').hidden=false;el('message').textContent='ログインしてください。';return}el('login').hidden=true;await load()}
el('hired').onclick=()=>{tab='採用';render()};el('rejected').onclick=()=>{tab='不採用';render()};el('signIn').onclick=async()=>{el('message').textContent='ログイン中…';const {error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){el('message').textContent=error.message;return}init()};init();
</script></body></html>
