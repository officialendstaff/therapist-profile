<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Luxe｜面接シート一覧</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{width:100%;margin:0}body{background:#eaf3fd;color:#102235;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;font-size:14px}
header{background:#0e1924;color:#fff;padding:20px 18px;font-size:16px;font-weight:800;letter-spacing:.03em}
main{max-width:760px;margin:auto;padding:20px 16px 80px}h1{font-size:22px;margin:20px 0 18px;letter-spacing:.02em}
a{color:#3478ca}main>a{display:inline-flex;align-items:center;text-decoration:none;font-size:13px;font-weight:800;padding:9px 0}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0}
.tabs button{min-width:0;min-height:47px;padding:11px 8px;border:1px solid #c8def3;border-radius:11px;background:#fff;color:#23415f;font-size:13px;font-weight:800;cursor:pointer;transition:background .15s}
.tabs button.active{background:#102235;color:#fff;border-color:#102235;box-shadow:0 3px 10px #1022351a}
#shops{margin-top:18px;margin-bottom:19px}#shops button.active{background:#3478ca;border-color:#3478ca;color:#fff}
.item{display:block;text-decoration:none;color:#102235;background:#fff;border:1px solid #c8def3;border-radius:15px;margin:10px 0;padding:17px 16px;box-shadow:0 4px 14px #00000007}
.item b{display:block;font-size:16px;line-height:1.5;padding-right:55px}.item small{color:#60758d;display:block;margin-top:8px;line-height:1.6;font-size:12px}
.status{float:right;font-size:11px;font-weight:800;background:#eaf3fd;color:#3478ca;border:1px solid #c8def3;border-radius:20px;padding:4px 9px}
#message{padding:15px;background:#fff;border:1px solid #c8def3;border-radius:12px;color:#60758d}
input{padding:13px;width:100%;margin:7px 0;border:1px solid #c8def3;border-radius:11px;background:#fff;font-size:16px}
#login{background:#fff;border:1px solid #c8def3;border-radius:16px;padding:17px;margin-top:14px}
#login button{padding:13px 20px;border:0;border-radius:11px;background:#3478ca;color:#fff;font-weight:800}
#rows>p{padding:22px 15px;text-align:center;background:#fff;border:1px solid #c8def3;border-radius:13px;color:#60758d}
</style></head><body><header>求人管理｜L GROUP</header><main><a id="storeReturn" href="../../recruit-line/">← 店舗ページに戻る</a><h1>Grand Luxe｜面接シート一覧</h1><div id="login" hidden><p>管理者ログインが必要です。</p><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><button id="signIn">ログイン</button></div><div id="content" hidden><div class="tabs"><button id="hired" class="active">採用（0）</button><button id="rejected">不採用（0）</button><button id="other">その他・過去（0）</button></div><div id="rows"></div></div><p id="message">認証を確認しています…</p></main><script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage,storageKey:'mattan-recruit-auth'}});
const returnLink=document.getElementById('storeReturn');const shop="Grand Luxe";returnLink.addEventListener('click',()=>{sessionStorage.setItem('recruit-line-return-store',shop);sessionStorage.setItem('recruit-line-return-page','reports')});let records=[],tab='採用';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const scoped=records.filter(x=>x.shop===shop);const hired=scoped.filter(x=>['採用','在籍','退職'].includes(x.status)),rejected=scoped.filter(x=>x.status==='不採用'),other=scoped.filter(x=>!['採用','在籍','退職','不採用'].includes(x.status));el('other').textContent='その他・過去（'+other.length+'）';el('hired').textContent='採用（'+hired.length+'）';el('rejected').textContent='不採用（'+rejected.length+'）';el('hired').classList.toggle('active',tab==='採用');el('rejected').classList.toggle('active',tab==='不採用');el('other').classList.toggle('active',tab==='その他');const list=tab==='採用'?hired:tab==='不採用'?rejected:other;el('rows').innerHTML=list.length?list.map(x=>'<a class="item" href="../../interview-management/?sheet='+encodeURIComponent(x.id)+'&store='+encodeURIComponent(x.shop||'')+'&group=rose&from=sheet-list&list='+encodeURIComponent(location.pathname)+'"><span class="status">'+esc(x.status)+'</span><b>'+esc(x.name||'氏名未入力')+'</b><small>'+esc(x.kana||'')+'　'+esc(x.shop||'')+'　'+esc(x.submitted_at?new Date(x.submitted_at).toLocaleDateString('ja-JP'):'')+'</small></a>').join(''):'<p>該当する面接シートはありません。</p>'}
async function load(){el('message').textContent='読み込み中…';const {data,error}=await sb.from('interview_applicants').select('id,name,kana,shop,status,submitted_at').order('submitted_at',{ascending:false});if(error){el('message').textContent='取得できません：'+error.message;return}records=data||[];el('message').hidden=true;el('content').hidden=false;render()}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){el('login').hidden=false;el('message').textContent='ログインしてください。';return}el('login').hidden=true;await load()}
el('hired').onclick=()=>{tab='採用';render()};el('rejected').onclick=()=>{tab='不採用';render()};el('other').onclick=()=>{tab='その他';render()};el('signIn').onclick=async()=>{el('message').textContent='ログイン中…';const {error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){el('message').textContent=error.message;return}init()};init();
</script></body></html>
