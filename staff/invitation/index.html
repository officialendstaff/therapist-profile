<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRESENT CAMPAIGN｜（株）末端興業</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090707;--panel:#171313;--line:#49392b;--gold:#d9ad55;--gold2:#f3d58b;--text:#f7f1e7;--muted:#b9aa97;--red:#9f1720}*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;background:linear-gradient(#100d0d,#080707)}.hero{padding:54px 20px 34px;text-align:center;border-bottom:1px solid #2b211c}.tag{font-size:10px;letter-spacing:.25em;color:var(--gold);font-weight:900}.hero h1{font-family:Georgia,serif;font-size:34px;line-height:1.2;margin:12px 0}.hero .lead{font-size:18px;font-weight:900;line-height:1.6}.hero img{width:100%;border-radius:18px;margin-top:22px;border:1px solid var(--line)}section{padding:32px 18px;border-bottom:1px solid #2b211c}h2{font-family:Georgia,serif;letter-spacing:.06em;margin:0 0 18px;font-size:24px}h2 small{display:block;font-family:inherit;font-size:10px;color:var(--gold);margin-top:5px;letter-spacing:.15em}.cards{display:grid;gap:14px}.card{background:linear-gradient(145deg,#1d1816,#121010);border:1px solid var(--line);border-radius:18px;padding:14px}.therapist img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:13px}.therapist h3{margin:12px 0 3px;font-size:20px}.muted{color:var(--muted);font-size:12px;line-height:1.8}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;padding:12px 8px;border-radius:12px;border:1px solid #806638;color:var(--gold2);font-size:12px;font-weight:900}.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#15100a;border:0}.info{display:grid;gap:0}.row{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #342822}.row b{font-size:11px;color:var(--gold)}.row span{font-size:13px;font-weight:700;line-height:1.6}.steps{display:grid;gap:12px}.step{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start}.num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold2);font-weight:900}.step b{display:block;margin:3px 0 5px}.notice{white-space:pre-wrap;color:#d5c9bc;line-height:1.9;font-size:13px}.staff{border-left:3px solid var(--gold);padding:4px 0 4px 16px;white-space:pre-wrap;line-height:2;color:#ddd;font-size:13px}.apply{display:block;margin-top:18px;text-align:center;text-decoration:none;color:#111;background:linear-gradient(135deg,var(--gold2),var(--gold));padding:15px;border-radius:999px;font-weight:900}.back{display:block;text-align:center;padding:25px;color:var(--gold);text-decoration:none;font-size:12px}.empty{text-align:center;color:var(--muted);padding:80px 20px}.footer{text-align:center;padding:20px 10px 40px;color:#70635a;font-size:9px}
</style></head><body><main class="app" id="app"><div class="empty">企画情報を読み込んでいます...</div></main>
<script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){let {data:x,error}=await sb.from('staff_invitation').select('*').eq('id',1).eq('is_public',true).maybeSingle();if(error||!x){app.innerHTML='<div class="empty">現在公開中のプレゼント企画はありません。</div><a class="back" href="../">← （株）末端興業へ戻る</a>';return}
let ts=[];try{ts=JSON.parse(x.therapists_json||'[]')}catch(e){};if(!ts.length&&x.therapist_name)ts=[{name:x.therapist_name,x_id:x.therapist_x_id,x_url:x.therapist_x_url}];
let cards=ts.map(t=>'<article class="card therapist">'+(t.image_url?'<img src="'+t.image_url+'" alt="'+esc(t.name)+'">':'')+'<h3>'+esc(t.name)+'</h3>'+(t.x_id?'<div class="muted">'+esc(t.x_id)+'</div>':'')+'<div class="buttons">'+(t.x_url?'<a class="btn" href="'+t.x_url+'" target="_blank" rel="noopener">Xを見る</a>':'')+(t.hp_url?'<a class="btn" href="'+t.hp_url+'" target="_blank" rel="noopener">セラピスト詳細</a>':'')+'</div></article>').join('');
let info=[['応募期間',x.entry_period],['招待内容',x.invitation_content],['当選人数',x.winners],['利用期間',x.use_period],['利用場所','日本橋 指定ホテル限定'],['ホテル代','別途3,500〜4,000円程度'],['当選発表','10/31 （株）末端興業HP']].filter(v=>v[1]).map(v=>'<div class="row"><b>'+esc(v[0])+'</b><span>'+esc(v[1]).replace(/\n/g,'<br>')+'</span></div>').join('');
let how=x.how_to_apply||'① （株）末端興業 Xアカウントをフォロー\n② 対象のプレゼント企画ポストをリポスト＋いいね\n③ 希望セラピストがいる場合はリプライ（任意）';
let steps=how.split('\n').filter(Boolean).map((s,i)=>'<div class="step"><div class="num">'+String(i+1).padStart(2,'0')+'</div><div><b>STEP '+String(i+1).padStart(2,'0')+'</b><div class="muted">'+esc(s.replace(/^[①②③④⑤⑥⑦⑧⑨⑩0-9\.\s]+/,''))+'</div></div></div>').join('');
let staff='久々のプレゼント企画なので、どれだけ反響があるか分かりませんw\n\nプレゼント企画に全く需要がなかったら、それはそれで良いのですが、想定以上に反響があれば、90分無料招待とは別で、何か考えます！';
app.innerHTML='<header class="hero"><div class="tag">PRESENT CAMPAIGN</div><h1>フリー90分<br>無料招待</h1><div class="lead">抽選で3名様</div><p class="muted">10月から特別指名料2,000円となる<br>対象セラピスト限定のプレゼント企画。</p>'+(x.image_url?'<img src="'+x.image_url+'" alt="プレゼント企画">':'')+'</header><section><h2>TARGET THERAPIST<small>対象セラピスト</small></h2><div class="cards">'+cards+'</div><p class="muted" style="margin-top:16px">気になるセラピストがいる場合は、Xの応募ポストへリプライでお知らせください。<br>※希望は参考とさせていただきます。フリーでのご案内となるため、セラピストの指名・確約はできません。</p></section><section><h2>CAMPAIGN INFO<small>企画概要</small></h2><div class="card info">'+info+'</div></section><section><h2>HOW TO ENTRY<small>応募方法</small></h2><div class="steps">'+steps+'</div>'+(x.post_url?'<a class="apply" href="'+x.post_url+'" target="_blank" rel="noopener">Xの応募ポストを開く →</a>':'')+'</section><section><h2>WINNER<small>当選発表</small></h2><div class="card"><b>10月31日 発表</b><p class="muted">当選結果は（株）末端興業HPにて発表します。</p></div></section><section><h2>NOTES<small>注意事項</small></h2><div class="notice">'+esc(x.notes||'フリー限定／セラピスト指名不可／希望セラピストは確約ではありません。\nホテル代別途／日本橋指定ホテル限定／利用期間11/01〜11/30').replace(/\n/g,'<br>')+'</div></section><section><h2>FROM STAFF<small>末端から一言</small></h2><div class="staff">'+esc(staff).replace(/\n/g,'<br>')+'</div></section><a class="back" href="../">← （株）末端興業へ戻る</a><div class="footer">© （株）末端興業 / L GROUP STAFF</div>';
}init();
</script></body></html>
