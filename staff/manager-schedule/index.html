  if(days.length>90||days.some(d=>d<today))throw Error("今日以降の日付を選択してください（最大90日）");
  const all=blockType==="all";
  const ranges=all?[{all_day:true,start_time:null,end_time:null}]:Array.from($("blockTimeRows").children).map(row=>{
   const [start,end]=row.querySelectorAll('select');
   return {all_day:false,start_time:start.value,end_time:end.value};
  });
  const validTime=x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x);
  if(!ranges.length||ranges.some(x=>!x.all_day&&(!validTime(x.start_time)||!validTime(x.end_time)||x.start_time<"10:00"||x.start_time>"23:30"||x.start_time>=x.end_time)))throw Error("開始時間と終了時間を確認してください");
  const sorted=ranges.filter(x=>!x.all_day).sort((a,b)=>a.start_time.localeCompare(b.start_time));
  if(sorted.some((x,i)=>i>0&&sorted[i-1].end_time>x.start_time))throw Error("時間帯が重複しています");
  btn.disabled=true;
  const {data:existing,error:readError}=await db.from("interview_staff_unavailability").select("block_date,all_day,start_time,end_time").eq("interviewer_user_id",state.me).gte("block_date",days[0]).lte("block_date",days[days.length-1]);
  if(readError)throw readError;
  const proposed=[];
  const batchId=crypto.randomUUID();
  for(const day of days)for(const slot of ranges){
   if((existing||[]).some(x=>x.block_date===day&&(slot.all_day||x.all_day||(
    String(x.start_time||"").slice(0,5)<slot.end_time&&String(x.end_time||"").slice(0,5)>slot.start_time
   ))))throw Error(day+" は既存の対応不可と時間帯が重複しています");
   proposed.push({interviewer_user_id:state.me,block_date:day,registration_batch_id:batchId,registration_mode:blockMode,...slot});
  }
  if(!confirm(days.length+"日・"+proposed.length+"件の対応不可を保存しますか？"))return;
  const {error:writeError}=await db.from("interview_staff_unavailability").insert(proposed);
  if(writeError)throw writeError;
  selectedMultiple.clear();await load();say(proposed.length+"件の対応不可を保存しました");
 }catch(err){errorEl.textContent=err.message||String(err)}
 finally{btn.disabled=false}
};
$("moveForm").onsubmit=async e=>{e.preventDefault();if(!moving)return;let date=$("moveDate").value,time=$("moveTime").value;if(date<jst()||time<"10:00"||time>"23:30"||!["00","30"].includes(time.slice(3,5))){$("moveError").textContent="日時を確認してください";return}let btn=$("moveSave");btn.disabled=true;const {error}=await db.rpc("manager_schedule_reschedule",{p_id:moving.id,p_date:date,p_time:time});btn.disabled=false;if(error){$("moveError").textContent=error.message;return}$("moveDialog").close();moving=null;selected=date;month=date.slice(0,7);agendaPage=0;await load()};
authorized().then(ok=>{if(ok)load()});
setInterval(()=>{if(!document.hidden&&!busy)load()},90000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!busy)load()});
})();
</script></body></html>
