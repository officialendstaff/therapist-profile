:root{font:14px system-ui,"Noto Sans JP",sans-serif;color:#24374b;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}a{text-decoration:none;color:inherit}[hidden]{display:none!important}header{background:#192b42;color:white;padding:15px max(20px,calc((100vw - 1450px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:18px}header a{border:1px solid #8999ab;border-radius:7px;padding:9px 13px;font-size:12px}main{max-width:1450px;margin:auto;padding:22px}h1{font-size:24px;margin:0 0 4px}p{color:#728198;font-size:12px;margin:0;line-height:1.6}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 20px}.controls{display:flex;gap:6px;align-items:center}.btn{border:1px solid #cbd7e4;border-radius:8px;background:white;color:#294b6c;padding:9px 12px;font-size:12px;font-weight:700}.btn.primary{background:#234f7f;color:white;border-color:#234f7f}.grid{display:grid;grid-template-columns:285px 1fr;gap:15px;align-items:start}.box{background:white;border:1px solid #dce4ee;border-radius:12px;box-shadow:0 2px 9px #19314b0b}.box h2{font-size:15px;margin:0}.box-title{padding:17px;border-bottom:1px solid #e9edf2}.month-controls{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:800}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 13px}.week{font-size:10px;color:#77899c;text-align:center;padding-bottom:7px}.calendar{padding-bottom:15px}.day{border:1px solid transparent;border-radius:6px;background:#f4f7fb;font-size:11px;padding:8px 2px;min-height:40px}.day.active{background:#234f7f;color:white}.day.today{border-color:#d4a449}.day small{display:block;color:#a96f38;font-size:8px}.day.active small{color:#fff}.stats{margin:14px;padding:14px;background:#f3f7fb;border-radius:9px;font-size:12px;line-height:1.9}.stats strong{font-size:22px}.boardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:17px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 15px 16px}.person{border:1px solid #dbe4ed;border-radius:10px;min-width:0;overflow:hidden;background:#fbfcfe}.person.mine{border:2px solid #7da4cd}.personhead{padding:13px;border-bottom:1px solid #e1e8f0;display:flex;align-items:center;justify-content:space-between}.personhead b{font-size:15px}.personhead small{color:#71849b;font-size:10px}.items{padding:12px}.subtitle{font-size:11px;font-weight:800;color:#77879a;margin:6px 0}.event{border:1px solid #dbe4ec;border-left:4px solid #4c7cab;background:white;border-radius:8px;padding:9px;margin-bottom:8px}.event.block{border-left-color:#c6815c;background:#fff9f5}.event.done{opacity:.65}.evhead{display:flex;align-items:center;justify-content:space-between;gap:4px}.evtime{font-size:13px;font-weight:800}.meta{font-size:11px;line-height:1.6;color:#64768c;margin-top:5px}.mini{border:1px solid #cbd8e7;background:#f2f7fc;color:#2e5f8a;font-size:10px;border-radius:6px;padding:5px 7px;font-weight:700}.muted{font-size:11px;color:#9caab9;padding:10px 0}.actions{padding:0 15px 16px}.alert{min-height:20px;color:#b03d45;font-size:12px;margin:0 0 10px}.note{border-top:1px solid #edf0f4;padding:13px 17px;color:#8290a0;font-size:11px}dialog{border:0;border-radius:13px;padding:0;width:min(460px,calc(100vw - 32px));box-shadow:0 20px 65px #10253c55}dialog::backdrop{background:#0c1d307f}.dialogtitle{background:#1b3655;color:white;padding:17px;font-weight:800}.dialogbody{padding:20px}.dialogbody label{display:block;font-size:12px;font-weight:750;margin-bottom:12px}.dialogbody input{display:block;margin-top:6px;width:100%;padding:9px;border:1px solid #cbd6e3;border-radius:7px}.dialogbottom{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.loading{padding:50px 10px;text-align:center;color:#8b99a8}
@media(max-width:1150px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:730px){main{padding:13px}.grid{grid-template-columns:1fr}.board{grid-template-columns:1fr}.person{min-height:0}}

/* 2026-11-19: readable, full-width management layout */
:root{font-size:16px;color:#152b44;background:#f3f5f8}
header{padding:17px 28px}header strong{font-size:19px}header a{font-size:13px;padding:10px 15px}
main{max-width:1720px;width:100%;padding:25px 30px 48px}
h1{font-size:28px;line-height:1.3}p{font-size:14px;color:#667c94}
.head{margin-bottom:18px}.btn{font-size:14px;padding:10px 15px;min-height:42px}
.grid{grid-template-columns:minmax(260px,300px) minmax(0,1fr);gap:18px}
.box{border:1px solid #cfdae6;box-shadow:0 2px 12px #132f4a0a}
.box-title{padding:15px 17px}.box h2{font-size:18px}
.month-controls{padding:14px 13px;font-size:16px}
.week,.calendar{gap:5px;padding-left:12px;padding-right:12px}
.week{font-size:12px;font-weight:700}

.stats{font-size:15px;line-height:2}.stats strong{font-size:25px}
.boardhead{padding:18px 20px;border-bottom:1px solid #e5ebf2}
.boardhead h2{font-size:23px!important}.boardhead p{font-size:13px;margin-top:6px}
.board{gap:14px;padding:18px;grid-template-columns:repeat(4,minmax(0,1fr))}
.person{background:#fff;border:1.5px solid #d3dfeb;border-radius:11px}
.person.mine{border:2px solid #467fb5;box-shadow:0 0 0 2px #ebf3fa}
.personhead{padding:16px 13px;min-height:64px;background:#eff4f8}
.person.mine .personhead{background:#e4f0fa}
.personhead b{font-size:20px;color:#18364f;letter-spacing:.02em}
.personhead small{font-size:12px;color:#5b7793;font-weight:700;white-space:nowrap}
.items{padding:14px;min-height:170px}
.subtitle{font-size:13px;color:#4c647e;margin:8px 0 11px;padding-bottom:7px;border-bottom:1px solid #edf1f6}

.event.block{border-color:#f0d7cd;border-left-color:#cc794e;background:#fff3ed}
.event.done{opacity:.7}
.evtime{font-size:17px;line-height:1.4;letter-spacing:.01em;color:#143e65}
.event.block .evtime{color:#924b2c}
.meta{font-size:13px;color:#4d637c;line-height:1.65;margin-top:7px}
.mini{font-size:12px;padding:7px 10px;white-space:nowrap}
.muted{font-size:13px;color:#9aa7b5;padding:11px 0}
.actions{padding:4px 18px 18px}.actions .btn{font-size:15px}
.note{padding:15px 19px;font-size:12px}
.alert{font-size:14px}
dialog .dialogtitle{font-size:19px}.dialogbody{font-size:16px}.dialogbody label{font-size:15px}.dialogbody input{font-size:16px}
@media(max-width:1300px){main{padding:22px 18px}.grid{grid-template-columns:250px minmax(0,1fr);gap:12px}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){header{padding:15px}.head{gap:12px}main{padding:15px 12px}.grid{grid-template-columns:1fr}.board{grid-template-columns:1fr;gap:12px;padding:12px}.personhead b{font-size:18px}.week,.calendar{max-width:420px;margin:auto}.boardhead{padding:15px}.boardhead h2{font-size:19px!important}.personhead{min-height:0}.items{min-height:0}}

/* Personal-only layout: single-owner agenda, no cross-manager comparison */
.board{display:block;padding:18px}
.person,.person.mine{width:100%;max-width:none;display:block;border:1px solid #cbdcec;box-shadow:none;background:#fff}
.personhead{padding:15px 19px;background:#eaf3fc}
.personhead b{font-size:20px}
.personhead small{font-size:12px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;align-items:start;min-height:0}
.items>.subtitle{grid-column:1/-1}
.event{min-height:0}
@media(max-width:760px){.items{display:block}.board{padding:12px}}

/* Shared management header height */
header{height:72px;min-height:72px;padding-top:0;padding-bottom:0}
</style></head><body><header><strong>L GROUP｜マイページ</strong><a href="../management-top/">総合管理TOPに戻る</a></header><main><div class="alert" id="alert"></div><div class="grid"><aside><div class="box"><div class="box-title"><h2>日付を選択</h2></div><div class="month-controls"><button class="btn" id="prevMonth">‹</button><b id="monthTitle"></b><button class="btn" id="nextMonth">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar" id="calendar"></div></div><div class="box" style="margin-top:13px"><div class="box-title"><h2>選択日の予定</h2></div><div class="stats">面接予定：<strong id="interviewCount">—</strong> 件<br>対応不可：<strong id="blockCount">—</strong> 件</div><p style="padding:0 15px 15px">面接予定は青、対応不可はオレンジで表示しています。</p></div></aside><div class="box"><div class="boardhead"><div><h2 id="dateTitle">予定を取得中</h2><p>面接日時の変更・対応不可の登録と解除ができます</p></div><div class="controls"><button class="btn" id="prevDay">‹ 前日</button><button class="btn" id="nextDay">翌日 ›</button></div></div><div class="board" id="board"><div class="loading">読み込み中…</div></div><div class="actions" id="ownActions" hidden><button class="btn primary" id="addBlock">＋ 自分の対応不可を登録</button></div><div class="note">面接日時の変更は通常の面接管理にも反映されます。</div></div></div></main>
<dialog id="blockDialog"><div class="dialogtitle">対応不可を登録</div><form id="blockForm" class="dialogbody"><label>日付<input id="blockDate" type="date" required></label><label><input id="allDay" type="checkbox" checked style="width:auto;display:inline;margin:0 6px 0 0">終日</label><div id="timeFields" hidden><label>開始<input type="time" id="blockStart" value="19:00"></label><label>終了<input type="time" id="blockEnd" value="23:59"></label></div><div id="blockError" class="alert"></div><div class="dialogbottom"><button class="btn" type="button" data-close="blockDialog">閉じる</button><button class="btn primary" type="submit" id="blockSave">登録</button></div></form></dialog>
<dialog id="moveDialog"><div class="dialogtitle">自分の面接予定を変更</div><form id="moveForm" class="dialogbody"><p id="moveLabel" style="margin-bottom:14px"></p><label>日付<input type="date" id="moveDate" required></label><label>時刻（30分単位）<input type="time" id="moveTime" min="10:00" max="23:30" step="1800" required></label><div id="moveError" class="alert"></div><div class="dialogbottom"><button class="btn" type="button" data-close="moveDialog">閉じる</button><button class="btn primary" type="submit" id="moveSave">保存</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),db=window.supabase?.createClient("https://vjjnkflbfsjihwzjsjpr.supabase.co","sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos",{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:"mattan-recruit-auth"}});
const pad=n=>String(n).padStart(2,"0"),jst=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()),dObj=s=>new Date(s+"T12:00:00+09:00"),dFmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),step=(d,n)=>{const x=dObj(d);x.setDate(x.getDate()+n);return dFmt(x)},esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selected=jst(),month=selected.slice(0,7),state={me:null,managers:[],interviews:[],blocks:[]},moving=null,busy=false;
const say=t=>$("alert").textContent=t||"",active=x=>["面接予定","日程変更"].includes(x.status);
function filter(date,uid,kind){return (kind==="block"?state.blocks:state.interviews).filter(x=>x.date===date&&x.uid===uid)}
function bounds(){const [y,m]=month.split("-").map(Number);return [month+"-01",dFmt(new Date(y,m,0))]}
async function authorized(){if(!db){say("認証ライブラリを読み込めません");return false}const {data:{session}}=await db.auth.getSession();if(!session){location.replace("../management-top/");return false}const {data,error}=await db.rpc("interview_my_profile");const p=Array.isArray(data)?data[0]:data;if(error||!["owner","president","ota","festival","nishii"].includes(p?.profile_key)){say("本人専用のマイページです。利用権限を確認できません。");$("board").innerHTML='<div class="loading">アクセス権限がありません</div>';return false}return true}
async function load(){if(busy)return;busy=true;say("");$("board").innerHTML='<div class="loading">予定を読み込んでいます…</div>';try{const [p_from,p_to]=bounds();const {data,error}=await db.rpc("manager_schedule_overview",{p_from,p_to});if(error)throw error;state=data; $("ownActions").hidden=!state.managers.some(m=>m.id===state.me);render()}catch(e){say("取得エラー："+e.message);$("board").innerHTML='<div class="loading">取得に失敗しました</div>'}finally{busy=false;}}
function render(){let [year,mon]=month.split("-").map(Number),last=new Date(year,mon,0).getDate(),offset=new Date(year,mon-1,1).getDay();$("monthTitle").textContent=year+"年"+mon+"月";let cal="";for(let x=0;x<offset;x++)cal+="<span></span>";for(let d=1;d<=last;d++){let date=month+"-"+pad(d),count=state.interviews.filter(x=>x.date===date&&active(x)).length+state.blocks.filter(x=>x.date===date).length;cal+='<button class="day '+(date===selected?"active ":"")+(date===jst()?"today":"")+'" data-date="'+date+'">'+d+(count?'<small>● '+count+'</small>':"")+"</button>"}$("calendar").innerHTML=cal;$("dateTitle").textContent=selected.replaceAll("-","/")+"（"+"日月火水木金土"[dObj(selected).getDay()]+"）";$("interviewCount").textContent=state.interviews.filter(x=>x.date===selected&&active(x)).length;$("blockCount").textContent=state.blocks.filter(x=>x.date===selected).length;
$("board").innerHTML=state.managers.map(m=>{let mine=m.id===state.me,iv=filter(selected,m.id,"interview").sort((a,b)=>a.time.localeCompare(b.time)),bl=filter(selected,m.id,"block"),future=iv.filter(active),past=iv.filter(x=>!active(x));const event=i=>'<div class="event '+(!active(i)?"done":"")+'"><div class="evhead"><span class="evtime">'+esc(i.time)+'</span>'+(mine&&active(i)?'<button class="mini" data-move="'+i.id+'">変更</button>':"")+'</div><div class="meta">'+esc(i.shop)+'<br>'+esc(i.status)+'</div></div>';return '<div class="person '+(mine?"mine":"")+'"><div class="personhead"><b>'+esc(m.name)+'</b><small>'+(mine?"本人・編集可":"閲覧専用")+'</small></div><div class="items"><div class="subtitle">面接予定　'+future.length+'件</div>'+(future.map(event).join("")||'<div class="muted">予定なし</div>')+(past.length?'<div class="subtitle">その他</div>'+past.map(event).join(""):"")+'<div class="subtitle">対応不可　'+bl.length+'件</div>'+(bl.map(b=>'<div class="event block"><div class="evhead"><span class="evtime">'+(b.all_day?"終日":esc(b.start)+"〜"+esc(b.end))+'</span>'+(mine?'<button class="mini" data-delete="'+b.id+'">解除</button>':"")+'</div></div>').join("")||'<div class="muted">設定なし</div>')+'</div></div>'}).join("")}
$("calendar").onclick=e=>{let b=e.target.closest("[data-date]");if(b){selected=b.dataset.date;render()}};$("board").onclick=async e=>{const mv=e.target.closest("[data-move]"),del=e.target.closest("[data-delete]");if(mv){moving=state.interviews.find(i=>i.id===Number(mv.dataset.move)&&i.uid===state.me);if(!moving)return;$("moveLabel").textContent=moving.shop+"｜"+moving.date+" "+moving.time;$("moveDate").value=moving.date;$("moveDate").min=jst();$("moveTime").value=moving.time;$("moveError").textContent="";$("moveDialog").showModal()}else if(del){const b=state.blocks.find(x=>x.id===Number(del.dataset.delete)&&x.uid===state.me);if(!b||!confirm("自分の対応不可を解除しますか？"))return;const {error}=await db.from("interview_staff_unavailability").delete().eq("id",b.id).eq("interviewer_user_id",state.me);if(error)say("解除できません："+error.message);else await load()}};
$("prevDay").onclick=()=>setDate(step(selected,-1));$("nextDay").onclick=()=>setDate(step(selected,1));
async function setDate(d){selected=d;if(month!==d.slice(0,7)){month=d.slice(0,7);await load()}else render()}
async function setMonth(n){let [y,m]=month.split("-").map(Number),date=new Date(y,m-1+n,1);month=dFmt(date).slice(0,7);selected=month+"-01";await load()}
$("prevMonth").onclick=()=>setMonth(-1);$("nextMonth").onclick=()=>setMonth(1);
$("addBlock").onclick=()=>{$("blockDate").value=selected;$("blockDate").min=jst();$("blockError").textContent="";$("blockDialog").showModal()};
$("allDay").onchange=()=>{$("timeFields").hidden=$("allDay").checked};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$("blockForm").onsubmit=async e=>{e.preventDefault();let day=$("blockDate").value,all=$("allDay").checked,start=all?null:$("blockStart").value,end=all?null:$("blockEnd").value;if(day<jst()||!all&&(!start||!end||start>=end)){$("blockError").textContent="日時を確認してください";return}let btn=$("blockSave");btn.disabled=true;const {error}=await db.from("interview_staff_unavailability").insert({interviewer_user_id:state.me,block_date:day,all_day:all,start_time:start,end_time:end});btn.disabled=false;if(error){$("blockError").textContent=error.message;return}$("blockDialog").close();await setDate(day);await load()};
$("moveForm").onsubmit=async e=>{e.preventDefault();if(!moving)return;let date=$("moveDate").value,time=$("moveTime").value;if(date<jst()||time<"10:00"||time>"23:30"||!["00","30"].includes(time.slice(3,5))){$("moveError").textContent="日時を確認してください";return}let btn=$("moveSave");btn.disabled=true;const {error}=await db.rpc("manager_schedule_reschedule",{p_id:moving.id,p_date:date,p_time:time});btn.disabled=false;if(error){$("moveError").textContent=error.message;return}$("moveDialog").close();moving=null;await setDate(date);await load()};
authorized().then(ok=>{if(ok)load()});
})();
</script></body></html>
