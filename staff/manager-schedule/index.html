 $("upcoming").innerHTML=out||'<div class="agenda-empty">今日以降の面接予定はありません</div>';
 const futureBlocks=state.blocks.filter(x=>x.uid===mine&&x.date>=now).sort((a,b)=>a.date.localeCompare(b.date)||String(a.start||"").localeCompare(String(b.start||"")));
 $("futureBlockCount").textContent=futureBlocks.length+"件";
 $("futureBlocks").innerHTML=futureBlocks.map(b=>'<div class="block-entry"><div><b>'+displayDate(b.date)+'</b><small>'+(b.all_day?"終日":esc(b.start)+"〜"+esc(b.end))+'</small></div><button class="mini" data-delete="'+b.id+'">解除</button></div>').join("")||'<div class="muted">登録なし</div>';
}
$("calendar").onclick=e=>{let b=e.target.closest("[data-date]");if(b){selected=b.dataset.date;render()}};$("upcoming").onclick=handleEventClick;$("futureBlocks").onclick=handleEventClick;async function handleEventClick(e){const mv=e.target.closest("[data-move]"),del=e.target.closest("[data-delete]");if(mv){moving=state.interviews.find(i=>i.id===Number(mv.dataset.move)&&i.uid===state.me);if(!moving)return;$("moveLabel").textContent=moving.shop+"｜"+moving.date+" "+moving.time;$("moveDate").value=moving.date;$("moveDate").min=jst();$("moveTime").value=moving.time;$("moveError").textContent="";$("moveDialog").showModal()}else if(del){const b=state.blocks.find(x=>x.id===Number(del.dataset.delete)&&x.uid===state.me);if(!b||!confirm("自分の対応不可を解除しますか？"))return;const {error}=await db.from("interview_staff_unavailability").delete().eq("id",b.id).eq("interviewer_user_id",state.me);if(error)say("解除できません："+error.message);else await load()}}
$("today").onclick=()=>setDate(jst());$("reload").onclick=load;

async function setDate(d){selected=d;if(month!==d.slice(0,7)){month=d.slice(0,7);await load()}else render()}
async function setMonth(n){let [y,m]=month.split("-").map(Number),date=new Date(y,m-1+n,1);month=dFmt(date).slice(0,7);selected=month+"-01";await load()}
$("prevMonth").onclick=()=>setMonth(-1);$("nextMonth").onclick=()=>setMonth(1);
$("addBlock").onclick=()=>{$("blockDate").value=selected;$("blockDate").min=jst();$("blockError").textContent="";$("blockDialog").showModal()};
$("allDay").onchange=()=>{$("timeFields").hidden=$("allDay").checked};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$("blockForm").onsubmit=async e=>{e.preventDefault();let day=$("blockDate").value,all=$("allDay").checked,start=all?null:$("blockStart").value,end=all?null:$("blockEnd").value;if(day<jst()||!all&&(!start||!end||start>=end)){$("blockError").textContent="日時を確認してください";return}let btn=$("blockSave");btn.disabled=true;const {error}=await db.from("interview_staff_unavailability").insert({interviewer_user_id:state.me,block_date:day,all_day:all,start_time:start,end_time:end});btn.disabled=false;if(error){$("blockError").textContent=error.message;return}$("blockDialog").close();await setDate(day);await load()};
$("moveForm").onsubmit=async e=>{e.preventDefault();if(!moving)return;let date=$("moveDate").value,time=$("moveTime").value;if(date<jst()||time<"10:00"||time>"23:30"||!["00","30"].includes(time.slice(3,5))){$("moveError").textContent="日時を確認してください";return}let btn=$("moveSave");btn.disabled=true;const {error}=await db.rpc("manager_schedule_reschedule",{p_id:moving.id,p_date:date,p_time:time});btn.disabled=false;if(error){$("moveError").textContent=error.message;return}$("moveDialog").close();moving=null;await setDate(date);await load()};
authorized().then(ok=>{if(ok)load()});
})();
