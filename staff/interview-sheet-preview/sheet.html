<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Sheet 試作</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font:13px/1.5 system-ui,"Noto Sans JP",sans-serif;color:#26384d;background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #c9d9eb;background:#fff;color:#295b8f;border-radius:5px;padding:7px 10px}button.active,.primary{background:#3278c9;color:#fff;border-color:#3278c9}button:disabled{opacity:.45;cursor:default}.layout{height:100%;display:flex;gap:10px;padding:10px;overflow:hidden}.left,.right{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid #d8e4f0;border-radius:7px;background:#fff;overflow:hidden}.left{flex:7}.right{flex:3;background:#f8fbff}.layout.detail .left{flex:8}.layout.detail .right{flex:2}.layout.wide .left{flex:1}.layout.wide .right{display:none}.head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:7px;padding:10px 12px;background:#edf4fc;border-bottom:1px solid #d8e4f0}.head strong{font-size:14px}.body{flex:1;overflow:auto;min-height:0;padding:10px}.muted{color:#73849a;font-size:11px}.card{display:flex;align-items:center;gap:10px;border:1px solid #dce5f0;border-radius:6px;padding:11px;margin-bottom:8px;background:#fff;cursor:pointer}.card:hover,.card.selected{border-color:#3d85d0;background:#f0f7ff}.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:#e4edf6;display:grid;place-items:center;color:#67819c;font-size:11px}.card-main{flex:1;min-width:0}.card-main strong{display:block}.pill{font-size:10px;border-radius:4px;padding:2px 6px;background:#fbe7ef;color:#9b4a6d;display:inline-block}.pill.blue{background:#e6f0fb;color:#396da4}.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:6px 3px;font-size:11px}.section{border:1px solid #dbe5f0;border-radius:6px;margin-bottom:9px;overflow:hidden}.section h3{font-size:12px;background:#f0f5fb;padding:8px 10px;margin:0}.section-inner{padding:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{padding:5px 0;border-bottom:1px solid #e8eef6}.field label{display:block;font-size:10px;color:#71849a}.field span{font-weight:600}.control{display:grid;gap:3px;margin-bottom:8px}.control label{font-size:11px;color:#60758d}.control input,.control select,.control textarea{width:100%;border:1px solid #cbd8e8;border-radius:5px;padding:8px;background:#fff}.control textarea{min-height:65px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{flex:1}.footer{flex:none;padding:9px 10px;border-top:1px solid #d8e4f0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:7px}.note{padding:8px 10px;background:#fff5e6;color:#8a6229;font-size:11px;border-bottom:1px solid #f1dcbf}.hidden{display:none!important}.right .card{padding:8px;gap:7px}.right .avatar{width:30px;height:30px}.right .card-main strong{font-size:12px}.right .card-main .muted{font-size:10px}.right .head{flex-wrap:wrap}.link-state{font-size:11px;color:#1a815d}.error{color:#b34e4e}@media(max-width:650px){.layout{padding:5px;gap:5px}.left{flex:7!important}.right{flex:3!important}.layout.wide .right{display:none}.layout.wide .left{flex:1!important}.head{padding:7px}.head strong{font-size:12px}.body{padding:6px}.right .avatar{display:none}.right .card{padding:5px}.fields{grid-template-columns:1fr}.right .tabs{display:block}.right .tabs button{width:100%;margin-bottom:3px}.right .card-main .muted{font-size:9px}} .sheet-list-card{display:grid;grid-template-columns:42px minmax(0,1fr) 135px 18px;align-items:center;gap:12px;min-height:72px;padding:9px 12px;border:1px solid #dfe2e8;border-radius:8px;background:#fff;margin-bottom:7px;cursor:pointer}.sheet-list-card:hover,.sheet-list-card:focus-visible{background:#f0f7ff;border-color:#3d85d0;outline:none}.sheet-list-card .avatar{width:42px;height:42px;font-size:10px}.sheet-list-card .applicant-name{font-weight:700;font-size:14px}.sheet-list-card .shop-label{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:4px;background:#f9e5ed;color:#a34870;font-size:11px}.sheet-list-card .shop-label.grand{background:#e9e4f3;color:#674c92}.sheet-list-card .shop-label.luxy{background:#e4effb;color:#32679e}.sheet-list-card .date-label{padding:6px 8px;background:#e8f2fc;border:1px solid #bad4f0;border-radius:5px;text-align:center;color:#32679e;font-weight:600;font-size:12px}.sheet-list-card .sub{font-size:11px;color:#75849a;margin-top:3px}@media(max-width:650px){.sheet-list-card{grid-template-columns:32px minmax(0,1fr);gap:7px;min-height:65px;padding:7px}.sheet-list-card .avatar{width:32px;height:32px}.sheet-list-card .date-label{grid-column:2;text-align:left}.sheet-list-card .arrow{display:none}} .sheet-list-card{grid-template-columns:135px minmax(0,1fr) 90px 14px;min-height:64px}.link-badge{font-size:11px;color:#98631a;background:#fff2dc;border-radius:4px;padding:5px;text-align:center}.sheet-list-card .date-label{font-size:12px}.sheet-list-card .date-label .sub{color:#5d7590}@media(max-width:650px){.sheet-list-card{grid-template-columns:1fr auto;gap:5px}.sheet-list-card .date-label{grid-column:1/3}.sheet-list-card .arrow{display:none}} .sheet-list-card{grid-template-columns:46px minmax(0,1fr) 145px 85px;min-height:72px;padding:7px 12px;gap:12px}.sheet-list-card .avatar{width:42px;height:42px;background:#e9edf2}.sheet-list-card .date-label{grid-column:auto}.sheet-list-card .link-badge{white-space:nowrap}@media(max-width:650px){.sheet-list-card{grid-template-columns:32px minmax(0,1fr);gap:6px}.sheet-list-card .avatar{width:32px;height:32px}.sheet-list-card .date-label{grid-column:2}.sheet-list-card .link-badge{grid-column:2;justify-self:start}} .sheet-list-card{grid-template-columns:42px minmax(0,1fr) 120px 82px 56px;min-height:72px}.sheet-list-card .avatar{width:42px;height:42px;font-weight:700}.sheet-list-card .link-badge{font-size:11px;background:#fff0d8;color:#92651e;opacity:1}.sheet-list-card .link-badge.linked{background:#e4f5eb;color:#21764c}.sheet-list-card .unlink-button{padding:6px 7px;font-size:11px}.help-flag{border:1px solid #d64b54;color:#c63340;background:#fff0f1;border-radius:3px;font-size:10px;margin-top:3px;font-weight:700}.sheet-list-card .date-label{grid-column:auto}.sheet-list-card .applicant-name{min-width:0}@media(max-width:650px){.sheet-list-card{grid-template-columns:32px minmax(0,1fr) 65px;gap:5px}.sheet-list-card .date-label{grid-column:2}.sheet-list-card .link-badge{grid-column:2}.sheet-list-card .unlink-button{grid-column:3}} .right .head{flex-wrap:nowrap;gap:7px}.right .head strong{white-space:nowrap;font-size:12px}.right .head .tabs{flex:1;min-width:0;display:flex;gap:4px}.right .head .tabs button{font-size:10px;padding:5px 3px;white-space:nowrap}.right .body{padding-top:9px}@media(max-width:650px){.right .head{flex-wrap:wrap}.right .head .tabs{display:flex;width:100%}.right .head .tabs button{width:auto;margin:0}}.sheet-list-card{grid-template-columns:64px minmax(0,1fr) 120px 82px 56px;min-height:82px}.sheet-list-card .avatar{width:64px;height:64px;min-width:64px;min-height:64px;border-radius:50%;font-size:12px;flex:none}@media(max-width:650px){.sheet-list-card{grid-template-columns:42px minmax(0,1fr)}.sheet-list-card .avatar{width:42px;height:42px;min-width:42px;min-height:42px}} </style></head><body><div class="layout" id="layout"><section class="left"><div class="head"><strong id="leftTitle">Interview Sheet｜シート一覧 <span class="muted">3件（試作）</span></strong><div class="actions"><button id="back" class="hidden">← 一覧に戻る</button><button id="wide" class="hidden">右側を閉じる</button></div></div><div class="body" id="list"><div class="sheet-list-card" role="button" tabindex="0" data-sheet="0"><div class="avatar">未</div><div class="applicant-name">山田 花子</div><div class="date-label">10/28 14:32<div class="sub">送信日時</div></div><button class="link-badge" type="button" disabled id="status-0">紐付け未</button><button type="button" class="unlink-button" data-unlink="0" disabled>解除</button></div><div class="sheet-list-card" role="button" tabindex="0" data-sheet="1"><div class="avatar">未</div><div class="applicant-name">佐藤 美咲</div><div class="date-label">10/28 13:05<div class="help-flag">HELP</div></div><button class="link-badge" type="button" disabled id="status-1">紐付け未</button><button type="button" class="unlink-button" data-unlink="1" disabled>解除</button></div><div class="sheet-list-card" role="button" tabindex="0" data-sheet="2"><div class="avatar">未</div><div class="applicant-name">田中 玲奈</div><div class="date-label">10/27 18:42<div class="sub">送信日時</div></div><button class="link-badge" type="button" disabled id="status-2">紐付け未</button><button type="button" class="unlink-button" data-unlink="2" disabled>解除</button></div></div><div class="body hidden" id="detail"><div class="section"><h3>① 応募者情報 <button id="edit" style="float:right;padding:1px 8px">編集</button></h3><div class="section-inner"><div class="fields"><div class="field"><label>氏名</label><span id="applicantName">応募者A</span></div><div class="field"><label>フリガナ</label><span id="applicantShop">ヤマダ ハナコ</span></div><div class="field"><label>生年月日</label><span>1994/05/08</span></div><div class="field"><label>電話番号</label><span>090-XXXX-XXXX</span></div><div class="field"><label>応募媒体</label><span>バニラ</span></div><div class="field"><label>身分証</label><span>運転免許証</span></div></div></div></div><div class="section"><h3>② 面接予定との紐付け</h3><div class="section-inner"><div class="field"><label>選択した面接予定・LINE応募者</label><span id="selectedInterview">未選択</span></div><p class="muted">右側のカードを選択し、内容を確認して確定してください。</p><button class="primary" id="link" disabled>紐付けを確定（試作）</button><div id="linkedMessage" class="link-state"></div></div></div><div class="section"><h3>③ 採否判定</h3><div class="section-inner"><div class="actions" id="results"><button>採用</button><button>不採用</button><button>辞退</button></div><div class="control" style="margin-top:9px"><label>面接メモ</label><textarea placeholder="面接内容を入力"></textarea></div></div></div><div class="section"><h3>④ 入店情報</h3><div class="section-inner"><div class="fields"><div class="control"><label>源氏名</label><input placeholder="採用後に入力"></div><div class="control"><label>国籍</label><select><option>日本</option><option>その他</option></select></div></div><button disabled>従業者名簿PDF（試作では無効）</button></div></div></div><div class="footer"><span class="muted" id="saveStatus">プレビュー専用</span><button id="save">変更を保存（試作）</button></div></section><aside class="right"><div class="head"><strong>対象を選択</strong><div class="tabs"><button id="todayTab" class="active">今日の予定</button><button id="lineTab">LINE通知</button></div></div><div class="body"><div id="rightList"></div></div></aside></div><script>const sheets=[['山田 花子','ヤマダ ハナコ'],['佐藤 美咲','サトウ ミサキ'],['田中 玲奈','タナカ レナ']];const today=[['応募者A','薔薇と紳士','13:00'],['応募者D','Grand Luxe','15:30'],['応募者E','LUXY','18:00']];const lines=[['応募者A','薔薇と紳士','LINE受信'],['応募者F','Grand Luxe','LINE受信'],['応募者G','LUXY','LINE受信']];let selectedSheet=null,selectedTarget=null,source='today';const linkedSheets=new Set();const $=id=>document.getElementById(id);function drawRight(){const list=source==='today'?today:lines;$('rightList').innerHTML='';list.forEach((x,i)=>{const c=document.createElement('div');c.className='card'+(selectedTarget?.source===source&&selectedTarget.index===i?' selected':'');c.innerHTML='<div class="avatar">LINE</div><div class="card-main"><strong></strong><span class="pill"></span><div class="muted"></div></div>';c.querySelector('strong').textContent=x[0];c.querySelector('.pill').textContent=x[1];c.querySelector('.muted').textContent=x[2];c.onclick=()=>{selectedTarget={source,index:i};$('selectedInterview').textContent=x.join(' ／ ');$('link').disabled=selectedSheet===null;drawRight()};$('rightList').append(c)})}function updateSheetStatus(i){const linked=linkedSheets.has(i),badge=document.getElementById('status-'+i),unlink=document.querySelector('[data-unlink="'+i+'"]');badge.textContent=linked?'紐付け済':'紐付け未';badge.classList.toggle('linked',linked);unlink.disabled=!linked}function openSheet(i){selectedSheet=i;$('layout').classList.add('detail');$('list').classList.add('hidden');$('detail').classList.remove('hidden');$('back').classList.remove('hidden');$('wide').classList.remove('hidden');$('leftTitle').textContent='Interview Sheet｜'+sheets[i][0];$('applicantName').textContent=sheets[i][0];$('applicantShop').textContent=sheets[i][1];$('linkedMessage').textContent=linkedSheets.has(i)?'試作上で紐付け済みです。解除は一覧の「解除」から操作できます。':'';$('link').disabled=!selectedTarget}document.querySelectorAll('[data-sheet]').forEach(x=>{x.onclick=()=>openSheet(Number(x.dataset.sheet));x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();x.click()}}});$('back').onclick=()=>{selectedSheet=null;$('layout').classList.remove('detail','wide');$('list').classList.remove('hidden');$('detail').classList.add('hidden');$('back').classList.add('hidden');$('wide').classList.add('hidden');$('wide').textContent='右側を閉じる';$('leftTitle').innerHTML='Interview Sheet｜シート一覧 <span class="muted">3件（試作）</span>'};$('wide').onclick=()=>{const on=$('layout').classList.toggle('wide');$('wide').textContent=on?'右側を表示':'右側を閉じる'};$('todayTab').onclick=()=>{source='today';selectedTarget=null;$('todayTab').classList.add('active');$('lineTab').classList.remove('active');$('selectedInterview').textContent='未選択';$('link').disabled=true;drawRight()};$('lineTab').onclick=()=>{source='line';selectedTarget=null;$('lineTab').classList.add('active');$('todayTab').classList.remove('active');$('selectedInterview').textContent='未選択';$('link').disabled=true;drawRight()};$('link').onclick=()=>{if(selectedSheet===null||!selectedTarget)return;linkedSheets.add(selectedSheet);updateSheetStatus(selectedSheet);$('linkedMessage').textContent='試作上で紐付け済みに変更しました（実保存なし）'};document.querySelectorAll('#results button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#results button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('save').onclick=()=>$('saveStatus').textContent='試作上で保存済み（実保存なし）';$('edit').onclick=()=>$('saveStatus').textContent='編集機能は次の工程で調整';document.querySelectorAll('[data-unlink]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const i=Number(btn.dataset.unlink);if(!linkedSheets.has(i))return;if(!confirm('このシートの紐付けを解除しますか？（試作・実データは変更されません）'))return;linkedSheets.delete(i);updateSheetStatus(i);if(selectedSheet===i){selectedTarget=null;$('selectedInterview').textContent='未選択';$('link').disabled=true;$('linkedMessage').textContent='試作上で紐付けを解除しました'}drawRight()});drawRight();</script></body></html>
