.lg-interview-login .auth-form-panel{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:48px clamp(32px,4vw,55px);background:linear-gradient(160deg,#fff 0%,#fafcff 100%)}
.lg-interview-login .auth-eyebrow{display:block;margin:0 0 11px;color:#667d99;font-size:10px;font-weight:800;letter-spacing:.24em}

.lg-interview-login .auth-mode-label{display:grid;place-items:center;min-height:52px;padding:5px;margin-bottom:23px;background:#edf2f7;border:1px solid #e0e8f1;border-radius:11px}

.lg-interview-login form input{box-sizing:border-box!important;display:block!important;width:100%!important;height:47px!important;margin:9px 0 18px!important;padding:0 15px!important;border:1px solid #d8e1ed!important;border-radius:9px!important;background:#f8fafc!important;color:#1f334c!important;font-size:14px!important;outline:none!important;box-shadow:inset 0 1px 2px #18345606!important}
.lg-interview-login form input:focus{border-color:#5b82ad!important;background:#fff!important;box-shadow:0 0 0 3px #4a7bb226!important}
.lg-interview-login form button{box-sizing:border-box!important;display:block!important;width:100%!important;min-height:48px!important;margin:14px 0 0!important;padding:11px 16px!important;border:1px solid #264b73!important;border-radius:9px!important;color:#fff!important;background:linear-gradient(130deg,#315f90 0%,#1a395b 100%)!important;box-shadow:0 7px 16px #204a752e,inset 0 1px #ffffff38!important;font-size:13px!important;font-weight:750!important;cursor:pointer!important}
.lg-interview-login form button:hover{filter:brightness(1.12)}
.lg-interview-login .auth-footnote{display:block;margin:24px 0 0;color:#9ba8b8;font-size:10px;letter-spacing:.1em;text-align:center}
.lg-interview-login #loginError,.lg-interview-login #metricsLoginError{display:block;min-height:18px;margin:9px 0 0!important;color:#b43c42!important;font-size:11px!important;line-height:1.5}
@media(max-width:900px){.lg-interview-login:not(.hide):not(.hidden){padding:12px!important}.lg-interview-login .auth-card{display:block;width:min(380px,100%);max-width:calc(100vw - 24px);min-height:0;max-height:calc(100dvh - 24px);overflow-y:auto;border-radius:13px}.lg-interview-login .auth-brand-panel{display:none}.lg-interview-login .auth-form-panel{padding:28px 22px}.lg-interview-login .auth-form-panel h2{font-size:23px!important}.lg-interview-login form input{font-size:16px!important}}

/* Shared management header: same dimensions, navy and home avatar as interview management. */
header.lg-common-header{height:64px!important;min-height:64px!important;max-height:64px!important;width:100%!important;padding:0 18px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;flex-wrap:nowrap!important;gap:12px!important;background:#1e293b!important;border-bottom:1px solid #344155!important;color:#fff!important;box-sizing:border-box!important}
header.lg-common-header .lg-header-home{display:inline-flex!important;flex:0 0 auto;align-items:center!important;justify-content:flex-start!important;gap:9px!important;min-width:0!important;height:100%;padding:0!important;margin:0!important;border:0!important;background:transparent!important;color:#fff!important;text-decoration:none!important;white-space:nowrap!important;font-family:inherit!important;font-size:13px!important;font-weight:700!important;letter-spacing:.075em!important;line-height:1.5!important;cursor:pointer!important}

</style></head>
<body><div class="page"><header class="topbar lg-common-header"><a class="lg-header-home" href="/therapist-profile/staff/management-top/" title="総合管理TOPへ移動" aria-label="総合管理TOPへ移動"><img src="/therapist-profile/staff/interview-sheet-preview/icons/murakami-pc.webp" alt="" onerror="this.style.display='none'"><span id="lgHeaderHomeLabel">総合 TOP</span></a><div style="display:flex;align-items:center;gap:8px"><a class="back" href="./">面接管理へ戻る</a></div></header>
<section id="metricsLogin" class="lg-interview-login metrics-login hidden"><div class="auth-card"><aside class="auth-brand-panel" aria-hidden="true"><div class="auth-brand-top"><div class="auth-brand-symbol">L</div><div class="auth-brand-name">L GROUP<small>INTERNAL MANAGEMENT</small></div></div><div class="auth-brand-middle"><span class="auth-brand-kicker">STAFF MANAGEMENT SYSTEM</span><h1 class="auth-brand-title">ANALYTICS<br>MANAGEMENT.</h1><p class="auth-brand-description">日々の管理業務を、もっとスマートに。<br>すべての情報をひとつの場所で。</p></div><div class="auth-brand-bottom"><span>STAFF PORTAL</span><span>L GROUP © 2026</span></div></aside><div class="auth-form-panel"><p class="auth-eyebrow">WELCOME BACK</p><h2>数値管理ログイン</h2><div class="auth-mode-label"><span>管理者</span></div><form id="metricsLoginForm"><p class="auth-help">既存の管理者アカウントと同じID・PASSを使用します。</p><label for="metricsEmail">ID（メールアドレス）<input id="metricsEmail" type="email" autocomplete="username" required></label><label for="metricsPassword">PASS<input id="metricsPassword" type="password" autocomplete="current-password" required></label><div id="metricsLoginError" role="alert"></div><button type="submit">ログイン</button></form><p class="auth-footnote">AUTHORIZED PERSONNEL ONLY</p></div></div></section>
<iframe id="metricsFrame" class="frame hidden" title="数値管理ダッシュボード" allow="clipboard-write"></iframe></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const client=window.supabase?.createClient("https://vjjnkflbfsjihwzjsjpr.supabase.co","sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos",{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:"mattan-recruit-auth"}});
function showLogin(message=""){location.replace("/therapist-profile/staff/management-top/")}
async function staffMetricsView(){
 const token=sessionStorage.getItem("interview_staff_session_v2")||localStorage.getItem("interview_staff_session_v2");
 if(!token||!/^[0-9a-f]{64}$/.test(token))return false;
 try{
  const r=await fetch("https://vjjnkflbfsjihwzjsjpr.supabase.co/functions/v1/interview-staff-access",{
   method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({action:"verify",token})
  });
  if(!r.ok||!(await r.json()).ok)return false;
  sessionStorage.setItem("interview_staff_session_v2",token);
  const home=document.getElementById("lgHeaderHomeLabel");if(home)home.textContent="スタッフ TOP";
  $("metricsLogin").classList.add("hidden");
  $("metricsFrame").classList.remove("hidden");
  if(!$("metricsFrame").getAttribute("src"))$("metricsFrame").src="./?standaloneMetrics=1";
  return true;
 }catch{return false}
}

async function check(){
 if(!client){showLogin("認証処理を読み込めません。");return}
 const {data:{session}}=await client.auth.getSession();
 if(!session){if(await staffMetricsView())return;showLogin();return}
 const [profile,allowed]=await Promise.all([
  client.from("recruit_staff_profiles").select("display_name,role,approved_at").eq("user_id",session.user.id).maybeSingle(),
  client.rpc("can_link_therapist_interview")
 ]);
 if(profile.error||allowed.error||allowed.data!==true||!profile.data?.approved_at||!["master","full"].includes(profile.data.role)){
  if(await staffMetricsView())return;
  showLogin("このページへの権限がありません。");return
 }
 const homeName=document.getElementById("lgHeaderHomeLabel");if(homeName)homeName.textContent=(profile.data.display_name||"管理")+" TOP";
 $("metricsLogin").classList.add("hidden");
 $("metricsFrame").classList.remove("hidden");
 if(!$("metricsFrame").getAttribute("src"))$("metricsFrame").src="./?standaloneMetrics=1";
}
$("metricsLoginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!client)return;
 $("metricsLoginError").textContent="確認中…";
 const {error}=await client.auth.signInWithPassword({email:$("metricsEmail").value.trim(),password:$("metricsPassword").value});
 if(error){showLogin("ログインできません。入力内容をご確認ください。");return}
 await check();
});
check();
})();
</script></body></html>
