<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const standaloneView=new URLSearchParams(location.search).get("view")==="sales"?"sales":"interview";
document.title=(standaloneView==="sales"?"数値管理｜営業数値":"面接数値")+"｜L GROUP";
document.getElementById("metricsFrame").title=standaloneView==="sales"?"営業数値ダッシュボード":"面接数値ダッシュボード";
const client=window.supabase?.createClient("https://vjjnkflbfsjihwzjsjpr.supabase.co","sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos",{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:"mattan-recruit-auth"}});
function showLogin(message=""){location.replace("/therapist-profile/staff/management-top/")}
function showCommonAccountMenu(name,role){
 const menu=document.getElementById("lgAccountMenu");
 const label=document.getElementById("lgAccountIdentity");
 if(!menu||!label)return;
 label.textContent=(name||"管理者")+"｜"+role;
 menu.hidden=false;menu.open=false;
}
function bindCommonAccountMenu(onSignOut){
 const menu=document.getElementById("lgAccountMenu");
 if(!menu)return;
 document.getElementById("lgAccountLogout").addEventListener("click",()=>{
  menu.open=false;
  void onSignOut();
 });
 document.addEventListener("click",event=>{
  if(menu.open&&!menu.contains(event.target))menu.open=false;
 });
 document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&menu.open){menu.open=false;menu.querySelector("summary")?.focus();}
 });
}
async function syncInterviewHomeHeader(profileFallback){
 let name=profileFallback||"管理",profileKey="";
 try{
  const {data,error}=await client.rpc("interview_my_profile");
  if(!error){
   const p=Array.isArray(data)?data[0]:data;
   if(p&&["owner","president","ota","festival"].includes(p.profile_key)){
    profileKey=p.profile_key;
    name=({owner:"村上",president:"社長",ota:"オオタ",festival:"お祭り"})[profileKey];
   }
  }
 }catch(e){console.warn("面接管理プロフィール取得失敗",e)}
 const label=document.getElementById("lgHeaderHomeLabel");if(label)label.textContent=name+" TOP";
 const icon=document.querySelector(".lg-header-home img");
 if(icon)icon.src="/therapist-profile/staff/interview-sheet-preview/icons/"+
   (profileKey==="owner"?"murakami-pc.webp":"recruit-180.png");
 showCommonAccountMenu(name,"管理者");
}

function bindMetricsHeaderControls(){
 const frame=$("metricsFrame"),toolbar=$("metricsHeaderControls");
 const outerShop=$("metricsHeaderShop"),yearLabel=$("metricsHeaderYear");
 let inside=null,view=null,observer=null;
 function target(id){return inside?.getElementById(id)}
 function sync(){
  if(!inside)return;
  const panel=target("storeMetrics"),shop=target("storeMetricsShop"),month=target("storeMetricsMonth");
  const ready=Boolean(panel&&!panel.hidden&&shop&&month&&month.value);
  toolbar.hidden=!ready;
  if(!ready)return;
  if(outerShop.value!==shop.value)outerShop.value=shop.value;
  const year=Number(month.value.slice(0,4));
  yearLabel.textContent=year+"年";
  $("metricsHeaderNextYear").disabled=year>=new Date().getFullYear();
 }
 function setYear(delta){
  if(toolbar.hidden)return;
  const month=target("storeMetricsMonth");
  if(!month||!month.value)return;
  const parts=month.value.split("-").map(Number);
  const year=parts[0]+delta,number=parts[1];
  const today=new Date(),currentYear=today.getFullYear(),currentMonth=today.getMonth()+1;
  if(year>currentYear||year<2025)return;
  const nextMonth=year===currentYear?Math.min(number,currentMonth):number;
  month.value=year+"-"+String(nextMonth).padStart(2,"0");
  month.dispatchEvent(new Event("change",{bubbles:true}));
  sync();
 }
 outerShop.addEventListener("change",()=>{
  if(toolbar.hidden)return;
  const select=target("storeMetricsShop");
  if(!select)return;
  select.value=outerShop.value;
  select.dispatchEvent(new Event("change",{bubbles:true}));
  try{view?.renderSalesMetrics?.();}catch(error){console.warn('営業数値表示切替',error)}
  sync();
 });
 $("metricsHeaderPrevYear").addEventListener("click",()=>setYear(-1));
 $("metricsHeaderNextYear").addEventListener("click",()=>setYear(1));
 frame.addEventListener("load",()=>{
  if(observer){observer.disconnect();observer=null;}
  if(view)view.removeEventListener("interview-auth-ready",sync);
  try{
   inside=frame.contentDocument;view=frame.contentWindow;
   if(!inside||!target("storeMetricsShop")){toolbar.hidden=true;return;}
   observer=new MutationObserver(sync);
   const month=target("storeMetricsMonth"),panel=target("storeMetrics");
   if(month)observer.observe(month,{attributes:true,attributeFilter:["value"]});
   if(month)month.addEventListener("change",sync);
   const innerPeriodLabel=target("storeMetricsMonthLabel");
   if(innerPeriodLabel)observer.observe(innerPeriodLabel,{childList:true,characterData:true,subtree:true});
   if(panel)observer.observe(panel,{attributes:true,attributeFilter:["hidden"]});
   view.addEventListener("interview-auth-ready",sync);
   sync();view.requestAnimationFrame(sync);
  }catch(err){toolbar.hidden=true;console.warn("数値管理のヘッダー同期を確認できません",err);}
 });
}
bindMetricsHeaderControls();

check();
})();
