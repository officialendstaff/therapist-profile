'use strict';
const COLOR_THEME={
 shops:{

function applyTheme(el,theme){if(!theme)return;el.style.setProperty('background',theme.bg,'important');el.style.setProperty('color',theme.fg,'important');el.style.setProperty('border-color',theme.border,'important')}
function applyShopTheme(el,shop){const name=String(shop||'').trim();const normalized={'LUXY':'LUXY OSAKA','GrandLuxe':'Grand Luxe','グランドリュクス':'Grand Luxe','アンスク':'Un Secret','BUSTY':'BUSTY OSAKA'}[name]||name;applyTheme(el,COLOR_THEME.shops[normalized]);if(el&&el.classList.contains('shop-label')){el.style.setProperty('font-weight','700','important');el.style.setProperty('padding','3px 7px','important');el.style.setProperty('border-width','1px','important')}}

let registrationSelectionSync=null;const now=new Date();now.setHours(0,0,0,0);let monthView=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now),chosen=null;

const LINE_SHOPS={rose:'薔薇と紳士',grandluxe:'Grand Luxe',luxy:'LUXY',unsecret:'Un Secret',us:'Un Secret',busty:'BUSTY OSAKA'};
function normalizeLineInbox(data){
 const grouped=new Map(),links=new Map();
 const interviews=new Map((data.interviews||[]).map(x=>[String(x.id),x]));
 const formStatus=new Map((data.formStatus||[]).map(x=>[String(x.interview_id),String(x.status||'')]));
 const staff=new Map((data.staff||[]).map(x=>[String(x.user_id),x.display_name]));
 const history=new Map();
 for(const h of data.history||[]){const k=String(h.interview_id);if(!history.has(k))history.set(k,[]);history.get(k).push(h)}
 for(const link of data.links||[]){
  if(!link.account_id||!link.line_user_id)continue;
  const key=String(link.account_id)+':'+String(link.line_user_id);
  if(!links.has(key))links.set(key,[]);
  links.get(key).push(link)
 }
 for(const event of data.events||[]){
  if(!event.account_id||!event.line_user_id)continue;
  const account=String(event.account_id),user=String(event.line_user_id),key=account+':'+user;
  if(!grouped.has(key))grouped.set(key,{accountId:account,lineUserId:user,shop:LINE_SHOPS[account]||account,messages:[]});
  grouped.get(key).messages.push({text:String(event.message_text??('['+(event.message_type||'メッセージ')+']')),receivedAt:String(event.received_at||'')});
 }
 const inactive=new Set(['キャンセル','無断トビ','トビ（キャンセル）','返信なし']);
 return [...grouped.values()].map(item=>{
  item.messages.sort((a,b)=>b.receivedAt.localeCompare(a.receivedAt));
  const key=item.accountId+':'+item.lineUserId,all=links.get(key)||[];
  const linked=all.map(l=>({link:l,interview:interviews.get(String(l.interview_id))})).filter(x=>x.interview);
  linked.sort((a,b)=>String(b.interview.interview_date||'').localeCompare(String(a.interview.interview_date||''))||String(b.interview.interview_time||'').localeCompare(String(a.interview.interview_time||'')));
  const active=linked.find(x=>!inactive.has(x.interview.status));
  const selected=active||linked[0],link=selected?.link||all[0]||{},profile=data.profiles?.[key]||{};
  const past=linked.flatMap(x=>{
   const i=x.interview,events=(history.get(String(i.id))||[]).map(h=>({type:h.event_type||'変更',scheduledAt:[h.original_date,h.original_time].filter(Boolean).join(' '),updatedAt:h.recorded_at||''}));
   if(inactive.has(i.status)&&!events.some(e=>e.type===i.status))events.push({type:i.status,scheduledAt:[i.interview_date,i.interview_time].filter(Boolean).join(' '),updatedAt:i.updated_at||''});
   return events
  }).filter(e=>e.scheduledAt).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
  const date=active?[active.interview.interview_date,active.interview.interview_time].filter(Boolean).join(' '):'';
  const outcome=active?(formStatus.get(String(active.interview.id))||String(active.interview.status||'')):'';
  const assignee=active?(staff.get(String(active.interview.interviewer_user_id))||CHART_STAFF_SOURCE.find(x=>x.id===active.interview.interviewer_user_id)?.name||'担当者未登録'):'';
  return {...item,name:profile.displayName||link.line_display_name||'Unknown',picture:profile.pictureUrl||link.line_picture_url||'',interviewId:active?.interview.id??null,date,staff:assignee,outcome,history:past,lastReceived:item.messages[0]?.receivedAt||''};
 }).sort((a,b)=>b.lastReceived.localeCompare(a.lastReceived));
}
async function refreshLineInboxReadOnly(){
 const token=localStorage.getItem('interview_staff_session_v2')||sessionStorage.getItem('interview_staff_session_v2');
 if(!token){lineInboxReadOnly.status='login-required';lineInboxReadOnly.error='session_missing';if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();return false}
 lineInboxReadOnly.status='loading';
 try{
  const response=await fetch('https://vjjnkflbfsjihwzjsjpr.supabase.co/functions/v1/interview-staff-access',{
   method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
   body:JSON.stringify({action:'inbox',token})
  });
  const data=await response.json();
  if(response.status===401){lineInboxReadOnly.status='login-required';lineInboxReadOnly.error='unauthorized';lineInboxReadOnly.applicants=[];if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();return false}
  if(!response.ok)throw new Error(data.error||'inbox_request_failed');
  lineInboxReadOnly.events=Array.isArray(data.events)?data.events:[];
  lineInboxReadOnly.links=Array.isArray(data.links)?data.links:[];
  lineInboxReadOnly.profiles=data.profiles&&typeof data.profiles==='object'?data.profiles:{};
  lineInboxReadOnly.applicants=normalizeLineInbox(data);lineInboxReadOnly.error='';lineInboxReadOnly.status='ready';syncLineNewCount(currentPage==='LINE通知');updateSidebarCounts();
  if(liveInterviewLists.status==='ready'&&liveInterviewLists.rows.length){const inboxByLine=new Map(lineInboxReadOnly.applicants.map(x=>[String(x.accountId)+':'+String(x.lineUserId),x]));const pictures=new Map(lineInboxReadOnly.applicants.filter(x=>x.picture).map(x=>[String(x.accountId)+':'+String(x.lineUserId),x.picture]));let changed=false;for(const row of liveInterviewLists.rows){const lineKey=String(row.accountId)+':'+String(row.lineUserId),picture=pictures.get(lineKey),incoming=inboxByLine.get(lineKey)?.messages||[];if(picture&&row.picture!==picture){row.picture=picture;changed=true}if(row.messages?.[0]?.receivedAt!==incoming[0]?.receivedAt){row.messages=incoming;changed=true}}if(changed){if(!$('todayPanel').hidden)renderTodayTest();else if(!$('sharedPanel').hidden&&currentPage!=='LINE通知')renderList()}}
  window.dispatchEvent(new Event('interview-new-line-data-ready'));if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();
  return true;
 }catch(error){lineInboxReadOnly.status='error';lineInboxReadOnly.error=String(error.message||error);console.warn('LINE読み取り接続',error);if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();return false}
}

/* Shared application dialog, independent of applicant-card geometry */
function appDialog(message,mode='notice'){return new Promise(resolve=>{const backdrop=document.createElement('div');backdrop.className='app-dialog-backdrop';backdrop.style.cssText='position:fixed;inset:0;z-index:20000;background:rgba(15,23,42,.52);display:flex;align-items:center;justify-content:center;padding:16px';const dialog=document.createElement('section');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.style.cssText='width:min(430px,100%);box-sizing:border-box;background:white;color:#1e293b;border:1px solid #dbe3ee;border-radius:12px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)';const heading=document.createElement('h2');heading.textContent=mode==='confirm'?'操作の確認':mode==='password'?'面接管理ログイン':'お知らせ';heading.style.cssText='font-size:17px;font-weight:700;margin:0 0 14px';const content=document.createElement('p');content.textContent=message;content.style.cssText='font-size:13px;line-height:1.7;white-space:pre-wrap;margin:0 0 18px';const input=mode==='password'?document.createElement('input'):null;if(input){input.type='password';input.autocomplete='current-password';input.setAttribute('aria-label','面接管理パスワード');input.style.cssText='width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:7px;margin:0 0 16px'}const actions=document.createElement('div');actions.style.cssText='display:flex;gap:9px;justify-content:flex-end';const close=(value)=>{document.removeEventListener('keydown',onKey);backdrop.remove();resolve(value)};const onKey=e=>{if(e.key==='Escape'){e.preventDefault();close(mode==='password'?null:false)}else if(e.key==='Enter'&&mode==='password'){e.preventDefault();close(input.value||null)}};document.addEventListener('keydown',onKey);if(mode!=='notice'){const back=document.createElement('button');back.type='button';back.textContent='戻る';back.style.cssText='padding:9px 18px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#334155;cursor:pointer';back.onclick=()=>close(mode==='password'?null:false);actions.append(back)}const ok=document.createElement('button');ok.type='button';ok.textContent=mode==='notice'?'閉じる':mode==='password'?'ログイン':'確定する';ok.style.cssText='padding:9px 18px;border:0;border-radius:7px;background:#2877c7;color:#fff;font-weight:700;cursor:pointer';ok.onclick=()=>close(mode==='password'?(input.value||null):true);actions.append(ok);dialog.append(heading,content);if(input)dialog.append(input);dialog.append(actions);backdrop.append(dialog);document.body.append(backdrop);backdrop.onclick=e=>{if(e.target===backdrop)close(mode==='password'?null:false)};(input||ok).focus()})}
function appNotice(message){void appDialog(String(message),'notice')}
async function loginLineInbox(){
 const password=await appDialog('面接管理のパスワードを入力してください','password');
 if(password===null||!password)return;
 const note=$('listNote');note.textContent='認証を確認しています…';
 try{
  const response=await fetch('https://vjjnkflbfsjihwzjsjpr.supabase.co/functions/v1/interview-staff-access',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action:'login',password})});
  const data=await response.json();
  if(!response.ok||!data.token)throw new Error(data.error||'login_failed');
  localStorage.setItem('interview_staff_session_v2',data.token);
  sessionStorage.removeItem('interview_staff_session_v2');
  lineInboxReadOnly.status='idle';lineInboxReadOnly.error='';
  await refreshLineInboxReadOnly();
 }catch(error){
  lineInboxReadOnly.status='login-required';lineInboxReadOnly.error=String(error.message||error);
  renderList();
 }
}
window.interviewNewLineReadOnly={refresh:refreshLineInboxReadOnly,status:()=>lineInboxReadOnly.status,summary:()=>({events:lineInboxReadOnly.events.length,links:lineInboxReadOnly.links.length,profiles:Object.keys(lineInboxReadOnly.profiles).length,applicants:lineInboxReadOnly.applicants.length}),applicants:()=>lineInboxReadOnly.applicants.map(a=>({...a,messages:a.messages.map(m=>({...m}))}))};
let detailReturn=null;
function detailEntry(parent,title,content,kind='',time=''){const el=document.createElement('div');el.className='detail-entry '+kind;if(time){const t=document.createElement('time');t.textContent=time;el.append(t)}const heading=document.createElement('strong');heading.textContent=title;el.append(heading);const body=document.createElement('div');body.textContent=content;if(parent.id==='detailLine'){body.className='detail-message-body'}el.append(body);parent.append(el)}
function updateDetailReasons(record){
 const reasonBox=$('detailReason'),title=$('detailReasonTitle'),values=$('detailReasonValues');
 const rejected=Array.isArray(record.rejectionReasons)?record.rejectionReasons.filter(Boolean):[];
 const afterlife=afterlifeList.items.find(x=>String(x.account_id)===String(record.accountId)&&String(x.line_user_id)===String(record.lineUserId));
 const reasons=rejected.length?rejected:Array.isArray(afterlife?.reasons)?afterlife.reasons:[];
 reasonBox.hidden=!reasons.length;title.textContent=rejected.length?'不採用理由':'来世期待理由';values.textContent=reasons.join(' ／ ');

function openApplicantDetail(record,key){if(!$('applicantDetail').hidden)return;const detailAvatar=$('detailAvatar');detailAvatar.replaceChildren();if(record.picture&&/^https:\/\//.test(record.picture)){const img=document.createElement('img');img.src=record.picture;img.alt='LINEアイコン';img.referrerPolicy='no-referrer';img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';img.onerror=()=>{detailAvatar.textContent='LINE'};detailAvatar.append(img)}else detailAvatar.textContent='LINE';detailReturn={home:!$('todayPanel').hidden,page:currentPage,number:pageNumber,scroll:window.scrollY};$('todayPanel').hidden=true;$('sharedPanel').hidden=true;$('applicantDetail').hidden=false;$('detailName').textContent=record.name||'Unknown';$('detailShop').textContent=record.shop||'';applyShopTheme($('detailShop'),record.shop||'');updateDetailReasons(record);const isUnscheduled=['日程未定','日程調整中','キャンセル'].includes(record.status);$('detailDate').textContent=isUnscheduled?'日程未定':(record.date||'面接予定なし');$('detailStaff').textContent=isUnscheduled?'':(record.staff?'担当：'+record.staff:'');const state=testState.get(key)||{};$('detailConfirm').textContent=state.ok?'確認OK':state.sent?'送信済み':'未確認';$('detailConfirm').className=state.ok?'detail-confirm-ok':'';const line=$('detailLine');line.replaceChildren();const inboxMatch=lineInboxReadOnly.applicants.find(a=>String(a.accountId)===String(record.accountId)&&String(a.lineUserId)===String(record.lineUserId));const messages=(record.messages&&record.messages.length?record.messages:inboxMatch?.messages)||[];if(messages.length){for(const msg of messages){detailEntry(line,'受信メッセージ',msg.text||'', '',msg.receivedAt||'')}}else{const empty=document.createElement('p');empty.className='detail-empty';empty.textContent='LINE受信履歴は未連携です';line.append(empty)}const history=$('detailHistory');history.replaceChildren();const entries=(record.history||[]).filter(e=>e&&typeof e==='object'&&!Array.isArray(e)&&e.scheduledAt).slice().sort((a,b)=>(b.updatedAt||b.scheduledAt).localeCompare(a.updatedAt||a.scheduledAt));detailEntry(history,'面接登録',record.date+'　'+(record.shop||'')+'　担当：'+(record.staff||''),'registered');for(const e of entries){const type=e.type==='変更'?'日程変更':e.type==='キャン'?'キャンセル':e.type;const kind=type==='日程変更'?'changed':type==='キャンセル'?'cancel':type==='無断トビ'?'no-show':'';const content=type==='日程変更'?'変更前：'+e.scheduledAt+(e.newScheduledAt?' → 変更後：'+e.newScheduledAt:''): '対象：'+e.scheduledAt;detailEntry(history,type,content,kind,e.updatedAt||'')}window.scrollTo(0,0)}

function makeCardInformation(record){
 const history=document.createElement('div');history.className='history-labels live-line-content';
 const tags=document.createElement('div');tags.className='live-line-history';
 const allEntries=(record.history||[]).map(e=>Array.isArray(e)?{type:e[0],scheduledAt:e[1]}:e).filter(e=>e&&e.type&&e.scheduledAt).sort((a,b)=>(b.updatedAt||b.scheduledAt).localeCompare(a.updatedAt||a.scheduledAt));const counts={'日程変更':0,'キャンセル':0,'無断トビ':0};
 const countedEvents=new Map();for(const entry of allEntries){const type=entry.type==='変更'?'日程変更':entry.type==='キャン'?'キャンセル':entry.type;if(!Object.prototype.hasOwnProperty.call(counts,type))continue;const key=type+'|'+entry.scheduledAt;const at=Date.parse(entry.updatedAt||'');const prior=countedEvents.get(key);if(Number.isFinite(at)&&Number.isFinite(prior)&&Math.abs(at-prior)<2000)continue;counts[type]++;countedEvents.set(key,at);}
 for(const type of ['日程変更','キャンセル','無断トビ']){if(!counts[type])continue;const tag=document.createElement('span');tag.className='history-tag'+(type==='キャンセル'?' cancel':type==='無断トビ'?' no-show':'');tag.textContent=type+'　'+counts[type]+'回';tag.title=type+'：'+counts[type]+'回';tags.append(tag)}
 const preview=document.createElement('span');preview.className='live-line-preview';preview.textContent=String(record.messages?.[0]?.text||'').split(/\r?\n/)[0];preview.title=record.messages?.[0]?.text||'';
 history.append(tags,preview);return history
}

function recordsForLivePage(page){
