rt-grid{display:grid;grid-template-columns:72px repeat(28,minmax(28px,1fr));min-width:900px;gap:2px;align-items:center}.time-label{font-size:10px;text-align:center;color:#536477}.staff-label{font-size:12px;font-weight:bold;white-space:nowrap}.slot{height:29px;border:0;border-radius:3px;background:#78a8dc;padding:0}.slot.blocked{background:#d4d8df}.slot.booked{background:#d57c83}.slot.chosen{outline:3px solid #163d6a;outline-offset:-2px}.legend{display:flex;gap:14px;align-items:center;font-size:11px}.legend i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:middle}.sidebar{position:fixed;left:0;top:calc(var(--header) + var(--top));bottom:0;width:var(--sidebar);border-right:2px solid var(--line);padding:12px 0;overflow:auto;background:#fff}.nav{display:flex;flex-direction:column;gap:8px}.nav button{width:100%;border:0;border-radius:24px;padding:9px 8px;color:white;background:#36b8ee;font-size:20px}.nav button:nth-child(1){background:#75d64e}.nav button:nth-child(4){background:#08be6b}.nav button:nth-child(5){background:#ff4242}.nav button:nth-child(6){background:#111}.nav button:nth-child(7){background:#009fb5}.nav .space{height:16px}.nav button.active{outline:3px solid #182f4e;outline-offset:-3px}.main{position:fixed;top:calc(var(--header) + var(--top));left:var(--sidebar);right:0;bottom:0;overflow:hidden;padding:10px 18px}.main-panel{min-height:100%;background:#fff;padding:12px 16px}.main-panel h1{font-size:22px;font-weight:600;margin:0}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px;border-bottom:1px solid #e0dcd9}.pager{display:flex;align-items:center;gap:9px}.pager button{border:1px solid #ccd2db;border-radius:5px;background:#fff;padding:5px 11px}.pager button:disabled{opacity:.4}.applicant-list{display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:6px;padding-top:8px;height:calc(100dvh - var(--header) - var(--top) - 110px);min-height:0}.applicant{display:grid;grid-template-column /* Visual refinement: typography and unassigned UI colors; preserve status colors */
:root{--ink:#253245;--line:#e3e8ef}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:13px;letter-spacing:.015em;background:#fff;-webkit-font-smoothing:antialiased}
button{font-family:inherit;letter-spacing:inherit}
.header{background:#1e293b;border-bottom:1px solid #344155}
.brand{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.075em;text-align:left;line-height:1.5}
.header-actions button{background:#e8eef5;color:#26364b;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;font-weight:600}
.header-actions button:disabled{background:#344155;color:#9caabc;border-color:#46556b}
.calendar,.chart,.sidebar,.main-panel{background:#fff}
.calendar{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal-head{font-size:13px;color:#26364b}
.cal-head button{background:#f1f4f8;color:#475569}
.week span{font-weight:700;color:#64748b}
.days button{background:#f5f7fa;color:#334155;font-weight:500}
.days button.selected{background:#334e70;color:#fff}
.chart{border-bottom:1px solid var(--line)}
.chart-title{font-size:15px;color:#26364b}
.chart-title small{font-weight:500}
.sidebar{border-right:1px solid var(--line);padding:14px 10px}
.nav{gap:3px}
.nav button,.nav button:nth-child(1),.nav button:nth-child(4),.nav button:nth-child(5),.nav button:nth-child(6),.nav button:nth-child(7){background:transparent;color:#48576a;border:1px solid transparent;border-radius:6px;text-align:left;font-size:13px;font-weight:600;padding:11px 13px;line-height:1.3;transition:background .12s}
.nav button:first-child{color:#16803e}
.nav button:hover{background:#f2f5f9}
.nav button.active,.nav button:nth-child(1).active,.nav button:nth-child(4).active,.nav button:nth-child(5).active,.nav button:nth-child(6).active,.nav button:nth-child(7).active{background:#edf2f8;color:#1e3b5b;border-color:#dce5ef;outline:none}
.nav button:first-child.active{background:#edf8f0;color:#147c39;border-color:#d2ead9}
.nav .space{height:12px}
.main{background:#fff}
.main-panel{padding:10px 12px}
.main-panel h1{font-size:18px;font-weight:700;color:#27364a;letter-spacing:.025em}
.list-head{border-bottom:1px solid #e5eaf0}
.pager button{color:#45546a;border-color:#dbe2ea;background:#f8fafc}
.applicant{background:#fff;border-color:#e3e8ef;border-radius:6px;box-shadow:none}
.identity strong{font-size:13px;font-weight:700;color:#29394e}
.identity small,.detail{font-size:11px;color:#64748b}
.avatar{background:#f0f3f7;color:#7b899c}
.list-note{color:#94a3b8}
@media(max-width:850px){.nav button,.nav button:nth-child(1),.nav button:nth-child(4),.nav button:nth-child(5),.nav button:nth-child(6),.nav button:nth-child(7){font-size:12px;padding:10px 8px}}
.today-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5eaf0;padding-bottom:12px}.today-head h1{margin:0}.today-date{color:#64748b;font-size:12px}.today-empty{padding:35px 12px;color:#64748b;text-align:center;border:1px solid #e3e8ef;border-radius:6px;margin-top:12px}.today-panel[hidden],.shared-panel[hidden]{display:none!important}.brand{padding:8px 12px;border-radius:6px;font-size:18px;transition:background .15s}.brand:hover,.brand:focus-visible{background:#34465f;outline:none}.chart-title{justify-content:flex-start;gap:22px}.chart-date{font-size:15px;font-weight:700;color:#26364b}.chart-date.saturday{color:#4875a9}.chart-date.holiday{color:#b45353}.nav button[data-page="不届き者"],.nav button[data-page="来世期待"]{color:#b45353}.nav button[data-page="集計頁"]{color:#4875a9}.nav button[data-page="不届き者"].active,.nav button[data-page="来世期待"].active{background:#fcf1f1;color:#b45353;border-color:#f1d9d9}.nav button[data-page="集計頁"].active{background:#eff5fc;color:#4875a9;border-color:#d9e6f4}.today-test-note{margin-top:12px;font-size:11px;color:#8a6671}.today-test-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.today-test-card{display:grid;grid-template-columns:85px minmax(0,1fr) 110px;align-items:center;gap:12px;padding:13px 16px;border:1px solid #e3e8ef;border-left:4px solid #94a3b8;border-radius:6px}.today-test-card>strong{font-size:16px}.today-test-card>div{display:flex;flex-direction:column;gap:5px}.today-test-card small{color:#64748b;font-size:11px}.today-test-card>span{justify-self:end;font-size:12px;font-weight:700}.today-test-card.pending{background:#f9fafb}.today-test-card.sent{background:#f5f9fe;border-left-color:#4875a9}.today-test-card.sent>span{color:#4875a9}.today-test-card.confirmed{background:#f5fbf6;border-left-color:#16803e}.today-test-card.confirmed>span{color:#16803e}@media(max-width:650px){.today-test-card{grid-template-columns:65px 1fr;padding:9px;gap:7px}.today-test-card>span{grid-column:2;justify-self:start}}</style></head><body>
<header class="header"><button class="brand" id="home">⌂ TOP</button><div class="header-actions"><button disabled title="面接登録画面は次工程で実装">面接登録</button><button id="sound">通知設定</button></div></header>
<section class="calendar" aria-label="月間カレンダー"><div class="cal-head"><button id="prev" aria-label="前月">◀</button><span id="month"></span><button id="next" aria-label="翌月">▶</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="days" id="days"></div></section>
<section class="chart" aria-label="担当者タイムチャート"><div class="chart-title"><span>担当者タイムチャート</span><span id="selectedDate" class="chart-date"></span></div><div class="chart-scroll"><div class="chart-grid" id="chartGrid"></div></div><div class="legend"><span><i style="background:#78a8dc"></i>選択可能</span><span><i style="background:#d4d8df"></i>選択不可</span><span><i style="background:#d57c83"></i>面接予約済み</span><span class="status" id="slotStatus">※現在はデータ未接続の表示テストです</span></div></section>
<aside class="sidebar"><nav class="nav" id="nav"><button data-page="LINE通知" class="active">LINE通知</button><div class="space"></div><button data-page="明日以降">明日以降</button><button data-page="日程調整">日程調整</button><div class="space"></div><button data-page="面接済み">面接済み</button><div class="space"></div><button data-page="不届き者">不届き者</button><button data-page="来世期待">来世期待</button><div class="space"></div><button data-page="集計頁">集計頁</button></nav></aside>
<main class="main"><section class="main-panel"><div class="today-panel" id="todayPanel"><div class="today-head"><h1>本日の面接予定</h1><span class="today-date" id="todayDate"></span></div><div class="today-test-note">表示テスト用：実際の面接予約ではありません</div><div class="today-test-list" id="todayTestList"></div></div><div class="shared-panel" id="sharedPanel" hidden><div class="list-head"><h1 id="pageTitle">LINE通知</h1><div class="pager"><button id="pagePrev" aria-label="前のページ">◀</button><span id="pageIndicator">1 / 1</span><button id="pageNext" aria-label="次のページ">▶</button></div></div><div id="applicantList" class="applicant-list"></div><p class="list-note" id="listNote"></p></div></section></main>
<script>
'use strict';
const now=new Date();now.setHours(0,0,0,0);let monthView=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now),chosen=null;
const commonPages=['LINE通知','明日以降','日程調整','面接済み','不届き者','来世期待'];let currentPage='LINE通知',pageNumber=1;const applicantData=Object.fromEntries(commonPages.map(k=>[k,[]]));function renderList(){const list=$('applicantList');list.replaceChildren();$('pageTitle').textContent=currentPage;const records=applicantData[currentPage]||[];const total=Math.max(1,Math.ceil(records.length/8));pageNumber=Math.min(Math.max(1,pageNumber),total);$('pageIndicator').textContent=pageNumber+' / '+total;$('pagePrev').disabled=pageNumber===1;$('pageNext').disabled=pageNumber===total;for(let n=0;n<8;n++){const record=records[(pageNumber-1)*8+n];const card=document.createElement('article');card.className='applicant';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=record?.name?'LINE':'—';const info=document.createElement('div');info.className='applicant-info';const identity=document.createElement('div');identity.className='identity';const name=document.createElement('strong');name.textContent=record?.name||'—';const store=document.createElement('small');store.textContent=record?.shop||'店舗名：—';identity.append(name,store);const right=document.createElement('div');const detail=document.createElement('div');detail.className='detail';detail.textContent=(record?.date||'面接日時：—')+' / '+(record?.staff||'担当者：—')+' / '+(record?.history||'過去履歴：—');const actions=document.createElement('div');actions.className='card-actions';for(let j=0;j<4;j++){const b=document.createElement('button');b.textContent='未設定';b.disabled=true;actions.append(b)}right.append(detail,actions);info.append(identity,right);card.append(avatar,info);list.append(card)}$('listNote').textContent=records.length?'':'※表示枠のみ作成。応募者データ・ボタン機能は未接続です。'};function renderTodayTest(){const el=$('todayTestList');el.replaceChildren();for(const x of [{time:'15:00',name:'テスト応募者 A',shop:'Grand Luxe',staff:'社長',status:'未確認',state:'pending'},{time:'17:30',name:'テスト応募者 B',shop:'LUXY',staff:'オオタ',status:'確認LINE済',state:'sent'},{time:'19:00',name:'テスト応募者 C',shop:'薔薇と紳士',staff:'村上',status:'確認OK',state:'confirmed'}]){const a=document.createElement('article');a.className='today-test-card '+x.state;const t=document.createElement('strong');t.textContent=x.time+'〜';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=x.name;const detail=document.createElement('small');detail.textContent=x.shop+' / 担当：'+x.staff;info.append(name,detail);const state=document.createElement('span');state.textContent=x.status;a.append(t,info,state);el.append(a)}}function showHome(){ $('todayPanel').hidden=false;$('sharedPanel').hidden=true;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));$('todayDate').textContent=dateKey(now)}function showCommon(page){currentPage=page;pageNumber=1;$('todayPanel').hidden=true;$('sharedPanel').hidden=false;renderList()}const $=id=>document.getElementById(id),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function renderCalendar(){const y=monthView.getFullYear(),m=monthView.getMonth();$('month').textContent=y+'年 '+String(m+1).padStart(2,'0')+'月';const days=$('days');days.replaceChildren();const offset=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++){const b=document.createElement('button');b.className='empty';b.disabled=true;days.append(b)}for(let d=1;d<=count;d++){const day=new Date(y,m,d),b=document.createElement('button');b.textContent=d;b.className=[day.getDay()===0||day.getDay()===6?'weekend':'',dateKey(day)===dateKey(now)?'today':'',dateKey(day)===dateKey(selected)?'selected':''].join(' ');b.disabled=day<now;b.onclick=()=>{selected=day;chosen=null;renderCalendar();renderChart()};days.append(b)}}
function holiday(d){const y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate(),nth=(mo,k)=>1+(8-new Date(y,mo-1,1).getDay())%7+7*(k-1);const spring=Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)),autumn=Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));const base=new Set(['1-1','2-11','2-23','4-29','5-3','5-4','5-5','8-11','11-3','11-23','3-'+spring,'9-'+autumn,'1-'+nth(1,2),'7-'+nth(7,3),'9-'+nth(9,3),'10-'+nth(10,2)]),days=new Set(),len=Math.round((new Date(y+1,0,1)-new Date(y,0,1))/86400000);for(let i=0;i<len;i++){const t=new Date(y,0,i+1);if(base.has((t.getMonth()+1)+'-'+t.getDate()))days.add(i)}for(const i of [...days]){if(new Date(y,0,i+1).getDay()===0){let j=i+1;while(days.has(j))j++;days.add(j)}}for(let i=1;i<len-1;i++){if(!days.has(i)&&days.has(i-1)&&days.has(i+1))days.add(i)}return days.has(Math.round((d-new Date(y,0,1))/86400000))}
function renderChart(){ $('selectedDate').textContent=dateKey(selected);$('selectedDate').className='chart-date '+(selected.getDay()===0||holiday(selected)?'holiday':selected.getDay()===6?'saturday':'');const grid=$('chartGrid');grid.replaceChildren();const corner=document.createElement('span');grid.append(corner);for(let i=0;i<28;i++){const t=document.createElement('span');t.className='time-label';t.textContent=String(10+Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00');grid.append(t)}for(const staff of ['社長','オオタ','村上','お祭り']){const label=document.createElement('span');label.className='staff-label';label.textContent=staff;grid.append(label);for(let i=0;i<28;i++){const hour=10+Math.floor(i/2),minute=i%2?30:0;const b=document.createElement('button');const passed=dateKey(selected)===dateKey(now)&&(hour<new Date().getHours()||(hour===new Date().getHours()&&minute<new Date().getMinutes()));b.className='slot'+(passed?' blocked':'');b.disabled=passed;b.title=staff+' '+String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');if(chosen===b.title)b.classList.add('chosen');b.onclick=()=>{chosen=b.title;$('slotStatus').textContent='選択：'+dateKey(selected)+' '+chosen;renderChart()};grid.append(b)}}}
$('prev').onclick=()=>{monthView=new Date(monthView.getFullYear(),monthView.getMonth()-1,1);renderCalendar()};$('next').onclick=()=>{monthView=new Date(monthView.getFullYear(),monthView.getMonth()+1,1);renderCalendar()};
$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));showCommon(b.dataset.page)};
$('home').onclick=()=>{showHome();selected=new Date(now);monthView=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();renderChart()};
$('sound').onclick=async()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('非対応');const ctx=new C();await ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close();alert('通知テスト音を再生しました。聞こえない場合はPCの音量・ブラウザ設定を確認してください。')}catch(e){alert('通知音の再生に失敗しました：'+e.message)}};
$('pagePrev').onclick=()=>{pageNumber--;renderList()};$('pageNext').onclick=()=>{pageNumber++;renderList()};renderCalendar();renderChart();renderList();renderTodayTest();showHome();
</script></body></html>
