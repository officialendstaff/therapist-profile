'use strict';
const now=new Date();now.setHours(0,0,0,0);let monthView=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now),chosen=null;
const commonPages=['LINE通知','明日以降','日程調整','面接済み','不届き者','来世期待'];let currentPage='LINE通知',pageNumber=1;const applicantData=Object.fromEntries(commonPages.map(k=>[k,[]]));const testState=new Map();const testExamples=[{name:'あき',shop:'薔薇と紳士',date:'2026-10-27 15:00',staff:'村上',history:[{type:'日程変更',scheduledAt:'2026-10-26 15:00'},{type:'キャンセル',scheduledAt:'2026-10-24 19:00'}]},{name:'noa',shop:'Grand Luxe',date:'2026-10-27 16:00',staff:'オオタ',history:[]},{name:'170♥',shop:'薔薇と紳士',date:'2026-10-27 17:30',staff:'社長',history:[{type:'無断トビ',scheduledAt:'2026-10-20 14:30'}]},{name:'テスト応募者',shop:'Un Secret',date:'2026-10-27 19:00',staff:'社長',history:[{type:'日程変更',scheduledAt:'2026-10-26 19:00'},{type:'無断トビ',scheduledAt:'2026-10-21 18:00'}]}];
function makeTestCard(record,key){const state=testState.get(key)||{sent:false,ok:false,selected:''};testState.set(key,state);const card=document.createElement('article');card.className='applicant'+(state.ok?' confirmed':state.sent?' sent':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='LINE';const identity=document.createElement('div');identity.className='identity';const name=document.createElement('strong');name.textContent=record.name;const store=document.createElement('small');store.className='shop-label';store.textContent=record.shop;identity.append(name,store);const date=document.createElement('div');date.className='interview-datetime';const when=document.createElement('strong');when.textContent=record.date;const staff=document.createElement('span');staff.textContent='担当：'+record.staff;date.append(when,staff);const confirmations=document.createElement('div');confirmations.className='confirmation-controls';const send=document.createElement('button');send.textContent=state.sent?'送信済み':'LINE送信';send.className=state.sent?'sent-btn':'';send.onclick=()=>{state.sent=!state.sent;send.textContent=state.sent?'送信済み':'LINE送信';send.classList.toggle('sent-btn',state.sent);card.classList.toggle('sent',state.sent&&!state.ok)};const ok=document.createElement('button');ok.textContent='確認OK';ok.className='ok-btn'+(state.ok?' is-ok':'');ok.onclick=()=>{state.ok=!state.ok;ok.classList.toggle('is-ok',state.ok);card.classList.toggle('confirmed',state.ok);card.classList.toggle('sent',state.sent&&!state.ok)};confirmations.append(send,ok);const history=document.createElement('div');history.className='history-labels';const entries=(record.history||[]).map(entry=>Array.isArray(entry)?{type:entry[0],scheduledAt:typeof entry[1]==='string'?entry[1]:null}:entry).filter(entry=>entry&&entry.scheduledAt&&/^(日程変更|変更|キャンセル|キャン|無断トビ)$/.test(entry.type)).sort((a,b)=>b.scheduledAt.localeCompare(a.scheduledAt));for(const entry of entries){const type=entry.type==='変更'?'日程変更':entry.type==='キャン'?'キャンセル':entry.type;const tag=document.createElement('span');tag.className='history-tag'+(type==='キャンセル'?' cancel':type==='無断トビ'?' no-show':'');tag.textContent=type+'：'+entry.scheduledAt;history.append(tag)}
const actions=document.createElement('div');actions.className='card-actions';for(const [id,label,color] of [['register','面接登録','#568DB9'],['change','日程変更','#D99A54'],['cancel','キャンセル','#CD7580'],['future','来世期待','#A65A68']]){const b=document.createElement('button');b.textContent=label;b.style.setProperty('--btn-color',color);b.classList.toggle('pressed',state.selected===id);b.onclick=()=>{state.selected=id;actions.querySelectorAll('button').forEach(x=>x.classList.toggle('pressed',x===b))};actions.append(b)}card.append(avatar,identity,date,confirmations,history,actions);return card}
function renderList(){const list=$('applicantList');list.replaceChildren();$('pageTitle').textContent=currentPage;const records=applicantData[currentPage]?.length?applicantData[currentPage]:testExamples;const total=Math.max(1,Math.ceil(records.length/8));pageNumber=Math.min(Math.max(1,pageNumber),total);$('pageIndicator').textContent=pageNumber+' / '+total;$('pagePrev').disabled=pageNumber===1;$('pageNext').disabled=pageNumber===total;records.slice((pageNumber-1)*8,pageNumber*8).forEach((record,i)=>list.append(makeTestCard(record,currentPage+':'+((pageNumber-1)*8+i))));$('listNote').textContent=''}
function renderTodayTest(){const el=$('todayTestList');el.replaceChildren();testExamples.slice(0,3).forEach((record,i)=>el.append(makeTestCard(record,'today:'+i)))}
function showHome(){ $('todayPanel').hidden=false;$('sharedPanel').hidden=true;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page==='今日の予定'));$('todayDate').textContent=dateKey(now)}function showCommon(page){currentPage=page;pageNumber=1;$('todayPanel').hidden=true;$('sharedPanel').hidden=false;renderList()}const $=id=>document.getElementById(id),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function renderCalendar(){const y=monthView.getFullYear(),m=monthView.getMonth();$('month').textContent=y+'年 '+String(m+1).padStart(2,'0')+'月';const days=$('days');days.replaceChildren();const offset=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++){const b=document.createElement('button');b.className='empty';b.disabled=true;days.append(b)}for(let d=1;d<=count;d++){const day=new Date(y,m,d),b=document.createElement('button');b.textContent=d;b.className=[day.getDay()===0||day.getDay()===6?'weekend':'',dateKey(day)===dateKey(now)?'today':'',dateKey(day)===dateKey(selected)?'selected':''].join(' ');b.disabled=day<now;b.onclick=()=>{selected=day;chosen=null;renderCalendar();renderChart()};days.append(b)}}
function holiday(d){const y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate(),nth=(mo,k)=>1+(8-new Date(y,mo-1,1).getDay())%7+7*(k-1);const spring=Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)),autumn=Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));const base=new Set(['1-1','2-11','2-23','4-29','5-3','5-4','5-5','8-11','11-3','11-23','3-'+spring,'9-'+autumn,'1-'+nth(1,2),'7-'+nth(7,3),'9-'+nth(9,3),'10-'+nth(10,2)]),days=new Set(),len=Math.round((new Date(y+1,0,1)-new Date(y,0,1))/86400000);for(let i=0;i<len;i++){const t=new Date(y,0,i+1);if(base.has((t.getMonth()+1)+'-'+t.getDate()))days.add(i)}for(const i of [...days]){if(new Date(y,0,i+1).getDay()===0){let j=i+1;while(days.has(j))j++;days.add(j)}}for(let i=1;i<len-1;i++){if(!days.has(i)&&days.has(i-1)&&days.has(i+1))days.add(i)}return days.has(Math.round((d-new Date(y,0,1))/86400000))}
function renderChart(){ $('selectedDate').textContent=dateKey(selected);$('selectedDate').className='chart-date '+(selected.getDay()===0||holiday(selected)?'holiday':selected.getDay()===6?'saturday':'');const grid=$('chartGrid');grid.replaceChildren();const corner=document.createElement('span');grid.append(corner);for(let i=0;i<28;i++){const t=document.createElement('span');t.className='time-label';t.textContent=String(10+Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00');grid.append(t)}for(const staff of ['社長','オオタ','村上','お祭り']){const label=document.createElement('span');label.className='staff-label';label.textContent=staff;grid.append(label);for(let i=0;i<28;i++){const hour=10+Math.floor(i/2),minute=i%2?30:0;const b=document.createElement('button');const passed=dateKey(selected)===dateKey(now)&&(hour<new Date().getHours()||(hour===new Date().getHours()&&minute<new Date().getMinutes()));b.className='slot'+(passed?' blocked':'');b.disabled=passed;b.title=staff+' '+String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');if(chosen===b.title)b.classList.add('chosen');b.onclick=()=>{chosen=b.title;$('slotStatus').textContent='選択：'+dateKey(selected)+' '+chosen;renderChart()};grid.append(b)}}}
$('prev').onclick=()=>{monthView=new Date(monthView.getFullYear(),monthView.getMonth()-1,1);renderCalendar()};$('next').onclick=()=>{monthView=new Date(monthView.getFullYear(),monthView.getMonth()+1,1);renderCalendar()};
$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;if(b.dataset.page==='今日の予定'){showHome();return}document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));showCommon(b.dataset.page)};
$('home').onclick=()=>{showHome();selected=new Date(now);monthView=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();renderChart()};
$('sound').onclick=async()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('非対応');const ctx=new C();await ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close();alert('通知テスト音を再生しました。聞こえない場合はPCの音量・ブラウザ設定を確認してください。')}catch(e){alert('通知音の再生に失敗しました：'+e.message)}};
$('pagePrev').onclick=()=>{pageNumber--;renderList()};$('pageNext').onclick=()=>{pageNumber++;renderList()};renderCalendar();renderChart();renderList();renderTodayTest();showHome();
</script></body></html>
