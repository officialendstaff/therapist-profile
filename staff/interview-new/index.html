<script>

 },

const now=new Date();now.setHours(0,0,0,0);let monthView=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now),chosen=null;
const commonPages=['LINE通知','明日以降','日程調整','面接済み','不届き者','来世期待'];let currentPage='LINE通知',pageNumber=1;const applicantData=Object.fromEntries(commonPages.map(k=>[k,[]]));const testState=new Map();const testExamples=[{name:'あき',shop:'薔薇と紳士',date:'2026-10-27 15:00',staff:'村上',history:[{type:'日程変更',scheduledAt:'2026-10-26 15:00'},{type:'キャンセル',scheduledAt:'2026-10-24 19:00'}]},{name:'noa',shop:'Grand Luxe',date:'2026-10-27 16:00',staff:'オオタ',history:[]},{name:'170♥',shop:'薔薇と紳士',date:'2026-10-27 17:30',staff:'社長',history:[{type:'無断トビ',scheduledAt:'2026-10-20 14:30'}]},{name:'テスト応募者',shop:'Un Secret',date:'2026-10-27 19:00',staff:'社長',history:[{type:'日程変更',scheduledAt:'2026-10-26 19:00'},{type:'無断トビ',scheduledAt:'2026-10-21 18:00'}]}];

const lineInboxReadOnly={status:'idle',events:[],links:[],profiles:{},applicants:[],error:''};
const LINE_SHOPS={rose:'薔薇と紳士',grandluxe:'Grand Luxe',luxy:'LUXY',unsecret:'Un Secret',us:'Un Secret',busty:'BUSTY OSAKA'};
function normalizeLineInbox(data){
 const grouped=new Map(),links=new Map();
 const interviews=new Map((data.interviews||[]).map(x=>[String(x.id),x]));
 const staff=new Map((data.staff||[]).map(x=>[String(x.user_id),x.display_name]));
 const history=new Map();
 for(const h of data.history||[]){const k=String(h.interview_id);if(!history.has(k))history.set(k,[]);history.get(k).push(h)}

  if(!link.account_id||!link.line_user_id)continue;
  const key=String(link.account_id)+':'+String(link.line_user_id);
  if(!links.has(key))links.set(key,[]);
  links.get(key).push(link)
 }
 for(const event of data.events||[]){
  if(!event.account_id||!event.line_user_id)continue;
  const account=String(event.account_id),user=String(event.line_user_id),key=account+':'+user;
  if(!grouped.has(key))grouped.set(key,{accountId:account,lineUserId:user,shop:LINE_SHOPS[account]||account,messages:[]});
  grouped.get(key).messages.push({text:String(event.message_text??('['+(event.message_type||'メッセージ')+']')),receivedAt:String(event.received_at||'')});
 }
 const inactive=new Set(['キャンセル','無断トビ','トビ（キャンセル）','返信なし']);
 return [...grouped.values()].map(item=>{
  item.messages.sort((a,b)=>b.receivedAt.localeCompare(a.receivedAt));
  const key=item.accountId+':'+item.lineUserId,all=links.get(key)||[];
  const linked=all.map(l=>({link:l,interview:interviews.get(String(l.interview_id))})).filter(x=>x.interview);

  const selected=active||linked[0],link=selected?.link||all[0]||{},profile=data.profiles?.[key]||{};
  const past=linked.flatMap(x=>{
   const i=x.interview,events=(history.get(String(i.id))||[]).map(h=>({type:h.event_type||'変更',scheduledAt:[h.original_date,h.original_time].filter(Boolean).join(' '),updatedAt:h.recorded_at||''}));
   if(inactive.has(i.status))events.push({type:i.status,scheduledAt:[i.interview_date,i.interview_time].filter(Boolean).join(' '),updatedAt:i.updated_at||''});
   return events
  }).filter(e=>e.scheduledAt).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));

 }).sort((a,b)=>b.lastReceived.localeCompare(a.lastReceived));
}
async function refreshLineInboxReadOnly(){
 const token=localStorage.getItem('interview_staff_session_v2')||sessionStorage.getItem('interview_staff_session_v2');
 if(!token){lineInboxReadOnly.status='login-required';lineInboxReadOnly.error='session_missing';if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();return false}
 lineInboxReadOnly.status='loading';
 try{
  const response=await fetch('https://vjjnkflbfsjihwzjsjpr.supabase.co/functions/v1/interview-staff-access',{
   method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
   body:JSON.stringify({action:'inbox',token})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'inbox_request_failed');

  window.dispatchEvent(new Event('interview-new-line-data-ready'));if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();
  return true;
 }catch(error){lineInboxReadOnly.status='error';lineInboxReadOnly.error=String(error.message||error);console.warn('LINE読み取り接続',error);if(currentPage==='LINE通知'&&!$('sharedPanel').hidden&&$('applicantDetail').hidden)renderList();return false}
}

const LIST_BUTTON_POLICY={
 'LINE通知':['register','future'],
 '今日の予定':['send','ok','change','cancel'],
 '明日以降':['change','cancel','future'],
 '日程調整':['change'],
 '面接済み':[],
 '不届き者':['change'],
 '来世期待':['change']
};
function allowListButton(page,id){return (LIST_BUTTON_POLICY[page]||[]).includes(id)}
/* Shared visual structure for LINE and all test-list applicant cards. */
function makeCardInformation(record){
 const history=document.createElement('div');history.className='history-labels live-line-content';
 const tags=document.createElement('div');tags.className='live-line-history';
 const entries=(record.history||[]).map(e=>Array.isArray(e)?{type:e[0],scheduledAt:e[1]}:e).filter(e=>e&&e.type&&e.scheduledAt).sort((a,b)=>(b.updatedAt||b.scheduledAt).localeCompare(a.updatedAt||a.scheduledAt)).slice(0,3);
 for(const entry of entries){const type=entry.type==='変更'?'日程変更':entry.type==='キャン'?'キャンセル':entry.type;const tag=document.createElement('span');tag.className='history-tag'+(type==='キャンセル'?' cancel':type==='無断トビ'?' no-show':'');tag.textContent=type;tag.title=type+'：'+entry.scheduledAt;tags.append(tag)}
 const preview=document.createElement('span');preview.className='live-line-preview';preview.textContent=record.messages?.[0]?.text||'';preview.title=preview.textContent;
 history.append(tags,preview);return history
}
function makeTestCard(record,key){const state=testState.get(key)||{sent:false,ok:false,selected:''};testState.set(key,state);const card=document.createElement('article');card.className='applicant unified-applicant-card'+(state.ok?' confirmed':state.sent?' sent':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='LINE';const identity=document.createElement('div');identity.className='identity';const name=document.createElement('strong');name.textContent=record.name;const store=document.createElement('small');store.className='shop-label';store.textContent=key.startsWith('不届き者:')?'不届き者':record.shop;identity.append(name,store);applyShopTheme(store,record.shop);avatar.tabIndex=0;name.tabIndex=0;avatar.setAttribute('role','button');name.setAttribute('role','button');avatar.setAttribute('aria-label','応募者詳細を開く');name.setAttribute('aria-label','応募者詳細を開く');for(const el of [avatar,name]){el.onclick=()=>openApplicantDetail(record,key);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openApplicantDetail(record,key)}}}const date=document.createElement('div');date.className='interview-datetime';const when=document.createElement('strong');when.textContent=record.date;const staff=document.createElement('span');staff.textContent='担当：'+record.staff;date.append(when,staff);applyStaffTheme(staff,record.staff);if(!record.date){when.textContent='日程未定';date.classList.add('live-date-pending')}const confirmations=document.createElement('div');confirmations.className='confirmation-controls';const send=document.createElement('button');send.textContent=state.sent?'送信済み':'LINE送信';send.className=state.sent?'sent-btn':'';send.disabled=!allowListButton(key.startsWith('today:')?'今日の予定':currentPage,'send');send.onclick=()=>{state.sent=!state.sent;send.textContent=state.sent?'送信済み':'LINE送信';send.classList.toggle('sent-btn',state.sent);card.classList.toggle('sent',state.sent&&!state.ok)};const ok=document.createElement('button');ok.textContent='確認OK';ok.className='ok-btn'+(state.ok?' is-ok':'');ok.disabled=!allowListButton(key.startsWith('today:')?'今日の予定':currentPage,'ok');ok.onclick=()=>{state.ok=!state.ok;ok.classList.toggle('is-ok',state.ok);card.classList.toggle('confirmed',state.ok);card.classList.toggle('sent',state.sent&&!state.ok)};confirmations.append(send,ok);const history=makeCardInformation(record);
const actions=document.createElement('div');actions.className='card-actions';for(const [id,label,color] of [['register','面接登録','#568DB9'],['change','日程変更','#D99A54'],['cancel','キャンセル','#CD7580'],['future','来世期待','#A65A68']]){const b=document.createElement('button');b.textContent=label;b.style.setProperty('--btn-color',color);b.disabled=!allowListButton(key.startsWith('today:')?'今日の予定':currentPage,id);b.classList.toggle('pressed',state.selected===id);b.onclick=()=>{state.selected=id;actions.querySelectorAll('button').forEach(x=>x.classList.toggle('pressed',x===b))};actions.append(b)}card.append(avatar,identity,date,confirmations,history,actions);return card}
function makeLiveLineCard(record){
 const card=document.createElement('article');card.className='applicant live-line-card unified-applicant-card';
 const avatar=document.createElement('div');avatar.className='avatar';
 if(record.picture&&/^https:\/\//.test(record.picture)){const img=document.createElement('img');img.src=record.picture;img.alt='LINEアイコン';img.referrerPolicy='no-referrer';avatar.append(img)}else avatar.textContent='LINE';
 const identity=document.createElement('div');identity.className='identity';
 const name=document.createElement('strong');name.textContent=record.name;
 const store=document.createElement('small');store.className='shop-label';store.textContent=record.shop;identity.append(name,store);applyShopTheme(store,record.shop);
 for(const el of [avatar,name]){el.tabIndex=0;el.setAttribute('role','button');el.onclick=()=>openApplicantDetail(record,'live:'+record.accountId+':'+record.lineUserId);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}}
 const date=document.createElement('div');date.className='interview-datetime';const last=document.createElement('strong');
 const caption=document.createElement('span');
 if(record.date&&record.staff){last.textContent=record.date;caption.textContent='担当：'+record.staff}
 else{last.textContent='日程未定';caption.textContent=record.lastReceived?'最終LINE：'+new Date(record.lastReceived).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'最終LINE受信なし';date.classList.add('live-date-pending')}
 date.append(last,caption);if(record.staff)applyStaffTheme(caption,record.staff);
 const controls=document.createElement('div');controls.className='confirmation-controls';
 for(const label of ['LINE送信','確認OK']){const b=document.createElement('button');b.textContent=label;b.disabled=true;controls.append(b)}
 const history=makeCardInformation(record);
 const actions=document.createElement('div');actions.className='card-actions';
 for(const [label,color] of [['面接登録','#568DB9'],['日程変更','#D99A54'],['キャンセル','#CD7580'],['来世期待','#A65A68']]){const b=document.createElement('button');b.textContent=label;b.style.setProperty('--btn-color',color);b.disabled=true;b.title='実データの操作連携は未完了です';actions.append(b)}
 card.append(avatar,identity,date,controls,history,actions);return card
}
function renderList(){
 const list=$('applicantList');list.replaceChildren();$('pageTitle').textContent=currentPage;
 if(currentPage==='LINE通知'){
  const records=lineInboxReadOnly.applicants,total=Math.max(1,Math.ceil(records.length/8));pageNumber=Math.min(Math.max(1,pageNumber),total);
  $('pageIndicator').textContent=pageNumber+' / '+total;$('pagePrev').disabled=pageNumber===1;$('pageNext').disabled=pageNumber===total;
  records.slice((pageNumber-1)*8,pageNumber*8).forEach(record=>list.append(makeLiveLineCard(record)));
  const labels={idle:'LINE受信データを準備しています',loading:'LINE受信データを更新中',ready:records.length?'LINE受信データを表示中（約30秒ごとに更新）':'LINE受信データは0件です',error:'LINE受信データの取得に失敗しました。接続または認証状態をご確認ください。', 'login-required':'面接管理のログイン情報が見つかりません。既存の面接管理ページでログインしてから、このページを再読み込みしてください。'};
  $('listNote').textContent=labels[lineInboxReadOnly.status]||'';return;
 }
 const records=applicantData[currentPage]?.length?applicantData[currentPage]:Array.from({length:8},(_,i)=>({...testExamples[i%testExamples.length],name:i<4?testExamples[i].name:testExamples[i%testExamples.length].name+'（テスト'+(i+1)+'）'}));
 const total=Math.max(1,Math.ceil(records.length/8));pageNumber=Math.min(Math.max(1,pageNumber),total);$('pageIndicator').textContent=pageNumber+' / '+total;$('pagePrev').disabled=pageNumber===1;$('pageNext').disabled=pageNumber===total;records.slice((pageNumber-1)*8,pageNumber*8).forEach((record,i)=>list.append(makeTestCard(record,currentPage+':'+((pageNumber-1)*8+i))));$('listNote').textContent=''
}
function renderTodayTest(){const el=$('todayTestList');el.replaceChildren();Array.from({length:8},(_,i)=>({...testExamples[i%testExamples.length],name:i<4?testExamples[i].name:testExamples[i%testExamples.length].name+'（テスト'+(i+1)+'）'})).forEach((record,i)=>el.append(makeTestCard(record,'today:'+i)))}
function showHome(){ $('applicantDetail').hidden=true;detailReturn=null;$('todayPanel').hidden=false;$('sharedPanel').hidden=true;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page==='今日の予定'));$('todayDate').textContent=dateKey(now)}function showCommon(page){$('applicantDetail').hidden=true;detailReturn=null;currentPage=page;pageNumber=1;$('todayPanel').hidden=true;$('sharedPanel').hidden=false;renderList()}const $=id=>document.getElementById(id),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function renderCalendar(){const y=monthView.getFullYear(),m=monthView.getMonth();$('month').textContent=y+'年 '+String(m+1).padStart(2,'0')+'月';const days=$('days');days.replaceChildren();const offset=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++){const b=document.createElement('button');b.className='empty';b.disabled=true;days.append(b)}for(let d=1;d<=count;d++){const day=new Date(y,m,d),b=document.createElement('button');b.textContent=d;b.className=[day.getDay()===0||day.getDay()===6?'weekend':'',dateKey(day)===dateKey(now)?'today':'',dateKey(day)===dateKey(selected)?'selected':''].join(' ');b.disabled=day<now;b.onclick=()=>{selected=day;chosen=null;renderCalendar();renderChart()};days.append(b)}}
function holiday(d){const y=d.getFullYear(),m=d.getMonth()+1,n=d.getDate(),nth=(mo,k)=>1+(8-new Date(y,mo-1,1).getDay())%7+7*(k-1);const spring=Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)),autumn=Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));const base=new Set(['1-1','2-11','2-23','4-29','5-3','5-4','5-5','8-11','11-3','11-23','3-'+spring,'9-'+autumn,'1-'+nth(1,2),'7-'+nth(7,3),'9-'+nth(9,3),'10-'+nth(10,2)]),days=new Set(),len=Math.round((new Date(y+1,0,1)-new Date(y,0,1))/86400000);for(let i=0;i<len;i++){const t=new Date(y,0,i+1);if(base.has((t.getMonth()+1)+'-'+t.getDate()))days.add(i)}for(const i of [...days]){if(new Date(y,0,i+1).getDay()===0){let j=i+1;while(days.has(j))j++;days.add(j)}}for(let i=1;i<len-1;i++){if(!days.has(i)&&days.has(i-1)&&days.has(i+1))days.add(i)}return days.has(Math.round((d-new Date(y,0,1))/86400000))}
function renderChart(){ $('selectedDate').textContent=dateKey(selected);$('selectedDate').className='chart-date '+(selected.getDay()===0||holiday(selected)?'holiday':selected.getDay()===6?'saturday':'');const grid=$('chartGrid');grid.replaceChildren();const corner=document.createElement('span');grid.append(corner);for(let i=0;i<28;i++){const t=document.createElement('span');t.className='time-label';t.textContent=String(10+Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00');grid.append(t)}for(const staff of ['社長','オオタ','村上','お祭り']){const label=document.createElement('span');label.className='staff-label';label.textContent=staff;applyStaffTheme(label,staff);grid.append(label);for(let i=0;i<28;i++){const hour=10+Math.floor(i/2),minute=i%2?30:0;const b=document.createElement('button');const passed=dateKey(selected)===dateKey(now)&&(hour<new Date().getHours()||(hour===new Date().getHours()&&minute<new Date().getMinutes()));b.className='slot'+(passed?' blocked':'');if(!passed)applyStaffTheme(b,staff);b.disabled=passed;b.title=staff+' '+String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');if(chosen===b.title)b.classList.add('chosen');b.onclick=()=>{chosen=b.title;$('slotStatus').textContent='選択：'+dateKey(selected)+' '+chosen;renderChart()};grid.append(b)}}}
$('prev').onclick=()=>{monthView=new Date(monthView.getFullYear(),monthView.getMonth()-1,1);renderCalendar()};$('next').onclick=()=>{monthView=new Date(monthView.getFullYear(),monthView.getMonth()+1,1);renderCalendar()};
$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;if(b.dataset.page==='今日の予定'){showHome();return}document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));showCommon(b.dataset.page);if(b.dataset.page==='LINE通知')refreshLineInboxReadOnly()};
$('headerLineInbox').onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page==='LINE通知'));showCommon('LINE通知');refreshLineInboxReadOnly()};
$('home').onclick=()=>{showHome();selected=new Date(now);monthView=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();renderChart()};
$('sound').onclick=async()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('非対応');const ctx=new C();await ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close();alert('通知テスト音を再生しました。聞こえない場合はPCの音量・ブラウザ設定を確認してください。')}catch(e){alert('通知音の再生に失敗しました：'+e.message)}};
$('detailBack').onclick=closeApplicantDetail;
$('pagePrev').onclick=()=>{pageNumber--;renderList()};$('pageNext').onclick=()=>{pageNumber++;renderList()};renderCalendar();renderChart();renderList();renderTodayTest();showHome();
refreshLineInboxReadOnly();setInterval(()=>{if(!document.hidden&&lineInboxReadOnly.status!=='loading')refreshLineInboxReadOnly()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshLineInboxReadOnly()});
</script></body></html>
