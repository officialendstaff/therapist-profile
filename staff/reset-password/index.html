<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード再設定｜末端興業</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#191310;color:#2a211b;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 40px));box-sizing:border-box;background:#fff;border-radius:16px;padding:26px}h1{font-size:21px}label{display:block;margin:18px 0 6px;font-weight:bold;font-size:14px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;font-size:16px}input{border:1px solid #bbb}button{margin-top:18px;border:0;background:#ac7d30;color:#fff;font-weight:bold}button:disabled{opacity:.5}p{line-height:1.7}#msg{font-size:14px;overflow-wrap:anywhere}a{color:#79531b}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="card"><h1>パスワード再設定</h1><p id="msg">再設定リンクを確認しています…</p><form id="form" hidden><label for="pw">新しいパスワード（12文字以上）</label><input id="pw" type="password" autocomplete="new-password" minlength="12" required><label for="pw2">確認用パスワード</label><input id="pw2" type="password" autocomplete="new-password" minlength="12" required><button id="save">パスワードを変更</button></form><p><a href="../admin/">末端興業の管理ページへ戻る</a></p></main><script>const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',{auth:{detectSessionInUrl:true}});const msg=document.getElementById('msg'),form=document.getElementById('form');let ready=false;function showReady(){ready=true;form.hidden=false;msg.textContent='新しいパスワードを入力してください。'}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showReady()});(async()=>{const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);if(hash.get('error')||query.get('error')){msg.textContent='リンクが無効か期限切れです。新しい再設定メールを発行してください。';return}if(query.get('code')){const {error}=await sb.auth.exchangeCodeForSession(query.get('code'));if(error){msg.textContent='リンクを確認できませんでした。再設定メールを再発行してください。';return}showReady();return}if(hash.get('access_token')&&hash.get('refresh_token')){const {error}=await sb.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(error){msg.textContent='リンクを確認できませんでした。再設定メールを再発行してください。';return}showReady();return}setTimeout(()=>{if(!ready)msg.textContent='再設定リンクからこのページを開いてください。'},1600)})();form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('pw').value;if(p!==document.getElementById('pw2').value){msg.textContent='確認用パスワードが一致しません。';return}if(p.length<12){msg.textContent='12文字以上で入力してください。';return}const btn=document.getElementById('save');btn.disabled=true;const {error}=await sb.auth.updateUser({password:p});btn.disabled=false;if(error){msg.textContent='変更できませんでした：'+error.message;return}form.hidden=true;msg.textContent='パスワードを変更しました。管理ページから新しいパスワードでログインしてください。';await sb.auth.signOut()});</script></body></html>
