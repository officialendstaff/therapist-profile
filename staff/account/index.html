<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>L GROUP｜スタッフアカウント</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f5f7;color:#202936;margin:0;padding:24px 12px}
main{max-width:450px;margin:30px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 28px #1d273010}
h1{font-size:22px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#546174}label{display:block;font-size:13px;font-weight:650;margin:16px 0 6px}
input{width:100%;padding:13px 12px;border:1px solid #bbc4cf;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;background:#203b61;color:white;padding:13px 16px;font-size:15px;font-weight:650;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px;margin-top:20px}.row button{flex:1}.secondary{background:#edf0f4;color:#273d57}
#message{min-height:25px;color:#8d2b36;margin-top:15px;white-space:pre-wrap;font-size:13px}
#account{display:none}.small{font-size:12px}
</style></head><body><main>
<h1>スタッフアカウント</h1><p>事前に設定された権限付きの招待URLからID・PASSを登録すると、登録完了後すぐにログインできます。</p>
<section id="form">
<div id="nameBox" hidden><label for="displayName">スタッフ表示名</label><input id="displayName" maxlength="50" autocomplete="name"></div>
<label for="email">ログインID（メールアドレス）</label><input id="email" type="email" autocomplete="username" maxlength="254">
<label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128">
<div id="confirmBox" hidden><label for="confirm">パスワード確認</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div>
<div class="row"><button id="submit" type="button">ログイン</button></div>
</section>
<section id="account"><p id="accountName"></p><p id="accountRole"></p><div class="row"><button id="logout" class="secondary" type="button">ログアウト</button></div></section>
<div id="message" role="status" aria-live="polite"></div><div id="loginLink" hidden style="margin-top:15px"><a href="https://officialendstaff.github.io/therapist-profile/staff/account/" style="display:block;text-align:center;background:#203b61;color:#fff;text-decoration:none;padding:14px;border-radius:9px;font-weight:700">ログイン画面を開く</a></div>
<p class="small">個別アカウントの登録・認証ページです。面接管理・チャット管理の切り替えが完了するまでは、現在の管理画面とログイン方法は変更されません。</p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const url='https://vjjnkflbfsjihwzjsjpr.supabase.co',key='sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos';
const db=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:sessionStorage,storageKey:'lgroup-staff-personal-auth'}});
const $=id=>document.getElementById(id),message=$('message'),invite=new URL(location.href).searchParams.get('invite');
const registering=!!invite;
if(registering){$('nameBox').hidden=false;$('confirmBox').hidden=false;$('submit').textContent='申請して利用開始';$('password').autocomplete='new-password'}
function tell(t){message.textContent=t}
async function who(){
 const {data:{user},error}=await db.auth.getUser();if(error||!user){$('account').style.display='none';$('form').style.display='';return}
 const {data:profile,error:pe}=await db.from('recruit_staff_profiles').select('display_name,role,approved_at').eq('user_id',user.id).maybeSingle();
 $('form').style.display='none';$('account').style.display='block';$('accountName').textContent=(profile?.display_name||'スタッフ')+'（'+user.email+'）';
 $('accountRole').textContent=pe?'権限確認ができません。':!profile?'スタッフ登録が見つかりません。':!profile.approved_at?'旧招待で登録された承認待ちアカウントです。新しい権限付き招待URLから申請してください。':'アカウント認証済み・利用可能';
}
async function registerNew(){
 const email=$('email').value.trim().toLowerCase(),password=$('password').value; 
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||password.length<12||password.length>128){tell('メールアドレスと12文字以上のパスワードを入力してください。');return}
 $('submit').disabled=true;tell('確認中です。');
 try{
 if(registering){
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(invite)){tell('招待URLが無効です。');return}
  if(password!==$('confirm').value){tell('確認用パスワードが一致しません。');return}
  const displayName=$('displayName').value.trim();if(!displayName){tell('スタッフ表示名を入力してください。');return}
  const resp=await fetch(url+'/functions/v1/recruit-staff-register',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({token:invite,email,password,displayName}),cache:'no-store'});
  const body=await resp.json().catch(()=>({}));tell(body.message||'登録処理を確認できませんでした。');
  if(resp.ok){$('submit').disabled=true;$('password').value='';$('confirm').value='';$('loginLink').hidden=false}
 }else{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error||!data?.user){tell('ログインできません。ID・パスワードをご確認ください。');return}
  $('password').value='';tell('');await who();
 }
 }catch{tell('通信に失敗しました。再度お試しください。')}finally{$('submit').disabled=false}
}
$('submit').onclick=registerNew;
$('logout').onclick=async()=>{await db.auth.signOut();tell('ログアウトしました。');await who()};
if(!registering)void who();
})();
</script></body></html>
