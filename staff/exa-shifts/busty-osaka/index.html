<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){"use strict";
const $=id=>document.getElementById(id);
const BASE="https://vjjnkflbfsjihwzjsjpr.supabase.co",KEY="sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos";
const client=window.supabase?.createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,storageKey:"mattan-recruit-auth"}});
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
let month=today().slice(0,7),selected=today(),staffView="real",therapists=[],shifts=[],performances=[],historyPerformances=[],futureShifts=[],authorized=false;
const fmtDate=n=>month+"-"+String(n).padStart(2,"0");
const daysIn=()=>new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shiftTime=x=>{const h=Math.floor(x/60),m=x%60,v=h>=24?h-24:h;return m===30?v+".5":m===0?String(h===24?24:v):v+":"+String(m).padStart(2,"0")};

const holidays=new Set(("2026-01-01 2026-01-12 2026-02-11 2026-02-23 2026-03-20 2026-04-29 2026-05-03 2026-05-04 2026-05-05 2026-05-06 2026-07-20 2026-08-11 2026-09-21 2026-09-22 2026-09-23 2026-10-12 2026-11-03 2026-11-23 2027-01-01 2027-01-11 2027-02-11 2027-02-23 2027-03-21 2027-03-22 2027-04-29 2027-05-03 2027-05-04 2027-05-05 2027-07-19 2027-08-11 2027-09-20 2027-09-23 2027-10-11 2027-11-03 2027-11-23").split(" "));
const dayType=d=>holidays.has(d)?"holiday":new Date(d+"T00:00:00Z").getUTCDay()===0?"sunday":new Date(d+"T00:00:00Z").getUTCDay()===6?"saturday":"weekday";
const outside=t=>!futureShifts.some(s=>s.exa_id===t.exa_id&&s.work_date>=today()&&!s.is_dummy_shift&&!s.is_pre_off);
function showMsg(message,error=false){$("message").textContent=message;$("message").className=error?"error":"muted";}
function renderMonthly(){
 const byId=new Map(),activeIds=new Set(therapists.map(t=>t.exa_id));
 for(const s of shifts){if(!byId.has(s.exa_id))byId.set(s.exa_id,new Map());byId.get(s.exa_id).set(s.work_date,s)}
 const real=therapists.filter(t=>t.operating_category!=="dummy_use"&&t.operating_category!=="not_used").sort((a,b)=>Number(byId.has(b.exa_id))-Number(byId.has(a.exa_id))||a.exa_id-b.exa_id);
 const dummy=therapists.filter(t=>t.operating_category==="dummy_use").sort((a,b)=>a.exa_id-b.exa_id);
 const per=new Map(performances.map(p=>[p.exa_id+"|"+p.work_date,p.customer_count]));
 const absent=new Set(performances.filter(p=>p.attendance_status==="absent").map(p=>p.exa_id+"|"+p.work_date));
 const counts=new Map();
 for(let n=1;n<=daysIn();n++){
  const d=fmtDate(n),ss=shifts.filter(x=>x.work_date===d&&activeIds.has(x.exa_id));
  const r=ss.filter(x=>!x.is_dummy_shift&&therapists.find(t=>t.exa_id===x.exa_id)?.operating_category!=="dummy_use").length;
  counts.set(d,{real:r,dummy:ss.length-r,all:ss.length});
 }
 let html='<thead><tr><th class="staff-heading" rowspan="2"><span>'+(staffView==="real"?"実働（"+real.length+"名）":staffView==="dummy"?"ダミー（"+dummy.length+"名）":"実働（"+real.length+"名）／ダミー（"+dummy.length+"名）")+'</span></th>';
 if(staffView==="dummy")html+='<th class="stat-heading" rowspan="2">登録曜日</th><th class="stat-heading" rowspan="2">出勤</th><th class="stat-heading" rowspan="2">退勤</th>';
 else html+='<th class="stat-heading" rowspan="2">稼働</th><th class="stat-heading" rowspan="2">出勤</th><th class="stat-heading" rowspan="2">無報</th><th class="stat-heading" rowspan="2">評価</th>';
 for(let n=1;n<=daysIn();n++){const d=fmtDate(n);html+='<th class="day-heading '+dayType(d)+(d===today()?" today-marker":"")+'"><button type="button" data-day="'+d+'">'+n+'日</button></th>'}
 html+='</tr><tr class="daily-totals">';
 for(let n=1;n<=daysIn();n++){const d=fmtDate(n);html+='<th class="day-total '+dayType(d)+(d===today()?" today-marker":"")+'">'+counts.get(d)[staffView]+'人</th>'}
 html+='</tr></thead><tbody>';
 for(const [title,people,group] of [["実働",real,"real"],["ダミー",dummy,"dummy"]]){
  if(staffView!=="all"&&staffView!==group)continue;
  if(staffView==="all")html+='<tr class="group"><td colspan="'+(daysIn()+5)+'">'+title+'（'+people.length+'名）</td></tr>';
  for(const person of people){
   const entries=byId.get(person.exa_id)||new Map(),history=historyPerformances.filter(p=>p.exa_id===person.exa_id&&p.attendance_status!=="absent");
   const avg=history.length?(history.reduce((sum,p)=>sum+(Number(p.customer_count)||0),0)/history.length).toFixed(1):"—";
   const dates=[...entries.values()].filter(x=>!x.is_dummy_shift),future=outside(person),last=dates.length?dates.map(x=>x.work_date).sort().at(-1):null;
   const name=String(person.stage_name||"ID "+person.exa_id),match=name.match(/^(.+?)-([^-]+)-$/),display=match?match[1]:name,kana=match?match[2]:"";
   html+='<tr class="'+(future&&group==="real"?"outside-roster":"")+'"><td class="staff-name"><span class="readonly-name">'+esc(display)+'</span><span class="staff-exa-id">ID '+person.exa_id+'</span>'+(kana?'<span class="reading">'+esc(kana)+'</span>':"")+(future&&group==="real"?'<span class="outside-label">実働外</span>':"")+'</td>';
   if(group==="dummy"){
    const futureEntries=futureShifts.filter(x=>x.exa_id===person.exa_id);const weekdays=[...new Set(futureEntries.map(x=>new Date(x.work_date+"T00:00:00Z").getUTCDay()))].sort();
    const names=["日","月","火","水","木","金","土"];
    const times=[...new Set(futureEntries.map(x=>x.start_minutes+"/"+x.end_minutes))];
    html+='<td class="stat-cell weekday-cell">'+(weekdays.length?weekdays.map(x=>names[x]).join("・"):"—")+'</td><td class="stat-cell">'+(times.length===1?esc(shiftTime(futureEntries[0].start_minutes)):"—")+'</td><td class="stat-cell">'+(times.length===1?esc(shiftTime(futureEntries[0].end_minutes)):"—")+'</td>';
   }else{
    const zeros=performances.filter(p=>p.exa_id===person.exa_id&&p.customer_count===0&&p.attendance_status!=="absent").length;
    const evalScore=Number(person.evaluation_score),score=person.evaluation_score==null?"—":evalScore.toFixed(1);
    html+='<td class="stat-cell"><strong>'+avg+'</strong></td><td class="stat-cell">'+dates.length+'</td><td class="stat-cell '+(zeros?"unpaid-positive":"")+'">'+zeros+'</td><td class="stat-cell '+(person.evaluation_score==null?"":evalScore>=95?"score-high":"score-low")+'">'+score+'</td>';
   }
   for(let n=1;n<=daysIn();n++){
    const d=fmtDate(n),s=entries.get(d),past=d<today();const classes=[group==="dummy"?"dummy":"",d===today()?"today":"",dayType(d),last===d?"last-scheduled":"",future?"outside-cell":""].filter(Boolean).join(" ");
    const k=person.exa_id+"|"+d;

 }
 html+='</tbody>';$("monthly").innerHTML=html;
 $("monthly").classList.toggle("dummy-layout",staffView==="dummy");

 const names=new Map(therapists.map(t=>[t.exa_id,t.stage_name]));

async function load(){
 if(!authorized)return;showMsg("Supabaseを読み込み中…");
 const start=fmtDate(1),end=fmtDate(daysIn());
 const [a,b,c,history,future]=await Promise.all([
 client.from("exa_shift_therapists").select("exa_id,stage_name,residency,operating_category,evaluation_score").eq("store_code","busty"),
 client.from("exa_shift_entries").select("exa_id,work_date,start_minutes,end_minutes,is_dummy_shift,is_pre_off").eq("store_code","busty").gte("work_date",start).lte("work_date",end).order("work_date"),
 client.from("exa_shift_performance").select("exa_id,work_date,customer_count,attendance_status").eq("store_code","busty").gte("work_date",start).lte("work_date",end),
 client.from("exa_shift_performance").select("exa_id,work_date,customer_count,attendance_status").eq("store_code","busty").lt("work_date",today()).limit(5000),
 client.from("exa_shift_entries").select("exa_id,work_date,start_minutes,end_minutes,is_dummy_shift,is_pre_off").eq("store_code","busty").order("work_date").limit(5000)
 ]);
 const err=[a,b,c,history,future].find(x=>x.error)?.error;if(err){showMsg("読み込みエラー："+err.message,true);return}

 $("monthLabel").textContent=month.replace("-","年")+"月";showMsg("");renderMonthly();renderDay();
}

 if(!session){$("login").classList.remove("hide");$("app").classList.add("hide");return}
