<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>管理アカウント登録</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#eaf0f8;background:#10151d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#253950 0,#10151d 48%);padding:26px 16px 70px}.wrap{max-width:480px;margin:auto}.brand{text-align:center;margin:18px 0 30px;letter-spacing:.16em;color:#d6b87d;font-weight:800;font-size:14px}.brand small{display:block;font-size:10px;letter-spacing:.3em;color:#98a8b9;margin-top:8px}.card{background:#1a2430;border:1px solid #334354;border-radius:18px;padding:26px 20px;box-shadow:0 18px 45px #0005}.eyebrow{color:#d6b87d;font-size:11px;letter-spacing:.15em;font-weight:800}.title{font-size:25px;line-height:1.45;margin:9px 0 8px}.desc{color:#afbdca;font-size:13px;line-height:1.85;margin:0 0 22px}.permissions{background:#121b25;border:1px solid #354354;border-radius:12px;padding:15px;margin-bottom:24px}.permissions strong{font-size:13px}.permissions .chip{display:inline-block;padding:6px 10px;border:1px solid #526276;border-radius:30px;margin:10px 5px 0 0;color:#d4e0ed;font-size:11px}.permissions .empty{font-size:12px;color:#aebac6;margin:10px 0 0}label{display:block;margin:16px 0 7px;font-size:13px;font-weight:700}input{width:100%;padding:14px 13px;background:#0f1822;border:1px solid #48566a;color:#fff;border-radius:10px;font-size:16px}input:focus{outline:2px solid #bca06d;outline-offset:1px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#c6a46c;color:#1b1a18;font-weight:900;font-size:15px;margin-top:23px}button:disabled{opacity:.5;cursor:not-allowed}.note{font-size:12px;color:#91a2b3;line-height:1.8;margin:18px 0 0}.notice{background:#2e261b;border:1px solid #806b45;color:#ebd7a7;padding:12px;border-radius:10px;font-size:12px;line-height:1.7;margin-bottom:20px}.error{background:#42262a;border:1px solid #99545c;color:#ffd6d6;padding:14px;border-radius:10px;line-height:1.7;font-size:13px}.hide{display:none}.footer{text-align:center;color:#72869b;font-size:11px;margin-top:26px}</style></head>
<body><main class="wrap"><div class="brand">L GROUP<small>STAFF ACCOUNT INVITATION</small></div><section class="card"><div class="eyebrow">STAFF REGISTRATION</div><h1 class="title">管理アカウント登録</h1><form id="inviteForm"><label for="displayName">表示名（あだ名でも可）</label><input id="displayName" maxlength="50" autocomplete="nickname" placeholder="例：山ちゃん" required><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="new-password" placeholder="8文字以上" minlength="8" required><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" placeholder="もう一度入力" minlength="8" required><p id="formError" class="error hide" role="alert"></p><button type="submit">登録する</button><button type="button" id="finishRegistration" style="margin-top:12px;background:#33475c;color:#fff">メール認証済みの方はこちら</button></form></section><div class="footer">L GROUP ｜ RECRUIT MANAGEMENT</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',{auth:{persistSession:true,storage:sessionStorage,storageKey:'mattan-recruit-auth'}});
const params=new URLSearchParams(location.search),token=params.get('token');const errorEl=document.getElementById('formError');function show(message,ok=false){errorEl.textContent=message;errorEl.classList.remove('hide');errorEl.style.background=ok?'#1b392f':'#42262a'}
document.getElementById('inviteForm').addEventListener('submit',async e=>{e.preventDefault();const displayName=document.getElementById('displayName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,button=e.target.querySelector('button');if(!displayName)return show('表示名を入力してください。');if(!document.getElementById('email').validity.valid)return show('正しいメールアドレスを入力してください。');if(password.length<8)return show('パスワードは8文字以上で入力してください。');if(password!==confirm)return show('パスワードが一致していません。');if(!token||!/^[0-9a-f-]{36}$/i.test(token))return show('有効な招待URLから開いてください。');sessionStorage.setItem('recruit-pending-name-'+token,displayName);button.disabled=true;try{const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname+'?token='+encodeURIComponent(token),data:{recruit_display_name:displayName,recruit_invite_token:token}}});if(error)throw error;if(data.session){const claimed=await sb.rpc('recruit_claim_invite',{p_token:token,p_display_name:displayName});if(claimed.error)throw claimed.error;sessionStorage.removeItem('recruit-pending-name-'+token);show('登録申請を受け付けました。管理者の承認をお待ちください。',true)}else{show('確認メールを送信しました。メールのリンクを開くと登録申請が完了します。',true)}}catch(err){show('登録できませんでした：'+(err.message||String(err)))}finally{button.disabled=false}});
document.getElementById('finishRegistration').addEventListener('click',async()=>{const displayName=document.getElementById('displayName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!displayName||!email||!password)return show('表示名・メールアドレス・パスワードを入力してください。');if(!token)return show('招待URLから開いてください。');const {error:loginError}=await sb.auth.signInWithPassword({email,password});if(loginError)return show('ログインできません：'+loginError.message);const {error}=await sb.rpc('recruit_claim_invite',{p_token:token,p_display_name:displayName});if(error)return show('登録申請を完了できません：'+error.message);sessionStorage.removeItem('recruit-pending-name-'+token);show('登録申請が完了しました。管理者の承認をお待ちください。',true)});
async function completeConfirmedInvite(){
 if(!token)return;
 const {data:{session},error:sessionError}=await sb.auth.getSession();
 if(sessionError||!session)return;
 const name=session.user.user_metadata?.recruit_display_name||sessionStorage.getItem('recruit-pending-name-'+token)||'スタッフ';
 const {error}=await sb.rpc('recruit_claim_invite',{p_token:token,p_display_name:name});
 if(error){show('メール認証は完了しましたが、登録申請を完了できませんでした：'+error.message);return}
 sessionStorage.removeItem('recruit-pending-name-'+token);
 document.getElementById('inviteForm').classList.add('hide');
 show('登録申請が完了しました。管理者の承認をお待ちください。',true);
}
(async()=>{if(!token)return;await completeConfirmedInvite()})();
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'){setTimeout(()=>{completeConfirmedInvite()},0)}});
</script></body></html>
