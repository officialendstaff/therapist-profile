<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>管理アカウント登録</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#eaf0f8;background:#10151d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#253950 0,#10151d 48%);padding:26px 16px 70px}.wrap{max-width:480px;margin:auto}.brand{text-align:center;margin:18px 0 30px;letter-spacing:.16em;color:#d6b87d;font-weight:800;font-size:14px}.brand small{display:block;font-size:10px;letter-spacing:.3em;color:#98a8b9;margin-top:8px}.card{background:#1a2430;border:1px solid #334354;border-radius:18px;padding:26px 20px;box-shadow:0 18px 45px #0005}.eyebrow{color:#d6b87d;font-size:11px;letter-spacing:.15em;font-weight:800}.title{font-size:25px;line-height:1.45;margin:9px 0 8px}.desc{color:#afbdca;font-size:13px;line-height:1.85;margin:0 0 22px}.permissions{background:#121b25;border:1px solid #354354;border-radius:12px;padding:15px;margin-bottom:24px}.permissions strong{font-size:13px}.permissions .chip{display:inline-block;padding:6px 10px;border:1px solid #526276;border-radius:30px;margin:10px 5px 0 0;color:#d4e0ed;font-size:11px}.permissions .empty{font-size:12px;color:#aebac6;margin:10px 0 0}label{display:block;margin:16px 0 7px;font-size:13px;font-weight:700}input{width:100%;padding:14px 13px;background:#0f1822;border:1px solid #48566a;color:#fff;border-radius:10px;font-size:16px}input:focus{outline:2px solid #bca06d;outline-offset:1px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#c6a46c;color:#1b1a18;font-weight:900;font-size:15px;margin-top:23px}button:disabled{opacity:.5;cursor:not-allowed}.note{font-size:12px;color:#91a2b3;line-height:1.8;margin:18px 0 0}.notice{background:#2e261b;border:1px solid #806b45;color:#ebd7a7;padding:12px;border-radius:10px;font-size:12px;line-height:1.7;margin-bottom:20px}.error{background:#42262a;border:1px solid #99545c;color:#ffd6d6;padding:14px;border-radius:10px;line-height:1.7;font-size:13px}.hide{display:none}.footer{text-align:center;color:#72869b;font-size:11px;margin-top:26px}</style></head>
<body><main class="wrap"><div class="brand">L GROUP<small>STAFF ACCOUNT INVITATION</small></div><section class="card"><div class="eyebrow">STAFF REGISTRATION</div><h1 class="title">管理アカウント登録</h1><form id="inviteForm"><label for="displayName">表示名（あだ名でも可）</label><input id="displayName" maxlength="50" autocomplete="nickname" placeholder="例：山ちゃん" required><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="new-password" placeholder="8文字以上" minlength="8" required><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" placeholder="もう一度入力" minlength="8" required><p id="formError" class="error hide" role="alert"></p><button type="submit">登録する</button><button type="button" id="forgotPassword" style="margin-top:12px;background:transparent;color:#c6a46c;border:1px solid #526276">パスワードを忘れた場合</button></form></section>
<section class="card hide" id="accessPanel" style="margin-top:16px"><h2 style="font-size:18px;margin:0 0 12px">求人管理へのアクセス</h2><p id="accessStatus" class="desc">登録したメールアドレスとパスワードでログインしてください。</p><form id="accessLogin"><label for="accessEmail">メールアドレス</label><input id="accessEmail" type="email" autocomplete="username" required><label for="accessPassword">パスワード</label><input id="accessPassword" type="password" autocomplete="current-password" required><button type="submit">ログインして承認状況を確認</button></form><button type="button" id="checkAccess" class="hide">承認状況を確認</button><button type="button" id="openRecruit" class="hide">求人管理へ進む</button><button type="button" id="accessSignOut" class="hide" style="background:transparent;color:#c6a46c;border:1px solid #526276">別のアカウントでログイン</button></section><div class="footer">L GROUP ｜ RECRUIT MANAGEMENT</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',{auth:{persistSession:true,storage:sessionStorage,storageKey:'mattan-recruit-auth'}});
const params=new URLSearchParams(location.search),token=params.get('token');const errorEl=document.getElementById('formError');function show(message,ok=false){errorEl.textContent=message;errorEl.classList.remove('hide');errorEl.style.background=ok?'#1b392f':'#42262a'}
document.getElementById('inviteForm').addEventListener('submit',async e=>{e.preventDefault();const displayName=document.getElementById('displayName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,button=e.target.querySelector('button');if(!displayName)return show('表示名を入力してください。');if(!document.getElementById('email').validity.valid)return show('正しいメールアドレスを入力してください。');if(password.length<8)return show('パスワードは8文字以上で入力してください。');if(password!==confirm)return show('パスワードが一致していません。');if(!token||!/^[0-9a-f-]{36}$/i.test(token))return show('有効な招待URLから開いてください。');button.disabled=true;try{
 const response=await fetch('https://vjjnkflbfsjihwzjsjpr.supabase.co/functions/v1/recruit-staff-register',{
  method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos'},
  body:JSON.stringify({token,displayName,email,password})
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(result.message||'登録申請に失敗しました。');
 document.getElementById('inviteForm').classList.add('hide');
 show('登録申請が完了しました。マスターの承認をお待ちください。',true);
 document.getElementById('accessEmail').value=email;
 document.getElementById('accessPanel').classList.remove('hide');
}catch(err){show('登録できませんでした：'+(err.message||String(err)))}finally{button.disabled=false}});

document.getElementById('forgotPassword').addEventListener('click',async()=>{
 const email=document.getElementById('email').value.trim();
 if(!email||!document.getElementById('email').validity.valid)return show('メールアドレスを入力してから押してください。');
 const button=document.getElementById('forgotPassword');button.disabled=true;
 try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?token='+encodeURIComponent(token||'')+'&reset=1'});if(error)throw error;show('パスワード再設定メールを送信しました。メールをご確認ください。',true)}
 catch(error){show('再設定メールを送信できませんでした：'+(error.message||String(error)))}finally{button.disabled=false}
});
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(()=>{showResetPasswordForm()},0);});
function showResetPasswordForm(){
 if(document.getElementById('resetPasswordForm'))return;
 document.getElementById('inviteForm').classList.add('hide');
 const form=document.createElement('form');form.id='resetPasswordForm';
 form.innerHTML='<label for="newPassword">新しいパスワード</label><input id="newPassword" type="password" minlength="8" required placeholder="8文字以上"><label for="newPasswordConfirm">パスワード確認</label><input id="newPasswordConfirm" type="password" minlength="8" required placeholder="もう一度入力"><button type="submit">パスワードを再設定する</button>';
 document.getElementById('inviteForm').after(form);
 form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('newPassword').value;if(password!==document.getElementById('newPasswordConfirm').value)return show('パスワードが一致していません。');const {error}=await sb.auth.updateUser({password});if(error)return show('パスワードを変更できませんでした：'+error.message);form.classList.add('hide');show('パスワードを再設定しました。',true)});
}


const accessPanel=document.getElementById('accessPanel');
const accessLogin=document.getElementById('accessLogin');
const checkAccess=document.getElementById('checkAccess');
const openRecruit=document.getElementById('openRecruit');
const accessSignOut=document.getElementById('accessSignOut');
const accessStatus=document.getElementById('accessStatus');
const recruitUrl=location.origin+'/therapist-profile/staff/recruit-line/';
async function refreshAccess(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){accessLogin.classList.remove('hide');checkAccess.classList.add('hide');openRecruit.classList.add('hide');accessSignOut.classList.add('hide');return;}
 accessLogin.classList.add('hide');accessSignOut.classList.remove('hide');checkAccess.classList.remove('hide');
 const {data,error}=await sb.from('recruit_staff_profiles').select('role').eq('user_id',user.id).maybeSingle();
 if(error){accessStatus.textContent='承認状況を取得できませんでした。再度確認してください。';openRecruit.classList.add('hide');return;}
 if(!data){accessStatus.textContent='求人管理の登録情報が見つかりません。';openRecruit.classList.add('hide');return;}
 if(data.role==='pending'){accessStatus.textContent='現在、マスターの承認待ちです。承認後に「承認状況を確認」を押してください。';openRecruit.classList.add('hide');}
 else if(data.role==='disabled'){accessStatus.textContent='このアカウントは利用停止中です。';openRecruit.classList.add('hide');}
 else if(['master','full','custom'].includes(data.role)){accessStatus.textContent='承認済みです。求人管理ページへ進めます。';openRecruit.classList.remove('hide');}
 else {accessStatus.textContent='権限設定を確認できませんでした。';openRecruit.classList.add('hide');}
}
accessLogin.addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('accessEmail').value.trim(),password:document.getElementById('accessPassword').value});if(error)throw error;await refreshAccess();}catch(err){accessStatus.textContent='ログインできませんでした：'+(err.message||String(err));}finally{button.disabled=false;}});
checkAccess.addEventListener('click',refreshAccess);
openRecruit.addEventListener('click',()=>{location.href=recruitUrl;});
accessSignOut.addEventListener('click',async()=>{await sb.auth.signOut();accessStatus.textContent='登録したアカウントでログインしてください。';refreshAccess();});
(async()=>{if(params.has('reset'))return;accessPanel.classList.remove('hide');const {data:{user}}=await sb.auth.getUser();if(user){document.getElementById('inviteForm').classList.add('hide');await refreshAccess();}})();
</script></body></html>
