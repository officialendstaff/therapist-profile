<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人LINE管理｜L GROUP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#e8eaf0;background:#10151d}*{box-sizing:border-box}body{margin:0}header{padding:17px 16px;background:#1c2632;border-bottom:1px solid #354252}h1{font-size:18px;margin:0}small,.muted{color:#a8b4c2}.wrap{max-width:860px;margin:auto;padding:16px}.panel{background:#1c2632;border:1px solid #354252;border-radius:14px;padding:15px;margin-bottom:13px}input,select,textarea,button{font:inherit;border-radius:9px;padding:12px}input,select,textarea{width:100%;background:#0f1722;color:white;border:1px solid #4b5968;margin:5px 0 12px}button{border:0;background:#cba35d;color:#171a1f;font-weight:700;cursor:pointer}button.secondary{background:#334355;color:white}button:disabled{opacity:.5}nav{display:flex;gap:8px;margin:12px 0}nav button{flex:1}.hide{display:none!important}.item{display:block;width:100%;background:#253242;color:white;text-align:left;margin:8px 0;border:1px solid #415164}.item strong{display:block}.line{padding:11px 0;border-bottom:1px solid #364352;white-space:pre-wrap;overflow-wrap:anywhere}.time{font-size:12px;color:#a8b4c2}label{display:block;font-size:13px;color:#c5cfda}#error{color:#ffb8a9;white-space:pre-wrap}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.back{display:inline-block;margin-bottom:12px;color:#e8eaf0}#detail h2{overflow-wrap:anywhere;font-size:16px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#34475a;font-size:12px}
</style></head><body>
<header><h1>求人LINE管理 <small>｜L GROUP</small></h1></header>
<main class="wrap">
<section id="gate" class="panel"><h2>管理者ログイン</h2><p class="muted">既存のスマホ管理ページと同じアカウントをご利用ください。</p><label>メールアドレス<input id="email" type="email" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="login">ログイン</button><p id="error"></p></section>
<section id="app" class="hide"><div class="row"><span class="muted" id="identity"></span><button class="secondary" id="logout">ログアウト</button></div>
<div id="listView"><div class="panel" id="reports"><div class="row"><strong>期間別集計</strong><select id="reportMode"><option value="day">日別（直近30日）</option><option value="month">月別（直近12か月）</option></select></div><div id="reportTable" style="overflow-x:auto;margin-top:12px"></div><p class="muted" style="font-size:12px">初回問い合わせは初回受信日時、その他は手動登録された対応履歴を基に集計。過去の未登録分は含みません。</p></div><div class="panel" id="summary"><strong>問い合わせ集計</strong><div id="stats" class="muted">読み込み中…</div><div id="repeatStats" class="muted"></div><label>再問い合わせ候補の判定間隔<select id="gapDays"><option value="7">7日以上</option><option value="14" selected>14日以上</option><option value="30">30日以上</option></select></label><p class="muted">同じLINEユーザーから、指定日数以上空いてメッセージを受信した場合に候補として表示します。確定判定ではありません。</p></div><div class="panel"><div class="row"><div><strong>応募者一覧</strong><div class="muted" id="count"></div></div><button class="secondary" id="reload">更新</button></div><label>店舗<select id="account"><option value="rose">薔薇と紳士</option></select></label><input id="search" placeholder="LINEユーザーIDで検索"></div><div id="list"></div></div>
<div id="detail" class="hide"><button class="secondary" id="back">← 一覧に戻る</button><div class="panel"><h2 id="person"></h2><div id="dates" class="muted"></div></div>
<div class="panel"><h3>対応履歴を登録</h3><label>状況<select id="kind"><option value="inquiry">問い合わせ</option><option value="application_details">応募情報の回答</option><option value="interview_scheduled">面接予約</option><option value="interview_rescheduled">面接日程変更</option><option value="confirmation_sent">確認連絡送信</option><option value="confirmation_replied">確認連絡返信</option><option value="arrival_reported">到着連絡</option><option value="interview_attended">面接実施</option><option value="no_show">無断欠席（確認済み）</option><option value="cancelled">キャンセル</option><option value="hired">採用</option><option value="rejected">不採用</option><option value="note">メモ</option></select></label><label>メモ<textarea id="note" rows="3" placeholder="日時や対応内容など"></textarea></label><button id="save">履歴を保存</button><div id="saveResult" class="muted"></div></div>
<div class="panel"><h3>対応履歴</h3><div id="history"></div></div><div class="panel"><h3>受信トーク</h3><p class="muted">応募者からの受信内容のみ表示します。</p><div id="messages"></div></div></div></section>
</main><script>
const url='https://vjjnkflbfsjihwzjsjpr.supabase.co',key='sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos';
const sb=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'mattan-mobile-auth'}});
const $=id=>document.getElementById(id);let applicants=[],selected=null,historyRows=[],eventRows=[],messageCounts={},repeatCandidates={};
const date=s=>s?new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):'―';
const msg=(id,s)=>$(id).textContent=s;
async function check(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){$('gate').classList.remove('hide');$('app').classList.add('hide');return}const {data, error:perm}=await sb.from('recruit_line_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(perm||!data){$('gate').classList.remove('hide');$('app').classList.add('hide');msg('error','このアカウントには求人LINE管理権限がありません。');return}$('gate').classList.add('hide');$('app').classList.remove('hide');msg('identity',user.email||'管理者');await load();}
$('login').onclick=async()=>{msg('error','');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('error','ログインできませんでした。入力内容をご確認ください。');return}await check()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('reload').onclick=()=>load();$('search').oninput=render;$('account').onchange=load;$('gapDays').onchange=()=>loadSummary().then(render);$('reportMode').onchange=renderReport;
async function load(){const {data,error}=await sb.from('recruit_line_applicants').select('account_id,line_user_id,first_contact_at,last_contact_at').eq('account_id',$('account').value).order('last_contact_at',{ascending:false}).limit(200);if(error){msg('list','一覧を読み込めませんでした: '+error.message);return}applicants=data||[];await loadSummary();render()}
async function loadSummary(){const account=$('account').value;const [h,e,ev]=await Promise.all([sb.from('recruit_line_applicant_history').select('account_id,line_user_id,event_kind,event_at').eq('account_id',account).order('event_at',{ascending:false}).limit(1000),sb.from('recruit_line_applicants').select('line_user_id,first_contact_at').eq('account_id',account).limit(1000),sb.from('recruit_line_events').select('line_user_id,received_at,event_type').eq('account_id',account).eq('event_type','message').order('received_at',{ascending:true}).limit(1000)]);if(h.error||e.error||ev.error){msg('stats','集計を取得できませんでした。');return}historyRows=h.data||[];messageCounts={};repeatCandidates={};const lastSeen={};const gapMs=Number($('gapDays').value)*86400000;for(const event of ev.data||[]){const id=event.line_user_id,at=new Date(event.received_at).getTime();messageCounts[id]=(messageCounts[id]||0)+1;if(lastSeen[id]!==undefined&&at-lastSeen[id]>=gapMs){repeatCandidates[id]=(repeatCandidates[id]||0)+1}lastSeen[id]=at}const people=e.data||[];renderReport();const now=new Date(),jst=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));const today=[jst.getFullYear(),String(jst.getMonth()+1).padStart(2,'0'),String(jst.getDate()).padStart(2,'0')].join('-'),month=today.slice(0,7);const day=people.filter(x=>dateKey(x.first_contact_at)===today).length,monthly=people.filter(x=>dateKey(x.first_contact_at)?.startsWith(month)).length,repeat=people.filter(x=>historyRows.filter(h=>h.line_user_id===x.line_user_id&&h.event_kind==='inquiry').length>1).length,scheduled=historyRows.filter(x=>x.event_kind==='interview_scheduled').length,noshow=historyRows.filter(x=>x.event_kind==='no_show').length;msg('stats','本日初回 '+day+'件 ｜ 今月初回 '+monthly+'件 ｜ 面接予約記録 '+scheduled+'件 ｜ 無断欠席記録 '+noshow+'件');const repeatUsers=Object.values(messageCounts).filter(n=>n>1).length;const candidates=Object.keys(repeatCandidates).length;msg('repeatStats','複数回受信 '+repeatUsers+'人 ｜ 再問い合わせ候補 '+candidates+'人（'+$('gapDays').value+'日以上の空白）');}
function renderReport(){const el=$('reportTable');if(!el)return;const mode=$('reportMode').value,now=new Date(),offset=mode==='day'?30:12;const today=dateKey(now.toISOString());const keys=[];const [yy,mm,dd]=today.split('-').map(Number);for(let i=offset-1;i>=0;i--){let d;if(mode==='day'){d=new Date(Date.UTC(yy,mm-1,dd-i,12))}else{d=new Date(Date.UTC(yy,mm-1-i,1,12))}keys.push(mode==='day'?d.toISOString().slice(0,10):d.toISOString().slice(0,7))}const rows=Object.fromEntries(keys.map(k=>[k,{first:0,scheduled:0,rescheduled:0,cancelled:0,noshow:0,attended:0}]));for(const a of applicants){const k=dateKey(a.first_contact_at)?.slice(0,mode==='day'?10:7);if(rows[k])rows[k].first++}for(const h of historyRows){const k=dateKey(h.event_at)?.slice(0,mode==='day'?10:7);if(!rows[k])continue;const field={interview_scheduled:'scheduled',interview_rescheduled:'rescheduled',cancelled:'cancelled',no_show:'noshow',interview_attended:'attended'}[h.event_kind];if(field)rows[k][field]++}const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap';const tr=document.createElement('tr');for(const label of ['期間','初回','予約','変更','取消','無断欠席','面接実施']){const th=document.createElement('th');th.textContent=label;th.style.cssText='padding:8px 5px;border-bottom:1px solid #64748b;text-align:right';tr.append(th)}table.append(tr);for(const k of [...keys].reverse()){const row=document.createElement('tr');const v=rows[k];for(const val of [k,v.first,v.scheduled,v.rescheduled,v.cancelled,v.noshow,v.attended]){const td=document.createElement('td');td.textContent=String(val);td.style.cssText='padding:8px 5px;border-bottom:1px solid #354252;text-align:right';row.append(td)}table.append(row)}el.replaceChildren(table)}
function dateKey(s){if(!s)return null;const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(s));const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return o.year+'-'+o.month+'-'+o.day}
function render(){const q=$('search').value.trim().toLowerCase(),rows=applicants.filter(x=>x.line_user_id.toLowerCase().includes(q));msg('count',rows.length+'件');$('list').replaceChildren();if(!rows.length){msg('list','該当する応募者はいません。');return}for(const a of rows){const b=document.createElement('button');b.className='item';const s=document.createElement('strong');s.textContent=a.line_user_id;const t=document.createElement('small');const hs=historyRows.filter(h=>h.line_user_id===a.line_user_id);const last=hs[0];const status=document.createElement('div');status.className='pill';status.textContent=last?(kinds[last.event_kind]||last.event_kind):'未分類';const count=document.createElement('div');count.className='time';count.textContent='対応履歴 '+hs.length+'件 ｜ 受信 '+(messageCounts[a.line_user_id]||0)+'件'+((messageCounts[a.line_user_id]||0)>1?' ｜ 複数回受信':'')+(repeatCandidates[a.line_user_id]?' ｜ 再問い合わせ候補 '+repeatCandidates[a.line_user_id]+'回':'');t.textContent='初回: '+date(a.first_contact_at)+' / 最終: '+date(a.last_contact_at);b.append(s,t,status,count);b.onclick=()=>openPerson(a);$('list').append(b)}}
async function openPerson(a){selected=a;$('listView').classList.add('hide');$('detail').classList.remove('hide');msg('person',a.line_user_id);msg('dates','初回: '+date(a.first_contact_at)+' / 最終: '+date(a.last_contact_at));await detailLoad();await loadSummary();render()}
$('back').onclick=()=>{$('detail').classList.add('hide');$('listView').classList.remove('hide');selected=null};
const kinds={inquiry:'問い合わせ',application_details:'応募情報の回答',interview_scheduled:'面接予約',interview_rescheduled:'面接日程変更',interview_reconfirmed:'面接再確認',confirmation_sent:'確認連絡送信',confirmation_replied:'確認連絡返信',arrival_reported:'到着連絡',interview_attended:'面接実施',no_show:'無断欠席',cancelled:'キャンセル',hired:'採用',rejected:'不採用',note:'メモ'};
function line(container,head,body,time){const d=document.createElement('div');d.className='line';const h=document.createElement('strong');h.textContent=head;const p=document.createElement('div');p.textContent=body||'';const t=document.createElement('div');t.className='time';t.textContent=date(time);d.append(h,p,t);container.append(d)}
async function detailLoad(){if(!selected)return;const filter={account_id:selected.account_id,line_user_id:selected.line_user_id};const [h,e]=await Promise.all([sb.from('recruit_line_applicant_history').select('event_kind,note,event_at,source').match(filter).order('event_at',{ascending:false}).limit(100),sb.from('recruit_line_events').select('message_type,message_text,received_at').match(filter).order('received_at',{ascending:false}).limit(100)]);$('history').replaceChildren();$('messages').replaceChildren();if(h.error)msg('history','読み込みエラー: '+h.error.message);else if(!h.data.length)msg('history','対応履歴はまだありません。');else for(const x of h.data)line($('history'),kinds[x.event_kind]||x.event_kind,x.note,x.event_at);if(e.error)msg('messages','読み込みエラー: '+e.error.message);else if(!e.data.length)msg('messages','受信履歴はありません。');else for(const x of e.data)line($('messages'),x.message_type||'受信イベント',x.message_text||'本文なし',x.received_at)}
$('save').onclick=async()=>{if(!selected)return;$('save').disabled=true;msg('saveResult','保存中…');const {error}=await sb.from('recruit_line_applicant_history').insert({account_id:selected.account_id,line_user_id:selected.line_user_id,event_kind:$('kind').value,note:$('note').value.trim()||null,source:'manual',reviewed:true});$('save').disabled=false;if(error){msg('saveResult','保存できませんでした: '+error.message);return}msg('saveResult','保存しました。');$('note').value='';await detailLoad();await loadSummary();render()};
check();
</script></body></html>
