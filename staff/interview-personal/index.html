<!doctype html><html lang="ja"><head><script>(function(){var p=new URLSearchParams(location.search).get('profile');if(p==='president'||p==='ota'){location.replace('./'+p+'/'+location.search+location.hash)}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人面接管理・対応不可</title><style>body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#202020;margin:0}main{max-width:700px;margin:auto;padding:20px}section{background:white;border-radius:12px;padding:20px;margin:15px 0}label{display:block;margin:12px 0 5px}input,button{font:inherit;padding:10px}button{cursor:pointer}li{padding:10px 0;border-bottom:1px solid #ddd}.error{color:#ad2121}.hint{color:#666;font-size:14px}</style></head><body><main><h1 id="heading">個人面接管理</h1><p id="state">認証確認中…</p><section id="main" hidden><p id="scope"></p><div id="masterSwitcher" hidden><label for="viewProfile">マスター表示切替（他担当者は閲覧専用）</label><select id="viewProfile"><option value="owner">俺</option><option value="president">社長</option><option value="ota">おおたくん</option></select></div><p class="hint">この画面は担当者別対応不可の先行実装です。通知・新規面接登録との連動は未実装のため、本番運用には使用しないでください。</p><h2>面接予定</h2><p class="hint">担当店舗の予定を表示します。担当者未設定の既存予定は「担当未設定」と表示します。</p><ul id="appointments"></ul><div id="availabilityEditor"><h2>対応不可を登録</h2><label>日付</label><input id="date" type="date"><label><input id="allDay" type="checkbox" checked> 終日対応不可</label><div id="times" hidden><label>開始</label><input id="start" type="time" value="10:00"><label>終了</label><input id="end" type="time" value="18:00"></div><p><button id="save">登録する</button></p><h2>登録済みの対応不可</h2><ul id="blocks"></ul></div><p id="previewNotice" hidden>代理閲覧中：変更操作はできません。対応不可設定の詳細は本人のログインで確認してください。</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://vjjnkflbfsjihwzjsjpr.supabase.co','sb_publishable_J5WCsft5jMU2_2qVYXKieg_JfSX5Uos',{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage,storageKey:'mattan-recruit-auth'}});
const $=id=>document.getElementById(id);let user=null,profile=null,ownProfile=null,previewMode=false;
function message(s,bad=false){$('state').textContent=s;$('state').className=bad?'error':''}
$('allDay').onchange=()=>{$('times').hidden=$('allDay').checked};
async function init(){try{const {data:{user:u},error}=await sb.auth.getUser();if(error||!u)throw Error('求人管理でログインしてください。');user=u;const access=await sb.from('recruit_staff_profiles').select('role').eq('user_id',user.id).maybeSingle();if(access.error||!access.data)throw Error('求人管理の権限を確認できません。');const isMaster=access.data.role==='master';let assignment=null;if(!isMaster){const r=await sb.rpc('interview_my_profile');if(r.error||!r.data?.length)throw Error('面接担当者の情報取得に失敗しました：'+(r.error?.message||'担当者登録なし'));assignment=r.data[0];}ownProfile=isMaster?{profile_key:'owner',display_name:'俺',stores:['薔薇と紳士','BUSTY OSAKA'],user_id:user.id}:assignment;profile=ownProfile;const expected=new URLSearchParams(location.search).get('profile');if(expected&&expected!==ownProfile.profile_key){if(ownProfile.profile_key!=='owner')throw Error('この個人ページへのアクセス権限がありません。');const target=await sb.rpc('interview_preview_profile',{p_profile_key:expected});if(target.error||!target.data?.length)throw Error('表示対象を取得できません。');profile=target.data[0];}if(ownProfile.profile_key==='owner'){$('masterSwitcher').hidden=false;$('viewProfile').value=profile.profile_key;$('viewProfile').onchange=()=>{location.href='?profile='+encodeURIComponent($('viewProfile').value)}}previewMode=profile.profile_key!==ownProfile.profile_key;$('availabilityEditor').hidden=previewMode;$('previewNotice').hidden=!previewMode;$('heading').textContent=profile.display_name+'｜面接管理'+(previewMode?'（閲覧専用）':'');$('scope').textContent='担当店舗：'+profile.stores.join('・');$('main').hidden=false;message(previewMode?'マスター代理閲覧中':'ログイン確認済み');await Promise.all([...(previewMode?[]:[load()]),loadAppointments()])}catch(e){message(e.message,true)}}
async function loadAppointments(){const {data,error}=await sb.from('staff_interviews').select('id,shop,interview_date,interview_time,status,interviewer_user_id').in('shop',profile.stores).order('interview_date',{ascending:true}).order('interview_time',{ascending:true});if(error){message('面接予定の取得に失敗しました：'+error.message,true);return}const ul=$('appointments');ul.replaceChildren();const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});const active=(data||[]).filter(x=>x.interview_date>=today&&['面接予定','日程変更'].includes(x.status));for(const x of active){const li=document.createElement('li');const own=x.interviewer_user_id===(profile.user_id||user.id);li.textContent=x.interview_date+' '+String(x.interview_time).slice(0,5)+'｜'+x.shop+'｜'+(own?'★ 自分が担当':x.interviewer_user_id?'別担当者':'担当未設定')+'｜'+x.status;if(own){li.style.fontWeight='bold';li.style.borderLeft='4px solid #2269a8';li.style.paddingLeft='10px'}ul.append(li)}if(!active.length){const li=document.createElement('li');li.textContent='対象店舗の今後の面接予定はありません';ul.append(li)}}
async function load(){const {data,error}=await sb.from('interview_staff_unavailability').select('id,block_date,all_day,start_time,end_time').eq('interviewer_user_id',user.id).order('block_date');if(error){message(error.message,true);return}const ul=$('blocks');ul.replaceChildren();for(const x of data){const li=document.createElement('li');const label=document.createElement('span');label.textContent=x.block_date+' ｜ '+(x.all_day?'終日':x.start_time.slice(0,5)+'〜'+x.end_time.slice(0,5))+' ';const btn=document.createElement('button');btn.textContent='解除';btn.onclick=async()=>{if(!confirm('この対応不可を解除しますか？'))return;const {error}=await sb.from('interview_staff_unavailability').delete().eq('id',x.id).eq('interviewer_user_id',user.id);if(error)message(error.message,true);else{await load();if(typeof loadAppointments==='function')await loadAppointments()}};li.append(label,btn);ul.append(li)}if(!data.length){const li=document.createElement('li');li.textContent='登録なし';ul.append(li)}}
$('save').onclick=async()=>{if(!user)return;const date=$('date').value,allDay=$('allDay').checked,start=$('start').value,end=$('end').value;if(!date){message('日付を指定してください',true);return}if(!allDay&&(!start||!end||start>=end)){message('終了時刻は開始時刻より後にしてください',true);return}const row={interviewer_user_id:user.id,block_date:date,all_day:allDay,start_time:allDay?null:start,end_time:allDay?null:end};const {error}=await sb.from('interview_staff_unavailability').insert(row);if(error)message(error.message,true);else{message('対応不可を登録しました');await load()}};
init();
</script><script src="./appointment-assignment.js"></script></body></html>
