 $("notifyToggle").setAttribute("aria-pressed",String(notifyOn));
 if(notifyOn){
  try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio){audioContext=audioContext||new Audio();void audioContext.resume()}}catch{}
 }
});
const notificationSettings=$("notificationSettings");
document.addEventListener("pointerdown",event=>{
 if(notificationSettings.open&&!notificationSettings.contains(event.target))notificationSettings.open=false;
});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&notificationSettings.open){notificationSettings.open=false;notificationSettings.querySelector("summary").focus()}
});
$("backToList").addEventListener("click",()=>$("layout").classList.remove("chat-open"));
function updateCounters(){
 const total=items.filter(isUnread).length;
 $("summary").textContent="会話 "+items.length+"件 ／ 未読 "+total+"件";
 $("unreadTotal").textContent="未読 "+total+"件";
 document.title=(total?"("+total+") ":"")+defaultTitle;
}

const labelTime=iso=>{const d=new Date(iso);return isNaN(+d)?"":d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})};
async function request(url,payload){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",body:JSON.stringify(payload),signal:controller.signal});const data=await r.json();if(!r.ok||(!data.ok&&url===API)){const e=new Error(data.error||"request_failed");e.status=r.status;throw e}return data;}finally{clearTimeout(timer)}
}
const stored=()=>{try{return sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)||""}catch{return ""}};
function existingAdminJwt(){try{const raw=localStorage.getItem("mattan-recruit-auth")||sessionStorage.getItem("mattan-recruit-auth");const session=raw?JSON.parse(raw):null;return typeof session?.access_token==="string"?session.access_token:""}catch{return ""}}
function showError(msg){$("error").textContent=msg;$("error").hidden=false}
function clearError(){$("error").textContent="";$("error").hidden=true}
function unauthorized(){$("app").hidden=true;$("gate").hidden=false;token="";threadId="";sessionStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_KEY);$("gateError").textContent="再ログインしてください。"}
async function call(action,params={}){
 try{return await request(API,{action,staff_token:token,...params})}
 catch(e){if(e.status===401)unauthorized();throw e}
}
function isUnread(t){return !!(t.last_customer_message_at&&(!t.staff_last_read_at||new Date(t.last_customer_message_at)>new Date(t.staff_last_read_at)))}
function nameOf(t){const visitor=t.booking_chat_visitors;return (visitor&&visitor.display_name)||"お客様 "+String(t.visitor_id).slice(0,8)}
function drawList(){
 const list=$("threads");list.replaceChildren();
 let unread=0;
 for(const t of items){
  const active=t.id===threadId;
  if(isUnread(t))unread++;
  const btn=document.createElement("button");btn.type="button";btn.className="thread"+(active?" active":"")+(isUnread(t)?" unread":"");
  const heading=document.createElement("div");
  const strong=document.createElement("strong");strong.textContent=t.store_key;
  const time=document.createElement("time");time.textContent=labelTime(t.updated_at);heading.append(strong,time);
  const desc=document.createElement("div");desc.className="sub";
  const customer=document.createElement("span");customer.textContent=nameOf(t);desc.append(customer);
  if(isUnread(t)){const badge=document.createElement("span");badge.className="tag";badge.textContent="未読";desc.append(badge)}
  btn.append(heading,desc);btn.addEventListener("click",()=>void openThread(t.id));list.append(btn);
 }
 if(!items.length){const empty=document.createElement("div");empty.className="placeholder";empty.textContent="まだ問い合わせはありません";list.append(empty)}
 updateCounters();
}
async function loadList(){
 if(!token||loading)return;loading=true;
 const store=$("store").value;
 try{
  const previous=new Map(items.map(item=>[item.id,item.last_customer_message_at||""]));
  const data=await call("staff_list",{store});
  if(store!==$("store").value)return;
  const next=data.threads||[];
  const hasNew=listInitialized&&next.some(item=>{
   if(!item.last_customer_message_at||!isUnread(item))return false;
   const old=previous.get(item.id);
   return old===undefined||item.last_customer_message_at>old;
  });
  items=next;
  listInitialized=true;
  drawList();clearError();
  if(hasNew)notificationTone();
  if(threadId&&!document.hidden){
   const selected=items.find(t=>t.id===threadId);
   if(selected&&selected.updated_at!==activeThreadUpdatedAt&&!threadOpening){
    void openThread(threadId,{refresh:true});
   }
  }
 }catch(e){showError("一覧を取得できません。（"+e.message+"）")}
 finally{loading=false}
}
function appendMessage(message){
 const el=document.createElement("div");el.className="bubble"+(message.sender==="staff"?" mine":"");
 el.textContent=message.body;
 const time=document.createElement("span");time.textContent=(message.sender==="staff"?"スタッフ":"お客様")+"　"+labelTime(message.created_at);
 el.append(time);return el;
}
async function openThread(id,options={}){
 if(!token||threadOpening)return;
 threadOpening=true;
 const prev=threadId,switched=prev!==id;
 threadId=id;
 if(switched)$("layout").classList.add("chat-open");
 drawList();
 try{
  const data=await call("staff_thread",{thread_id:id});
  if(threadId!==id)return;
  $("threadTitle").textContent=data.thread.store_key+"｜お客様 "+String(data.thread.visitor_id).slice(0,8);
  const rel=$("relatedThreads");rel.replaceChildren();
  if(data.related?.length){
   const label=document.createElement("span");label.textContent="他店舗履歴：";rel.append(label);
   for(const item of data.related){
    const link=document.createElement("button");link.type="button";link.textContent=item.store_key;
    link.addEventListener("click",()=>{if($("store").value!=="all"){$("store").value="all";void loadList()}void openThread(item.id)});
    rel.append(link);
   }
  }
  const pane=$("messages");
  const wasAtBottom=pane.scrollHeight-pane.scrollTop-pane.clientHeight<90;
  const oldIds=[...pane.children].map(n=>n.dataset?.messageId).filter(Boolean).join(",");
  const nextIds=(data.messages||[]).map(m=>String(m.id)).join(",");
  if(switched||nextIds!==oldIds){
   pane.replaceChildren();
   for(const msg of data.messages||[]){
    const node=appendMessage(msg);node.dataset.messageId=String(msg.id);pane.append(node);
   }
   if(switched||wasAtBottom)pane.scrollTop=pane.scrollHeight;
  }
  $("reply").hidden=false;
  if(switched)$("draft").value="";
  const found=items.find(t=>t.id===id);
  if(found){found.staff_last_read_at=new Date().toISOString();activeThreadUpdatedAt=found.updated_at}
  else activeThreadUpdatedAt=data.thread.updated_at;
  drawList();clearError();
 }catch(e){showError("会話を取得できません。（"+e.message+"）")}
 finally{threadOpening=false}
}
let connecting=false;
async function connectExisting(){
 if(connecting)return;
 connecting=true;$("connect").disabled=true;$("gateError").textContent="管理者認証を確認しています…";
 try{
  const old=stored();
  if(/^[0-9a-f]{64}$/.test(old)){
   try{
    const check=await request(API,{action:"staff_list",staff_token:old,store:$("store").value});
    token=old;
    items=check.threads||[];listInitialized=true;$("gate").hidden=true;$("app").hidden=false;drawList();clearError();
    $("gateError").textContent="";void syncPushIfGranted();return;
   }catch(e){
    if(e.status!==401)throw e;
    sessionStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_KEY);
   }
  }
  const jwt=existingAdminJwt();
  if(!jwt)throw new Error("面接管理の管理者ログイン情報が見つかりません。先に管理画面でログインしてください。");
  const res=await fetch(LOGIN,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+jwt},cache:"no-store",body:JSON.stringify({action:"admin_exchange"})});
  const data=await res.json();
  if(!res.ok||typeof data.token!=="string"){
   if(res.status===401)throw new Error("管理者ログインの有効期限が切れています。面接管理にログインし直してください。");
   if(res.status===403)throw new Error("このアカウントには管理者権限がありません。");
   throw new Error("既存の管理者認証に接続できません。（"+String(data.error||res.status)+"）");
  }
  token=data.token;sessionStorage.setItem(SESSION_KEY,token);localStorage.removeItem(SESSION_KEY);
  $("gate").hidden=true;$("app").hidden=false;$("gateError").textContent="";clearError();await loadList();void syncPushIfGranted();
 }catch(err){
  $("gate").hidden=false;$("app").hidden=true;
  $("gateError").textContent=String(err.message||err);
 }finally{connecting=false;$("connect").disabled=false}
}
$("connect").addEventListener("click",()=>void connectExisting());
$("reply").addEventListener("submit",async e=>{
 e.preventDefault();if(!threadId||!token||replying)return;
 const body=$("draft").value.trim();if(!body)return;replying=true;$("send").disabled=true;
 try{
  await call("staff_send",{thread_id:threadId,body,client_message_id:crypto.randomUUID()});
  $("draft").value="";await openThread(threadId);await loadList();
 }catch(err){showError("送信できませんでした。（"+String(err.message||err)+"）")}
 finally{replying=false;$("send").disabled=false}
});
$("draft").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("reply").requestSubmit()}});
$("store").addEventListener("change",()=>{setCustomerTestLink();threadId="";activeThreadUpdatedAt="";listInitialized=false;$("layout").classList.remove("chat-open");$("threadTitle").textContent="チャットを選択してください";$("relatedThreads").replaceChildren();$("messages").replaceChildren();$("reply").hidden=true;void loadList()});
$("reload").addEventListener("click",()=>{void loadList();if(threadId)void openThread(threadId)});
setInterval(()=>{if(!document.hidden&&token)void loadList()},10000);
void connectExisting();
})();
</script></body></html>
