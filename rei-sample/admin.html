されます。ログイン認証・Supabase同期・サーバーへの画像アップロードは未実装です。下部アイコンはブラウザ内に画像を保存できます。初期状態に写真・文章・料金・出勤・エリアのサンプルデータを登録済みです。画像は外部のサンプル写真URLで指定しています。変更内容はこのブラウザ内で保存されます。</p><a class="btn" href="index.html" target="_blank" rel="noopener noreferrer">公開ページ</a><div id="root"></div><div class="sticky"><button onclick="save()">設定を保存</button><a class="btn secondary" href="admin.html">管理TOP</a><a class="btn" href="index.html" target="_blank" rel="noopener noreferrer">公開ページ</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared.js"></script><script src="supabase-adapter.js"></script><script>

function section(title){let s=document.createElement('section');s.innerHTML='<h2>'+title+'</h2>';if(currentPage!=='top'&&(PAGE_SECTIONS[currentPage]||[]).includes(title))root.append(s);return s}
function textfield(parent,label,obj,key,type='text'){let l=document.createElement('label');l.textContent=label;let input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=obj[key]??'';if(type==='textarea'){input.classList.add('longtext');input.rows=9;const resize=()=>{input.style.height='auto';input.style.height=Math.max(230,input.scrollHeight+3)+'px'};input.addEventListener('input',resize);requestAnimationFrame(resize)}input.oninput=()=>obj[key]=type==='number'?Number(input.value):input.value;if(type==='textarea'){input.setAttribute('wrap','soft');input.style.cssText+=';width:100%;max-width:100%;min-width:0;overflow-x:hidden;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap';input.addEventListener('focus',()=>{input.scrollLeft=0});input.addEventListener('input',()=>{if(input.scrollLeft)input.scrollLeft=0})}parent.append(l,input);return input}
function check(parent,label,obj,key){let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=!!obj[key];i.onchange=()=>obj[key]=i.checked;l.append(i,' '+label);parent.append(l);return i}
function selectfield(parent,label,obj,key,options){let l=document.createElement('label'),sel=document.createElement('select');l.textContent=label;options.forEach(([value,name])=>{let o=document.createElement('option');o.value=value;o.textContent=name;sel.append(o)});sel.value=obj[key]||options[0][0];sel.onchange=()=>obj[key]=sel.value;parent.append(l,sel)}
function items(s,arr,fields,make,opts={}){let host=document.createElement('div');s.append(host);function render(){host.innerHTML='';arr.forEach((o,i)=>{let box=document.createElement('div');box.className='item';fields.forEach(f=>{if(f[2]==='checkbox')check(box,f[0],o,f[1]);else if(f[2]==='select')selectfield(box,f[0],o,f[1],f[3]);else textfield(box,f[0],o,f[1],f[2]||'text')});let row=document.createElement('div');row.className='row';[['↑',()=>{if(i){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];render()}}],['↓',()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];render()}}],...(opts.fixed?[]:[['削除',()=>{arr.splice(i,1);render();if(opts.autoSave)save()}]])].forEach(([t,fn])=>{let b=document.createElement('button');b.textContent=t;b.className='secondary';b.onclick=fn;row.append(b)});box.append(row);host.append(box)})}let add=document.createElement('button');add.textContent='＋ 追加';add.onclick=()=>{if(opts.limit&&arr.length>=opts.limit){alert('最大'+opts.limit+'項目です');return}arr.push(make());render();if(opts.autoSave)save()};if(!opts.fixed)s.append(add);render()}

function compactBookingItems(s,arr,fields,make){
 const host=document.createElement('div');s.append(host);
 function render(){
  host.replaceChildren();
  arr.forEach((obj,i)=>{
   const details=document.createElement('details');details.className='item';details.style.padding='0';
   const summary=document.createElement('summary');summary.style.cssText='cursor:pointer;padding:15px;font-weight:700;list-style:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px';
   const typeLabels={text:'テキスト',tel:'電話番号',email:'メール',date:'日付',time:'時刻','datetime-local':'日時',number:'数字',textarea:'長文',select:'選択式'};
   function updateSummary(){
    summary.replaceChildren();
    const title=document.createElement('strong');title.textContent=obj.label||'新規項目';title.style.marginRight='auto';
    summary.append(title);
    for(const value of [obj.required?'必須':'任意',obj.visible===false?'非表示':'表示',typeLabels[obj.type]||obj.type||'テキスト']){
     const status=document.createElement('span');status.textContent=value;status.style.cssText='font-size:11px;font-weight:500;border:1px solid #70526b;border-radius:5px;padding:3px 6px;white-space:nowrap';summary.append(status);
    }
   }
   updateSummary();details.append(summary);
   const editor=document.createElement('div');editor.style.padding='0 14px 14px';
   fields.forEach(field=>{
    if(field[1]==='options'){
     const wrap=document.createElement('div');
     const input=textfield(wrap,field[0],obj,field[1],'textarea');
     input.rows=3;input.style.minHeight='85px';input.style.height='85px';
     const update=()=>{wrap.hidden=obj.type!=='select'};
     details.addEventListener('change',update);update();editor.append(wrap);
    }else if(field[2]==='checkbox')check(editor,field[0],obj,field[1]);
    else if(field[2]==='select')selectfield(editor,field[0],obj,field[1],field[3]);
    else textfield(editor,field[0],obj,field[1],field[2]||'text');
   });
   const actions=document.createElement('div');actions.className='row';
   [['↑',()=>{if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];render()}}],
    ['↓',()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];render()}}],
    ['削除',()=>{if(confirm('この項目を削除しますか？')){arr.splice(i,1);render()}}]]
    .forEach(([label,fn])=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.onclick=fn;actions.append(b)});
   editor.addEventListener('input',updateSummary);editor.addEventListener('change',updateSummary);editor.append(actions);details.append(editor);host.append(details);
  });
 }
 const add=document.createElement('button');add.type='button';add.textContent='＋ 追加';add.onclick=()=>{arr.push(make());render();host.lastElementChild.open=true};s.append(add);render();

function addDragSort(handle,element,container,array,index,redraw){
 handle.type='button';handle.className='secondary';handle.textContent='≡';handle.title='長押しして並び替え';handle.setAttribute('aria-label','長押しして並び替え');handle.style.touchAction='none';

 handle.onpointermove=e=>{if(!start)return;e.preventDefault();container.querySelectorAll('[data-sort-index]').forEach(el=>el.style.outline='');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-sort-index]');if(target&&container.contains(target)&&target!==element)target.style.outline='2px solid #e981b9'};
 handle.onpointerup=e=>{if(!start)return;const from=start.from;start=null;element.style.opacity='';const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-sort-index]');const to=target&&container.contains(target)?Number(target.dataset.sortIndex):from;if(to!==from&&to>=0&&to<array.length){const [moved]=array.splice(from,1);array.splice(to,0,moved)}redraw()};

}

  const match=line.match(/^([\d,，]+)\s*(?:円|￥|¥)?\s*[｜|：:]\s*(.+)$/);
  if(!match){errors.push((i+1)+'行目：形式を確認してください（例：1000円｜北区、福島区）');return}
  const price=Number(match[1].replace(/[,，]/g,''));
  if(!Number.isFinite(price)||price<1000){errors.push((i+1)+'行目：有料エリアは1,000円以上です');return}
  const names=match[2].split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
  if(!names.length){errors.push((i+1)+'行目：エリア名がありません');return}
