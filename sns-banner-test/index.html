<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNSバナー貼り付けテスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f7f4f7;color:#24202a;margin:0;padding:24px 14px}.wrap{max-width:560px;margin:auto}h1{font-size:21px}p{line-height:1.7}button{border:0;border-radius:12px;background:#29202b;color:#fff;font-size:16px;font-weight:bold;padding:16px;width:100%;margin:18px 0;cursor:pointer}.preview{background:white;padding:18px 10px;border:1px solid #ddd;border-radius:10px}#status{font-weight:bold;color:#326744}.note{font-size:13px;color:#555}a{color:inherit}</style></head><body><div class="wrap"><h1>画像＋リンク 貼り付けテスト</h1><p>画像付きリンクがブログ本文エディターに残るかを確認するテストです。</p><div class="preview" id="preview"><p style="margin:8px 0"><a href="https://line.me/" target="_blank"><img src="https://officialendstaff.github.io/therapist-profile/sns-banner-test/line.svg" alt="LINEへ" width="300" style="width:300px;max-width:100%;height:auto;border:0"></a></p><p style="margin:8px 0"><a href="https://x.com/" target="_blank"><img src="https://officialendstaff.github.io/therapist-profile/sns-banner-test/x.svg" alt="Xへ" width="300" style="width:300px;max-width:100%;height:auto;border:0"></a></p><p style="margin:8px 0"><a href="https://example.com/" target="_blank"><img src="https://officialendstaff.github.io/therapist-profile/sns-banner-test/02.svg" alt="02へ" width="300" style="width:300px;max-width:100%;height:auto;border:0"></a></p></div><button id="copy">画像付きバナーをコピー</button><p id="status" role="status"></p><p class="note">① コピー → ② 公式HPのブログ本文欄へ貼り付け → ③ 色・横並び・リンクが残るか確認してください。<br>※リンク先はテスト用です。実際の予約には使用しないでください。公開投稿は不要です。</p><p class="note">コピーが動作しない場合は、上のバナーを長押しして選択・コピーを試してください。</p></div><script>document.getElementById('copy').addEventListener('click',async()=>{const html=document.getElementById('preview').innerHTML;const plain='LINE（予約・相談） https://line.me/\nX（DMはこちら） https://x.com/\n02（DMはこちら） https://example.com/';const status=document.getElementById('status');try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('unsupported');await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);status.textContent='コピーしました。ブログ本文欄に貼り付けてください。'}catch(e){status.textContent='このブラウザでは装飾付きコピーが利用できません。バナーを長押ししてコピーしてください。'}});</script></body></html>
