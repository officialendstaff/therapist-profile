<style>

<script>
(()=>{
"use strict";
const API="https://vjjnkflbfsjihwzjsjpr.supabase.co/functions/v1/booking-chat";
const STORES=["Grand Luxe","LUXY OSAKA","Un Secret","薔薇と紳士","BUSTY OSAKA"];
const COLORS={"Grand Luxe":"#8166a8","LUXY OSAKA":"#397bc3","Un Secret":"#138c80","薔薇と紳士":"#bf6f8e","BUSTY OSAKA":"#b8814a"};
const $=id=>document.getElementById(id);
const search=new URLSearchParams(location.search);
const store=search.get("store");
const embedded=search.get("embed")==="1";
const allowedEmbedOrigins={
 "Grand Luxe":new Set(["https://grandluxe-osaka.com","https://www.grandluxe-osaka.com"]),
 "LUXY OSAKA":new Set(["https://luxy-spa.com","https://www.luxy-spa.com"]),
 "Un Secret":new Set(["https://unsecret-osaka.com","https://www.unsecret-osaka.com"]),
 "薔薇と紳士":new Set(["https://rose-gentleman.com","https://www.rose-gentleman.com"]),
 "BUSTY OSAKA":new Set(["https://busty-osaka.com","https://www.busty-osaka.com"])
};
let parentOrigin="";
if(embedded){
 try{parentOrigin=new URL(document.referrer).origin}catch{}
 const trusted=parentOrigin==="https://officialendstaff.github.io"||allowedEmbedOrigins[store]?.has(parentOrigin);
 if(!trusted){
  document.body.textContent="このサイトからはチャットを利用できません。";
  return;
 }
 document.documentElement.classList.add("embedded");
 document.body.classList.add("embedded");
 window.addEventListener("message",event=>{
  if(event.source!==window.parent||event.origin!==parentOrigin)return;
  const data=event.data;
  if(data?.type!=="lgroup.chat.viewport"||data.store!==store)return;
  const width=Math.floor(Number(data.width));
  const height=Math.floor(Number(data.height));
  if(!Number.isFinite(width)||width<240||width>1920||!Number.isFinite(height)||height<120||height>2000)return;
  document.documentElement.style.setProperty("--embed-width",width+"px");
  applyEmbedHeight(height);
 });

}
const key="l_group_booking_chat_token_v1";
let parentViewportHeight=0;
let latestScrollFrame=0;
function scrollToLatest(){
 const pane=document.getElementById("timeline");
 if(!pane)return;
 pane.scrollTop=pane.scrollHeight;
}
function scheduleLatestScroll(){
 if(latestScrollFrame)cancelAnimationFrame(latestScrollFrame);
 latestScrollFrame=requestAnimationFrame(()=>{
  latestScrollFrame=0;
  scrollToLatest();
  requestAnimationFrame(scrollToLatest);
 });
}
function applyEmbedHeight(parentHeight){
 if(!embedded)return;
 if(Number.isFinite(parentHeight)&&parentHeight>0)parentViewportHeight=parentHeight;
 const localVisual=window.visualViewport?.height;
 const localInner=window.innerHeight;
 const sizes=[parentViewportHeight,localVisual,localInner].filter(x=>Number.isFinite(x)&&x>=120);
 if(!sizes.length)return;
 const height=Math.round(Math.min(...sizes));
 document.documentElement.style.setProperty("--embed-height",height+"px");
 scheduleLatestScroll();
}
if(embedded){
 const sync=()=>{applyEmbedHeight(0);scheduleLatestScroll()};
 window.visualViewport?.addEventListener("resize",sync);
 window.visualViewport?.addEventListener("scroll",sync);
 window.addEventListener("resize",sync);
 window.addEventListener("pageshow",scheduleLatestScroll);
 window.addEventListener("message",event=>{
  if(event.source!==window.parent||event.origin!==parentOrigin)return;
  if(event.data?.type==="lgroup.chat.opened"&&event.data.store===store)scheduleLatestScroll();
 });
 document.addEventListener("focusin",event=>{
  if(event.target?.id!=="draft")return;
  document.documentElement.classList.add("keyboard-active");
  document.body.classList.add("keyboard-active");
  sync();
  scheduleLatestScroll();
  window.parent.postMessage({type:"lgroup.chat.focus",store},parentOrigin);
 });
 document.addEventListener("focusout",event=>{
  if(event.target?.id!=="draft")return;
  document.documentElement.classList.remove("keyboard-active");
  document.body.classList.remove("keyboard-active");
  sync();
 });
 sync();
}
let token="",ready=false,lastId=0,posting=false,polling=false;
function reportStaffMessages(messages){
 if(!embedded||!parentOrigin||window.parent===window)return;
 const ids=(Array.isArray(messages)?messages:[])
  .filter(message=>message.sender==="staff"||message.sender==="operator")
  .map(message=>Number(message.id))
  .filter(id=>Number.isSafeInteger(id)&&id>0);
 if(!ids.length)return;
 window.parent.postMessage({type:"lgroup.chat.staffMessages",store,ids},parentOrigin);
}
if(!STORES.includes(store)){
 $("chooser").hidden=false;
 for(const name of STORES){const a=document.createElement("a");a.href="?store="+encodeURIComponent(name);a.textContent=name;$("storeLinks").append(a)}
 return;
}
$("chatScreen").hidden=false;$("storeTitle").textContent=store;
document.documentElement.style.setProperty("--accent",COLORS[store]);
const err=(message)=>{$("error").textContent=message;$("error").hidden=false;};
const clearErr=()=>{$("error").textContent="";$("error").hidden=true;};
let isBlocked=false;
let greetingText="お気軽にお問い合わせください。";
const setReady=v=>{ready=v;$("draft").disabled=!v||isBlocked;$("send").disabled=!v||isBlocked;$("connection").textContent=isBlocked?"受付停止中":v?"チャット接続中":"接続待機中";$("connection").previousElementSibling.style.background=isBlocked?"#bf7d7d":v?"#41a184":"#9ba7b4";};
function setBlocked(value){
 isBlocked=!!value;setReady(ready);
 if(isBlocked){$("draft").placeholder="";err("現在メッセージを送信できません。");}
 else{$("draft").placeholder="メッセージを入力";if($("error").textContent==="現在メッセージを送信できません。")clearErr();}
}
async function api(payload){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{
  const res=await fetch(API,{method:"POST",mode:"cors",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal});
  const data=await res.json();
  if(!res.ok||!data.ok){const error=new Error(data.error||"request_failed");error.status=res.status;throw error}
  return data;
 }finally{clearTimeout(timeout)}
}
function renderMessageLinks(element,body){
 const source=String(body??"");
 const pattern=/https?:\/\/[^\s<>"'\u3000]+/gi;
 const fragment=document.createDocumentFragment();
 let start=0;
 for(const match of source.matchAll(pattern)){
  const raw=match[0];
  const suffix=(raw.match(/[.,!?;:\)\]\}\u3001\u3002\uff01\uff1f\uff09\u300d\u300f]+$/)||[""])[0];
  const address=raw.slice(0,raw.length-suffix.length);
  if(!address)continue;
  fragment.append(document.createTextNode(source.slice(start,match.index)));
  try{
   const url=new URL(address);
   if(url.protocol!=="https:"&&url.protocol!=="http:")throw Error("unsafe");
   const anchor=document.createElement("a");
   anchor.href=url.href;anchor.target="_blank";anchor.rel="noopener noreferrer";
   anchor.setAttribute("aria-label","リンクを新しいタブで開く: "+address);
   anchor.style.cssText="position:relative;z-index:2;pointer-events:auto;cursor:pointer;color:#1768ac;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere;font-weight:700";
   anchor.textContent=address;

   if(embedded){
    const openFromEmbedded=event=>{
     if(event.defaultPrevented||event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
     event.preventDefault();
     event.stopPropagation();
     try{
      // When the host and chat share an origin, open synchronously on the parent,
      // so Safari/Chrome can preserve the actual click's user activation.
      const parentOpen=window.parent.__LG_CHAT_OPEN_EXTERNAL__;
      if(typeof parentOpen==="function"){parentOpen(url.href);return}
     }catch{}
     // Cross-origin official HP: the parent receives a verified message.
     window.parent.postMessage({type:"lgroup.chat.openExternal",store,href:url.href},parentOrigin);
    };
    anchor.addEventListener("click",openFromEmbedded);
   }
   fragment.append(anchor);

  }catch{fragment.append(document.createTextNode(address))}
  fragment.append(document.createTextNode(suffix));
  start=match.index+raw.length;
 }
 fragment.append(document.createTextNode(source.slice(start)));
 element.replaceChildren(fragment);
}

function line(message){
 const mine=message.sender==="customer";
 const wrap=document.createElement("div");wrap.className="bubble-wrap"+(mine?" mine":"");
 const bubble=document.createElement("div");bubble.className="bubble";renderMessageLinks(bubble,message.body);
 const time=document.createElement("div");time.className="when";
 const date=new Date(message.created_at);
 time.textContent=(mine?"送信完了":"店舗から返信")+"　"+(Number.isNaN(+date)?"":date.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}));
 wrap.append(bubble,time);return wrap;
}
function add(messages){
 const pane=$("timeline");
 const ids=new Set([...pane.children].map(x=>x.dataset.messageId).filter(Boolean));
 let added=0;
 for(const m of messages){
  if(ids.has(String(m.id)))continue;
  const node=line(m);node.dataset.messageId=String(m.id);pane.append(node);
  lastId=Math.max(lastId,Number(m.id)||0);added++;
 }
 if(added){
  reportStaffMessages(messages);
  scheduleLatestScroll();
 }
}
let greetingShownKey="";
let greetingUpdatedAt="";
const tokyoDate=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
function showGreeting(info={},force=false){
 const nextText=typeof info.greeting==="string"&&info.greeting.trim()?info.greeting:greetingText;
 const nextVersion=typeof info.greeting_updated_at==="string"?info.greeting_updated_at:greetingUpdatedAt;
 const linkText=typeof info.greeting_link_text==="string"?info.greeting_link_text:"";
 const linkUrl=typeof info.greeting_link_url==="string"?info.greeting_link_url:"";
 const key=tokyoDate()+"|"+nextVersion+"|"+nextText+"|"+linkText+"|"+linkUrl;
 greetingText=nextText;greetingUpdatedAt=nextVersion;
 if(!force&&key===greetingShownKey)return;
 greetingShownKey=key;
 const banner=document.createElement("div");banner.className="chat-greeting-notice";
 banner.dataset.greetingKey=key;
 const body=document.createElement("div");
 let safeLink=null;
 if(linkText&&greetingText.includes(linkText)){
  try{const url=new URL(linkUrl);if(url.protocol==="https:"&&!url.username&&!url.password)safeLink=url.href}catch{}
 }
 if(safeLink){
  const position=greetingText.indexOf(linkText);
  body.append(document.createTextNode(greetingText.slice(0,position)));
  const anchor=document.createElement("a");anchor.href=safeLink;anchor.target="_blank";anchor.rel="noopener noreferrer";anchor.textContent=linkText;
  body.append(anchor,document.createTextNode(greetingText.slice(position+linkText.length)));
 }else body.textContent=greetingText;
 banner.append(body);$("timeline").append(banner);
 scheduleLatestScroll();
}
function empty(){/* Greeting is shown independently, including when history exists. */}
function removeWelcome(){const p=$("welcome");if(p)p.remove()}
function loadToken(){try{return localStorage.getItem(key)||""}catch{return ""}}
function shareToken(type,value=""){
 if(!embedded||!parentOrigin||window.parent===window)return;
 window.parent.postMessage({type,store,token:value},parentOrigin);
}
async function loadTokenFromParent(){
 if(!embedded||!parentOrigin||window.parent===window)return loadToken();
 return new Promise(resolve=>{
  let finished=false;
  let timeout;
  function finish(value){
   if(finished)return;
   finished=true;clearTimeout(timeout);window.removeEventListener("message",handle);
   resolve(typeof value==="string"&&/^[a-f0-9]{64}$/.test(value)?value:loadToken());
  }
  function handle(event){
   if(event.source!==window.parent||event.origin!==parentOrigin)return;
   if(event.data?.type!=="lgroup.chat.token"||event.data?.store!==store)return;
   finish(event.data.token);
  }
  window.addEventListener("message",handle);
  timeout=setTimeout(()=>finish(""),1600);
  shareToken("lgroup.chat.getToken");
 });
}
function saveToken(t){
 try{localStorage.setItem(key,t)}catch{}
 shareToken("lgroup.chat.saveToken",t);
}
function clearToken(){
 try{localStorage.removeItem(key)}catch{}
 shareToken("lgroup.chat.clearToken");
}
async function init(profile=null){
 setReady(false);clearErr();
 try{
  token=await loadTokenFromParent();
  if(!token&&!profile){$("firstUse").hidden=false;return}
  let data;
  try{data=await api({action:"guest_init",store,token:token||undefined,...(!token&&profile?profile:{})})}
  catch(e){if(e.status===401&&token){token="";clearToken();data=await api({action:"guest_init",store})}else throw e}
  if(data.token){token=data.token;saveToken(token)}
  $("firstUse").hidden=true;
  if(!token)throw Error("no_session");
  greetingText=typeof data.greeting==="string"&&data.greeting.trim()?data.greeting:"お気軽にお問い合わせください。";
  $("timeline").replaceChildren();lastId=0;greetingShownKey="";
  add(data.messages||[]);showGreeting(data,true);setReady(true);setBlocked(data.blocked);scheduleLatestScroll();
 }catch(e){err("チャットに接続できません。ページを再読み込みしてください。（"+String(e.message||e)+"）");setReady(false)}
}
async function poll(){
 if(!ready||polling||posting||document.hidden)return;
 polling=true;
 try{const data=await api({action:"guest_poll",token,store,after:lastId});setBlocked(data.blocked);if(data.messages?.length){removeWelcome();add(data.messages)}showGreeting(data)}
 catch(e){if(e.status===401){setReady(false);err("識別情報の有効期限が切れました。ページを再読み込みしてください。")}}
 finally{polling=false}
}
$("composer").addEventListener("submit",async e=>{
 e.preventDefault();if(!ready||posting||isBlocked)return;
 const body=$("draft").value.trim();if(!body)return;
 posting=true;$("send").disabled=true;$("send").textContent="送信中";$("send").setAttribute("aria-label","送信中");clearErr();
 const client_message_id=crypto.randomUUID();
 try{
  const data=await api({action:"guest_send",token,store,body,client_message_id});
  removeWelcome();add([data.message]);$("draft").value="";
 }catch(e){if(e.status===403&&e.message==="blocked"){setBlocked(true)}else err("送信できませんでした。再度お試しください。（"+String(e.message||e)+"）")}
 finally{posting=false;$("send").textContent="送信";$("send").setAttribute("aria-label","送信");$("send").disabled=!ready||isBlocked;if(!isBlocked)$("draft").focus()}
});
$("draft").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!("isComposing" in e&&e.isComposing)){e.preventDefault();$("composer").requestSubmit()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)void poll()});
setInterval(()=>void poll(),8000);
$("firstPhone").addEventListener("input",e=>{e.target.value=e.target.value.replace(/[^0-9]/g,"").slice(0,6);$("firstPhoneError").hidden=true});
$("firstUseForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const digits=$("firstPhone").value;
 if(digits.length!==0&&digits.length!==6){
  $("firstPhoneError").textContent="入力する場合は下6桁を入力してください。";
  $("firstPhoneError").hidden=false;
  $("firstPhone").focus();
  return;
 }
 const button=$("firstStart");
 button.disabled=true;
 try{await init({display_name:$("firstName").value.trim(),phone_suffix:digits})}
 finally{button.disabled=false}
});
void init();
})();
</script></body></html>
