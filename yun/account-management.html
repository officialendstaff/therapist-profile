<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>優織｜運営アカウント管理 v3</title><style>body{background:#fbe8ef;color:#755623;font:16px 'Yu Mincho',serif;padding:20px}main{max-width:460px;margin:5vh auto;background:#fff9fc;padding:24px;border-radius:16px}label{display:block;margin:16px 0 8px}input,button{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px}input{border:1px solid #b18b49}button{border:0;background:#d63365;color:white;margin-top:18px;cursor:pointer}.secondary{background:#755623}p{line-height:1.7}</style></head><body><main><h1>優織｜運営アカウント管理</h1><p>運営管理者専用です。承認には本人のメール認証が必要です。<span id="login-status" style="display:block;margin-top:8px;font-size:13px"></span></p><form id="invite"><label for="invite-email">招待する本人のメールアドレス</label><input id="invite-email" type="email" required autocomplete="off"><button type="submit">招待メールを送信（v6）</button></form><hr><form id="approve"><label for="email">本人の登録済みメールアドレス</label><input type="email" id="email" required autocomplete="off"><button type="submit">本人の編集権限を承認</button></form><button id="revoke" class="secondary" type="button">編集権限を停止（運営管理に戻す）</button><p id="status" role="status"></p><p><a href="admin.html">優織さん管理ページ</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-adapter.js"></script><script>const client=yuoriClient(),status=document.getElementById('status');async function checkMaster(){const el=document.getElementById('login-status');const {data:{user}}=await client.auth.getUser();if(!user){el.textContent='現在ログインしていません。優織さん管理ページから運営アカウントでログインしてください。';return}const {data,error}=await client.from('therapist_admin_roles').select('role').eq('user_uid',user.id).eq('role','master').maybeSingle();el.textContent='ログイン中：'+(user.email||'メール不明')+' ／ 運営権限：'+(data?'master確認済み':error?'確認不可（'+error.message+' / '+(error.code||'コードなし')+'）':'master未登録');}checkMaster().catch(err=>{document.getElementById('login-status').textContent='ログイン状態の確認に失敗しました：'+err.message});async function run(name,args){status.textContent='処理中…';try{const {data:{user}}=await client.auth.getUser();if(!user)throw Error('運営管理者としてログインしてください');const {error}=await client.rpc(name,args);if(error)throw error;status.textContent='操作が完了しました'}catch(e){status.textContent='操作できませんでした：'+e.message}}document.getElementById('invite').onsubmit=async e=>{e.preventDefault();const email=document.getElementById('invite-email').value.trim();if(!confirm(email+' に招待メールを送信しますか？'))return;status.textContent='送信中…';try{const {data:{session}}=await client.auth.getSession();if(!session)throw Error('運営管理者としてログインしてください');const response=await fetch(YUORI_DB.url+'/functions/v1/yun-invite',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':YUORI_DB.anonKey},body:JSON.stringify({email})});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error('HTTP '+response.status+' '+raw.slice(0,150))}if(!response.ok||data?.message!=='Invitation email sent')throw Error(data?.message||'HTTP '+response.status);status.textContent='招待メールを送信しました。本人の初期設定後に承認してください。'}catch(err){status.textContent='招待できませんでした（v3）：'+err.message}};document.getElementById('approve').onsubmit=e=>{e.preventDefault();if(!confirm('入力したメールアドレスに優織さんページの編集権限を付与しますか？'))return;run('master_assign_therapist_owner',{p_therapist_key:'yuori',p_email:document.getElementById('email').value.trim()})};document.getElementById('revoke').onclick=()=>{if(confirm('優織さんの編集権限を停止しますか？'))run('master_revoke_therapist_owner',{p_therapist_key:'yuori'})};</script></body></html>
