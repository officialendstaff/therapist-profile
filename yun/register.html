<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>優織｜初期アカウント登録</title><style>body{font-family:'Yu Mincho',serif;background:#fbe8ef;color:#755623;margin:0;padding:24px}main{max-width:430px;margin:6vh auto;background:#fff8fa;padding:24px;border-radius:16px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:1px solid #b18b49;font-size:16px}button{margin-top:24px;background:#d63365;color:white;border:0;cursor:pointer}p{line-height:1.7}</style></head><body><main><h1>優織｜初期登録</h1><p>登録後、運営側による管理権限の設定が完了するまで編集できません。登録には運営からの案内が必要です。</p><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required><label for="password">パスワード（12文字以上）</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button>アカウント登録</button></form><p id="status" role="status" aria-live="polite"></p><a href="admin.html">管理ページへ戻る</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-adapter.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status'),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='確認用パスワードが一致しません';return}const button=e.target.querySelector('button');button.disabled=true;status.textContent='登録処理中…';try{const {error}=await yuoriClient().auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/therapist-profile/yun/admin.html'}});if(error)throw error;status.textContent='登録を受け付けました。メール認証が必要な場合は受信メールをご確認ください。編集権限は運営による紐付け後に有効になります。';e.target.reset()}catch(err){status.textContent='登録できませんでした：'+err.message}finally{button.disabled=false}};</script></body></html>
