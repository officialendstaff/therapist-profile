<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>優織｜初期アカウント登録</title><style>body{font-family:'Yu Mincho',serif;background:#fbe8ef;color:#755623;margin:0;padding:24px}main{max-width:430px;margin:6vh auto;background:#fff8fa;padding:24px;border-radius:16px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:1px solid #b18b49;font-size:16px}button{margin-top:24px;background:#d63365;color:white;border:0;cursor:pointer}p{line-height:1.7}</style></head><body><main><h1>優織｜招待者専用の初期設定</h1><p>登録後、運営側による管理権限の設定が完了するまで編集できません。登録には運営からの案内が必要です。</p><form id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required><label for="password">パスワード（12文字以上）</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button>アカウント登録</button></form><p id="status" role="status" aria-live="polite"></p><a href="admin.html">管理ページへ戻る</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-adapter.js"></script><script>
const client=yuoriClient(),status=document.getElementById('status'),form=document.getElementById('form');
const token=new URLSearchParams(location.search).get('invite')||sessionStorage.getItem('yun_invite');
if(token&&token.length>=32)sessionStorage.setItem('yun_invite',token);
else {form.hidden=true;status.textContent='有効な招待URLから開いてください。'}
document.querySelector('main>p').textContent='招待URLからメールアドレスとパスワードを登録してください。メール認証後に管理権限を有効化します。';
const claim=document.createElement('button');claim.textContent='メール認証済み：管理権限を有効化';claim.hidden=true;form.after(claim);
claim.onclick=async()=>{const {data:{user}}=await client.auth.getUser();if(!user){status.textContent='メール認証後に再度開いてください';return}const {error}=await client.rpc('yun_claim_invite',{p_token:token});if(error){status.textContent='有効化できません：'+error.message;return}sessionStorage.removeItem('yun_invite');location.replace('admin.html')};
form.onsubmit=async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='パスワードが一致しません';return}const button=form.querySelector('button');button.disabled=true;const {error}=await client.auth.signUp({email:document.getElementById('email').value.trim(),password,options:{emailRedirectTo:location.origin+location.pathname}});button.disabled=false;status.textContent=error?'登録失敗：'+error.message:'確認メールを送信しました。メール内のリンクから戻り、管理権限を有効化してください。';if(!error)claim.hidden=false};
client.auth.getUser().then(({data:{user}})=>{if(user&&token){claim.hidden=false;status.textContent='メール認証済みの場合は管理権限を有効化してください。'}});
</script></body></html>
