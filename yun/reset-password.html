<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゆん｜パスワード再設定</title><style>body{background:#fbe8ef;color:#755623;font:16px 'Yu Mincho',serif;padding:20px}main{max-width:440px;margin:6vh auto;padding:25px;background:#fff9fc;border-radius:16px}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font-size:16px}input{border:1px solid #b18b49}button{background:#d63365;border:0;color:white;margin-top:20px}p{line-height:1.7}</style></head><body><main><h1>ゆん｜パスワード再設定</h1><div id="request"><p>登録済みメールアドレスへパスワード再設定リンクを送信します。</p><form id="send"><label for="email">メールアドレス</label><input id="email" type="email" required autocomplete="email"><button>再設定メールを送信</button></form></div><div id="change" hidden><p>新しいパスワードを入力してください。</p><form id="update"><label for="password">新しいパスワード（12文字以上）</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><label for="confirm">パスワード確認</label><input id="confirm" type="password" minlength="12" required autocomplete="new-password"><button>パスワードを変更</button></form></div><p id="status" role="status" aria-live="polite"></p><a href="admin.html">管理ページへ</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-adapter.js"></script><script>const client=yuoriClient(),status=document.getElementById('status');let recovery=false;function showRecovery(){recovery=true;document.getElementById('request').hidden=true;document.getElementById('change').hidden=false}client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery()});if(location.hash.includes('type=recovery'))showRecovery();document.getElementById('send').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+'/therapist-profile/yun/reset-password.html'});if(error)throw error;status.textContent='登録状況にかかわらず、送信可能なアカウントには再設定メールが届きます。メールをご確認ください。'}catch(err){status.textContent='送信できませんでした：'+err.message}finally{btn.disabled=false}};document.getElementById('update').onsubmit=async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){status.textContent='パスワードが一致しません';return}const btn=e.target.querySelector('button');btn.disabled=true;try{const {error}=await client.auth.updateUser({password});if(error)throw error;status.textContent='パスワードを変更しました。管理ページからログインしてください。';e.target.reset()}catch(err){status.textContent='変更できませんでした：'+err.message}finally{btn.disabled=false}};</script></body></html>
